# Project-level config for the OpenAI Codex CLI.
# Codex reads AGENTS.md, the canonical agent contract; keep rules there, not here.
# Model selection is left to the local Codex profile; repo model IDs are generated
# from packages/ai/model-registry, never pinned in this file.

[history]
persistence = "save-all"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]
