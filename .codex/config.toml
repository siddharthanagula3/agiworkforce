# AGI Workforce — Codex CLI Configuration
#
# Project-level config for OpenAI Codex CLI.
# Docs: https://github.com/openai/codex
#
# Monorepo: Tauri v2 desktop (Rust + React/TS), Next.js web, React Native mobile,
# Chrome extension, VS Code extension, Express API gateway.

# Model selection is intentionally left to the local Codex CLI/default profile.
# Do not pin guessed model IDs here; repo model IDs live in packages/types/src/models.json.
model_reasoning_effort = "medium"

# History - persistent instructions applied to every session
[history]
persistence = "save-all"
persistent_instructions = """
Follow AGI Workforce project rules:

1. Architecture: Tauri v2 desktop app — Rust backend (src-tauri/) + React 19 / TypeScript frontend (src/). Next.js 16 web app. React Native + Expo mobile app.
2. Security-First: All secrets through SecretManager (Argon2id + AES-GCM). Never hardcode API keys. Use ToolGuard for tool execution. Validate all inputs. No eval() or dynamic code execution from user input.
3. Conventional commits enforced: type(scope): lowercase subject (max 100 chars). Types: feat|fix|chore|docs|refactor|test|perf|ci|build|style. Subject MUST be lowercase.
4. Rust: Follow Tauri v2 patterns. #[tauri::command] for invoke handlers. snake_case. deny(unsafe_code, dead_code, unused_imports, unused_variables, unused_mut). All warnings are errors.
5. TypeScript: strict mode, named exports, absolute imports from src/. React: functional components only. Tailwind CSS 4 for styling. Zustand v5 + Immer for state.
6. IPC Rule: All invoke() calls in TypeScript MUST use camelCase param keys. Tauri auto-converts from Rust snake_case. Snake_case in invoke() silently fails.
7. Model IDs come from packages/types/src/models.json and provider capability metadata. Never invent, guess, or hardcode model IDs from training data.
8. Next.js 16 uses proxy.ts with an exported proxy function. Do not rename it back to middleware.ts.
9. Local, BYOK, and Managed Cloud are separate trust boundaries. Never silently route Local chats, files, or developer sessions to BYOK or managed cloud.
10. Managed cloud, compute credits, top-ups, subscriptions, and provider-funded compute stay waitlist/private beta until ledgering, abuse, fraud, refunds, chargebacks, provider terms, retention, and deletion controls are proven.
11. Verify fast-moving facts from repo files, official docs, web search, or configured MCP/plugins before changing APIs, models, pricing, App Store rules, provider terms, framework behavior, or release claims.
12. Build/check commands: pnpm check:llm-operability, pnpm lint, pnpm typecheck:all, pnpm test, cargo check --workspace, plus surface commands from docs/agent-context/commands.json.
13. Error handling: handle at every level, never swallow errors. Rust: use anyhow/thiserror. TypeScript: proper try/catch with user-facing error messages.
"""

# MCP Servers
[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]

[mcp_servers.memory]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[mcp_servers.sequential-thinking.tools.sequentialthinking]
approval_mode = "approve"

# Supabase MCP server is disabled — `supabase-mcp-server@latest` is not
# published on npm (404). The hosted URL transport at https://mcp.supabase.com/mcp
# requires OAuth and Codex doesn't yet support it as a stdio target. Re-enable
# when either (a) a real stdio package ships on npm, or (b) Codex adds
# transport support for URL-based MCP servers with OAuth.
# [mcp_servers.supabase]
# command = "npx"
# args = ["-y", "supabase-mcp-server@latest", "--read-only"]
