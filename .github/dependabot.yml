version: 2
# `open-pull-requests-limit: 5` on every ecosystem lets Dependabot open up
# to five pull requests per ecosystem. Merging one never deploys: git
# deployments are off in vercel.json (git.deploymentEnabled: false), and
# production deploys go through the founder-gated CLI path.
updates:
  # ─── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      actions-patch-minor:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      actions-major:
        applies-to: version-updates
        update-types:
          - 'major'

  # ─── Cargo (Rust), root workspace (apps/cli, crates/*) ─────────────────────
  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'rust'
    groups:
      rust-patch-minor:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      rust-major:
        applies-to: version-updates
        update-types:
          - 'major'

  # ─── Cargo (Rust), apps/desktop/src-tauri ──────────────────────────────────
  - package-ecosystem: 'cargo'
    directory: '/apps/desktop/src-tauri'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'rust'
    groups:
      # Group all Tauri crates together, they must be upgraded as a set
      tauri-ecosystem:
        applies-to: version-updates
        patterns:
          - 'tauri'
          - 'tauri-*'
      rust-patch-minor:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      rust-major:
        applies-to: version-updates
        update-types:
          - 'major'
    ignore:
      # Tauri major bumps require coordinated upgrade with tauri-plugin-* and tauri-build.
      # Managed via the tauri-ecosystem group above; block individual major bumps here.
      - dependency-name: 'tauri'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tauri-build'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tauri-plugin-*'
        update-types: ['version-update:semver-major']

  # ─── npm / pnpm, root workspace ────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'javascript'
    groups:
      js-patch-minor:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      js-major:
        applies-to: version-updates
        update-types:
          - 'major'
    ignore:
      # Major bumps for the entire JS ecosystem require manual review
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq / GHSA-jmr9-qjv8-65gv: no
      # patched release exists yet for these three advisories (see the
      # auditConfig.ignoreGhsas comment in the root package.json). Mirrored
      # here so Dependabot does not raise unfillable security PRs; remove
      # once image-size and extract-zip publish a patched version.
      - dependency-name: 'image-size'
      - dependency-name: 'extract-zip'

  # ─── npm / pnpm, apps/desktop ──────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/apps/desktop'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'javascript'
      - 'desktop'
    groups:
      # All @tauri-apps/* JS packages must move together with the Rust crates
      tauri-js-ecosystem:
        applies-to: version-updates
        patterns:
          - '@tauri-apps/*'
      desktop-patch-minor:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      desktop-major:
        applies-to: version-updates
        update-types:
          - 'major'
    ignore:
      # @tauri-apps major bumps must be coordinated with Cargo tauri upgrade
      - dependency-name: '@tauri-apps/*'
        update-types: ['version-update:semver-major']
      # Vite and React major bumps require manual review
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']

  # ─── npm / pnpm, apps/web ──────────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/apps/web'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'javascript'
      - 'web'
    groups:
      web-patch-minor:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      web-major:
        applies-to: version-updates
        update-types:
          - 'major'
    ignore:
      # Next.js major upgrades require App Router migration review
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']

  # ─── npm / pnpm, apps/mobile ────────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/apps/mobile'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'javascript'
      - 'mobile'
    groups:
      mobile-patch-minor:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      mobile-major:
        applies-to: version-updates
        update-types:
          - 'major'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # ─── npm / pnpm, apps/extension ────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/apps/extension'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'javascript'
      - 'extension'
    groups:
      extension-patch-minor:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      extension-major:
        applies-to: version-updates
        update-types:
          - 'major'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # ─── npm / pnpm, packages/contracts/types ────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/packages/contracts/types'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'javascript'
    groups:
      types-patch-minor:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # ─── npm / pnpm, packages/platform/utils ────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/packages/platform/utils'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'javascript'
    groups:
      utils-patch-minor:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # ─── npm / pnpm, services/signaling-server ─────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/services/signaling-server'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'javascript'
      - 'services'
    groups:
      signaling-patch-minor:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      signaling-major:
        applies-to: version-updates
        update-types:
          - 'major'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
