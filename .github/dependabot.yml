version: 2
# `open-pull-requests-limit: 5` on every ecosystem lets Dependabot open up
# to five pull requests per ecosystem. Merging one never deploys: git
# deployments are off in vercel.json (git.deploymentEnabled: false), and
# production deploys go through the founder-gated CLI path.
updates:
  # ─── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      actions-patch-minor:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      actions-major:
        applies-to: version-updates
        update-types:
          - 'major'

  # ─── Cargo (Rust), root workspace (apps/cli, crates/*) ─────────────────────
  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'rust'
    groups:
      tauri-ecosystem:
        applies-to: version-updates
        patterns:
          - 'tauri'
          - 'tauri-*'
      rust-patch-minor:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      rust-major:
        applies-to: version-updates
        update-types:
          - 'major'
    ignore:
      # Held back on purpose: sysinfo 0.39 needs rustc 1.95 (toolchain pins 1.94),
      # schemars 1 and ts-rs 12 need a migration of the protocol crate's custom
      # impls, lopdf 0.44 does not compile against its own time crate, bincode 3.0.0
      # is a compile_error! poison release, cpal 0.16+ links ALSA twice on Linux,
      # and llama-cpp-sys-2 must match the llama-cpp-2 binding exactly.
      - dependency-name: 'sysinfo'
      - dependency-name: 'schemars'
      - dependency-name: 'ts-rs'
      - dependency-name: 'lopdf'
      - dependency-name: 'bincode'
      - dependency-name: 'cpal'
      - dependency-name: 'llama-cpp-sys-2'
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tauri'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tauri-build'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tauri-plugin-*'
        update-types: ['version-update:semver-major']

  # ─── npm / pnpm, root workspace ────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'javascript'
    groups:
      tauri-js-ecosystem:
        applies-to: version-updates
        patterns:
          - '@tauri-apps/*'
      js-patch-minor:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      js-major:
        applies-to: version-updates
        update-types:
          - 'major'
    ignore:
      # Major bumps for the entire JS ecosystem require manual review
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq / GHSA-jmr9-qjv8-65gv: no
      # patched release exists yet for these three advisories (see the
      # auditConfig.ignoreGhsas comment in the root package.json). Mirrored
      # here so Dependabot does not raise unfillable security PRs; remove
      # once image-size and extract-zip publish a patched version.
      - dependency-name: 'image-size'
      - dependency-name: 'extract-zip'
      # mermaid 12 switches diagrams to the ELK layout and raises the browser floor to
      # Safari 17.4; taking it is a product change, held with the root override.
      - dependency-name: 'mermaid'
        update-types: ['version-update:semver-major']
      # react and react-dom are pinned exactly by the root override, so a manifest
      # bump changes nothing installed.
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'expo'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-reanimated'
      - dependency-name: '@react-native/*'
      - dependency-name: 'react-native-worklets'
      - dependency-name: '@types/react'
      - dependency-name: '@react-native-community/slider'
      - dependency-name: '@shopify/flash-list'
      - dependency-name: 'react-native-safe-area-context'
      - dependency-name: 'react-native-screens'
      - dependency-name: 'react-native-svg'
      - dependency-name: 'react-native-webview'
      # apps/extension-vscode types against its engines floor (vsce refuses a
      # higher @types/vscode); the extension tests pin the range.
      - dependency-name: '@types/vscode'
      - dependency-name: '@tauri-apps/*'
        update-types: ['version-update:semver-major']
      # Vite and React major bumps require manual review
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']

  # ─── Docker, services/upload-scanner base image digest ─────────────────────
  - package-ecosystem: 'docker'
    directory: '/services/upload-scanner'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'docker'
      - 'services'
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
