version: 2
# `open-pull-requests-limit: 5` on every ecosystem lets Dependabot open up
# to five pull requests per ecosystem. Merging one never deploys: git
# deployments are off in vercel.json (git.deploymentEnabled: false), and
# production deploys go through the founder-gated CLI path.
# `cooldown: default-days: 7` matches pnpm's minimumReleaseAge: a release must
# be a week old before a version-update PR opens. Security updates are exempt.
updates:
  # ─── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      actions-patch-minor:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      actions-major:
        applies-to: version-updates
        update-types:
          - 'major'

  # ─── Cargo (Rust), root workspace (apps/cli, crates/*) ─────────────────────
  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'rust'
    groups:
      tauri-ecosystem:
        applies-to: version-updates
        patterns:
          - 'tauri'
          - 'tauri-*'
      rust-patch-minor:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      rust-major:
        applies-to: version-updates
        update-types:
          - 'major'
    ignore:
      # Held back on purpose: sysinfo 0.39 needs rustc 1.95 (toolchain pins 1.94),
      # schemars 1 and ts-rs 12 need a migration of the protocol crate's custom
      # impls, lopdf 0.44 does not compile against its own time crate, bincode 3.0.0
      # is a compile_error! poison release, cpal 0.16+ links ALSA twice on Linux,
      # and llama-cpp-sys-2 must match the llama-cpp-2 binding exactly.
      - dependency-name: 'sysinfo'
      - dependency-name: 'schemars'
      - dependency-name: 'ts-rs'
      - dependency-name: 'lopdf'
      - dependency-name: 'bincode'
      - dependency-name: 'cpal'
      - dependency-name: 'llama-cpp-sys-2'
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tauri'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tauri-build'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tauri-plugin-*'
        update-types: ['version-update:semver-major']

  # ─── npm / pnpm, root workspace ────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'javascript'
    groups:
      tauri-js-ecosystem:
        applies-to: version-updates
        patterns:
          - '@tauri-apps/*'
      js-patch-minor:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      js-major:
        applies-to: version-updates
        update-types:
          - 'major'
    ignore:
      # Major bumps for the entire JS ecosystem require manual review
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # mermaid 12 switches diagrams to the ELK layout and raises the browser floor to
      # Safari 17.4; taking it is a product change, held with the root override.
      - dependency-name: 'mermaid'
        update-types: ['version-update:semver-major']
      # react and react-dom are pinned exactly by the root override, so a manifest
      # bump changes nothing installed.
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'expo'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-reanimated'
      - dependency-name: '@react-native/*'
      - dependency-name: 'react-native-worklets'
      - dependency-name: '@types/react'
      - dependency-name: '@react-native-community/slider'
      - dependency-name: '@shopify/flash-list'
      - dependency-name: 'react-native-safe-area-context'
      - dependency-name: 'react-native-screens'
      - dependency-name: 'react-native-svg'
      - dependency-name: 'react-native-webview'
      # apps/extension-vscode types against its engines floor (vsce refuses a
      # higher @types/vscode); the extension tests pin the range.
      - dependency-name: '@types/vscode'
      # Expo SDK 57 fixes the versions of these apps/mobile packages; `expo install`
      # owns them, so they move with the SDK upgrade, not one by one.
      - dependency-name: '@expo/dom-webview'
      - dependency-name: '@expo/metro-runtime'
      - dependency-name: '@react-native-community/datetimepicker'
      - dependency-name: '@react-native-community/netinfo'
      - dependency-name: 'expo-age-range'
      - dependency-name: 'expo-apple-authentication'
      - dependency-name: 'expo-asset'
      - dependency-name: 'expo-audio'
      - dependency-name: 'expo-background-task'
      - dependency-name: 'expo-build-properties'
      - dependency-name: 'expo-calendar'
      - dependency-name: 'expo-camera'
      - dependency-name: 'expo-clipboard'
      - dependency-name: 'expo-constants'
      - dependency-name: 'expo-crypto'
      - dependency-name: 'expo-dev-client'
      - dependency-name: 'expo-document-picker'
      - dependency-name: 'expo-file-system'
      - dependency-name: 'expo-font'
      - dependency-name: 'expo-haptics'
      - dependency-name: 'expo-image'
      - dependency-name: 'expo-image-picker'
      - dependency-name: 'expo-linking'
      - dependency-name: 'expo-local-authentication'
      - dependency-name: 'expo-localization'
      - dependency-name: 'expo-media-library'
      - dependency-name: 'expo-notifications'
      - dependency-name: 'expo-print'
      - dependency-name: 'expo-router'
      - dependency-name: 'expo-secure-store'
      - dependency-name: 'expo-sharing'
      - dependency-name: 'expo-speech'
      - dependency-name: 'expo-splash-screen'
      - dependency-name: 'expo-sqlite'
      - dependency-name: 'expo-status-bar'
      - dependency-name: 'expo-system-ui'
      - dependency-name: 'expo-task-manager'
      - dependency-name: 'expo-updates'
      - dependency-name: 'expo-web-browser'
      - dependency-name: 'react-native-gesture-handler'
      - dependency-name: 'jest-expo'
      - dependency-name: 'babel-preset-expo'
      # @clerk/expo 4.11 moves AuthView into @clerk/expo-native-components, which
      # needs a native build; held on ~4.10 until that build is ready.
      - dependency-name: '@clerk/expo'
        update-types: ['version-update:semver-minor']
      # react-test-renderer is pinned exactly by the root override to match react.
      - dependency-name: 'react-test-renderer'
      # 0.x minors that change behaviour, held until their call sites are reviewed:
      # katex rendering, the MCP tasks extension wire types, and the TypeSafe SDK.
      - dependency-name: 'katex'
        update-types: ['version-update:semver-minor']
      - dependency-name: '@modelcontextprotocol/ext-tasks'
        update-types: ['version-update:semver-minor']
      - dependency-name: '@typesafe-ai/sdk'
        update-types: ['version-update:semver-minor']
      - dependency-name: '@tauri-apps/*'
        update-types: ['version-update:semver-major']
      # Vite and React major bumps require manual review
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']

  # ─── Docker, services/upload-scanner base image digest ─────────────────────
  - package-ecosystem: 'docker'
    directory: '/services/upload-scanner'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'docker'
      - 'services'
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
