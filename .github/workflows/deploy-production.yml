name: Deploy Production Surfaces

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  # A promotion that never runs is silent: when CI is not green on a main push
  # the jobs below evaluate their `if` to false and the whole run reports
  # `skipped`, which GitHub does not alert on. This schedule is the alarm, it
  # asks production which commit it is serving and fails when that is not main.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: production-surfaces
  # Not cancel-in-progress. A cancelled run is not a failed run, so `failure()`
  # is false and the rollback step below never fires, a second push landing
  # while the gate is still probing would leave the rejected build promoted
  # with nothing to revert it. Production promotions queue instead.
  cancel-in-progress: false

permissions:
  contents: read
  # Read-only, and only so the scope job can ask which commit each surface was
  # last deployed from. It grants no ability to start, cancel, or alter runs.
  actions: read

jobs:
  # Deliberately probes the public apex, not a `*.vercel.app` alias: the aliases
  # sit behind Deployment Protection, and the apex is what real users get. It
  # needs no Vercel credential for the same reason.
  production-drift:
    name: Alarm when production is not serving main
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL || 'https://agiworkforce.com' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Self-test the production serving-path verifier
        run: node --test scripts/verify-deployment.test.mjs

      - name: Compare the commit production serves against main
        id: drift
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          node scripts/verify-deployment.mjs "$PRODUCTION_WEB_URL" "$head_sha"

      # The `/v1/*` aliases exist only as host-scoped rewrites, so nothing but a
      # request carrying the real `api.` Host header exercises them. A
      # `*.vercel.app` probe cannot: it fails the host condition and falls
      # through to the app's not-found page, which is exactly the regression
      # this step exists to catch.
      - name: Verify the API host serves the OpenAI-compatible aliases
        id: api-host
        shell: bash
        run: node scripts/verify-deployment.mjs --api-host "$PRODUCTION_WEB_URL"

      - name: Record the production drift check
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ steps.drift.outputs.head_sha }}
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
          API_HOST_OUTCOME: ${{ steps.api-host.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$API_HOST_OUTCOME" = "failure" ]; then
            echo "::error::the API host is not serving /v1/*; the host-scoped rewrite is inert"
          fi
          if [ "$DRIFT_OUTCOME" = "success" ]; then
            verdict="production serves main HEAD"
          else
            verdict="production is NOT serving main HEAD; the promotion has not happened"
            echo "::error::$verdict (main is ${HEAD_SHA:-unknown}; see the step log for the commit production reports)"
          fi
          {
            echo "## Production drift check"
            echo
            echo "- Origin: $PRODUCTION_WEB_URL"
            echo "- main HEAD: \`${HEAD_SHA:-unknown}\`"
            echo "- Serving path: probed via /api/health plus authenticated routes"
            echo "- API host /v1/* aliases: $API_HOST_OUTCOME"
            echo "- Verdict: $verdict"
          } >> "$GITHUB_STEP_SUMMARY"

  scope:
    name: Select production surfaces
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.scope.outputs.web }}
      sandbox: ${{ steps.sandbox.outputs.sandbox }}
    steps:
      - name: Checkout the CI-verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history. The baseline below is the commit a surface was last
          # deployed from, which can be many commits back, and a shallow
          # checkout cannot diff against it.
          fetch-depth: 0

      - name: Self-test the deploy scope selector
        run: node --test scripts/production-deploy-scope.test.mjs

      # Measured from what each surface last actually SHIPPED, not from HEAD^.
      # A commit that lands while CI is red never deploys, so a one-commit diff
      # strands it permanently, that is what kept the argon2 outage fix
      # unshipped after CI went green on a commit that touched only scripts/.
      - name: Select affected production surfaces
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production-deploy-baseline.mjs >> "$GITHUB_OUTPUT"

      # The artifact sandbox origin, measured the same way as the web surface
      # above: from the commit this surface last actually SHIPPED from, resolved
      # out of its own deploy job's history. A one-commit diff would strand a
      # sandbox change that landed while CI was red, the next green commit's
      # HEAD^..HEAD never mentions infrastructure/sandbox again. Fails open to
      # deploy=true on any error, exactly as the web baseline does.
      - name: Select the artifact sandbox surface
        id: sandbox
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production-deploy-scope.mjs --shipped sandbox >> "$GITHUB_OUTPUT"

  deploy-web:
    name: Deploy verified web artifact
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production-web
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      AGI_DATABASE_URL: ${{ secrets.AGI_DATABASE_URL }}
      PAGER_WEBHOOK_URL: ${{ secrets.PAGER_WEBHOOK_URL }}
    steps:
      - name: Checkout the CI-verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Require the protected Vercel deployment contract
        shell: bash
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID AGI_DATABASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required in the production-web environment"
              exit 1
            fi
          done

      - name: Self-test the production serving-path verifier
        run: node --test scripts/verify-deployment.test.mjs

      - name: Self-test the environment drift reconciler
        run: node --test scripts/check-env-drift.test.mjs

      # Pre-flight, before anything is built. The 6-hourly reconcile catches a
      # deleted variable up to six hours late; this catches it before the build
      # that would boot without it reaches production.
      - name: Reconcile production env against the declared contract
        run: node scripts/check-env-drift.mjs --scope web --target production

      - name: Install migration-ledger dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the production schema ledger without mutation
        run: pnpm db:migrate -- verify

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.4.0

      - name: Pull production project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"

      # Captured BEFORE the promotion. The source is the project's production
      # TARGET (`/v9/projects/{id}` -> `targets.production.id`), which is the
      # deployment currently assigned to the production domains, not the
      # newest-created ready production deployment. Those differ after any
      # rollback: the deployment that was rolled back away from stays READY and
      # target=production and is newer, so "newest ready" would hand the next
      # failure the exact build the previous run rejected.
      #
      # Failure modes are distinguishable here, which is why the two branches
      # differ. A wrong VERCEL_PROJECT_ID, a token scoped elsewhere, or a team
      # project reached without a team scope all answer 4xx and fail the job
      # before anything is built. Only a project that has genuinely never had a
      # production deployment answers 200 with a null production target.
      - name: Record the currently serving production deployment
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          async function main() {
            const query = new URLSearchParams();
            // Only a team scope is a valid teamId; a personal account has none.
            if (process.env.VERCEL_ORG_ID.startsWith('team_')) {
              query.set('teamId', process.env.VERCEL_ORG_ID);
            }

            const projectId = encodeURIComponent(process.env.VERCEL_PROJECT_ID);
            const response = await fetch(
              `https://api.vercel.com/v9/projects/${projectId}?${query}`,
              { headers: { authorization: `Bearer ${process.env.VERCEL_TOKEN}` } },
            );
            if (!response.ok) {
              throw new Error(
                `Vercel project lookup returned ${response.status}; refusing to deploy ` +
                  'without a known rollback target',
              );
            }

            const project = await response.json();
            const current = project?.targets?.production;
            if (!current?.id) {
              console.log('::warning::Project has no production target yet; first deploy');
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `deployment_id=${current?.id ?? ''}\n`);
          }

          main().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Build the production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"

      - name: Deploy the prebuilt artifact
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(
            vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
          )"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Deployed $deployment_url"

      # This project has autoAssignCustomDomains disabled, so `vercel deploy
      # --prod` only leaves a READY production deployment: it never takes
      # agiworkforce.com. Production served the 23 August build through every
      # deploy between then and 2026-09-06 for exactly that reason, and the
      # verify step below could not see it because it probed the deployment's
      # own URL rather than the domain. Promotion has to be explicit here.
      - name: Promote the deployment to the production domains
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: >-
          vercel promote "$DEPLOYMENT_URL" --yes --timeout 10m
          --token="$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"

      # `/api/health` imports no auth code, so it stayed green through an outage
      # that 500'd every authenticated route. This probes health plus two routes
      # whose module graph reaches lib/api-auth.
      #
      # Deliberately the public apex, not `steps.deploy.outputs.url`. The
      # project's SSO protection is set to `all_except_custom_domains`, so every
      # `*.vercel.app` deployment URL answers 401 to an unauthenticated probe and
      # the gate could never pass against one: on 2026-09-06 it failed all nine
      # attempts on a healthy build and rolled a good deploy back. Custom domains
      # are exempt, and the apex is what real users get.
      #
      # Probing the apex would otherwise accept an older build still aliased
      # there, so the deployed SHA is asserted too. `--await-promotion` makes a
      # mismatch retryable for this window only: the alias moves a moment after
      # `vercel deploy --prod` returns, and without it a brief lag reads as a
      # failed promotion and reverts a good build. The scheduled drift alarm
      # above passes no such flag and still fails on the first mismatch.
      - name: Verify the production serving path
        id: verify
        env:
          PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL || 'https://agiworkforce.com' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          node scripts/verify-deployment.mjs --await-promotion
          "$PRODUCTION_WEB_URL" "$HEAD_SHA"

      - name: Record the migration state this deployment serves
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          pnpm db:migrate -- record --surface web --commit "$HEAD_SHA"
          --target production --confirm-production --deployment-ref "$DEPLOYMENT_URL"

      - name: Roll back to the last verified production deployment
        id: rollback
        if: >-
          ${{ failure() && steps.deploy.outputs.url != '' &&
          steps.previous.outputs.deployment_id != '' }}
        env:
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.previous.outputs.deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Production verification failed; reverting to $PREVIOUS_DEPLOYMENT_ID"
          vercel rollback "$PREVIOUS_DEPLOYMENT_ID" --yes --timeout 10m --token="$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"

      # Runs on the failure path too, the rollback target is exactly what a
      # human needs when the gate rejected a build. Skipped only when nothing
      # was promoted, or when the run was cancelled.
      - name: Record deployment summary
        if: ${{ !cancelled() && steps.deploy.outputs.url != '' }}
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.previous.outputs.deployment_id }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$VERIFY_OUTCOME" = "success" ]; then
            serving_path="health plus authenticated routes verified"
          else
            serving_path="FAILED ($VERIFY_OUTCOME)"
          fi
          case "$ROLLBACK_OUTCOME" in
            success) rollback="reverted to \`$PREVIOUS_DEPLOYMENT_ID\`" ;;
            failure) rollback="ATTEMPTED AND FAILED; production may still serve the rejected build" ;;
            *) rollback="not run; target was \`${PREVIOUS_DEPLOYMENT_ID:-none}\`" ;;
          esac
          {
            echo "## Production web deployment"
            echo
            echo "- Commit: \`$DEPLOYMENT_SHA\`"
            echo "- Artifact: prebuilt and CI verified"
            echo "- URL: $DEPLOYMENT_URL"
            echo "- Serving path: $serving_path"
            echo "- Rollback: $rollback"
          } >> "$GITHUB_STEP_SUMMARY"

  # infrastructure/sandbox is the separate origin that isolates every
  # model-generated HTML, React and SVG artifact from the web app's session, and
  # the CSP in its vercel.json is that isolation boundary. It had a .vercel link
  # but no pipeline, so it reached production only when someone ran the CLI by
  # hand, and its deployed CSP had already drifted from the repo. Same gate as
  # every other surface here: `needs: scope`, whose `if` admits only a green,
  # push-triggered CI run on main from this repository, and whose checkout is
  # that exact commit.
  deploy-sandbox:
    name: Deploy artifact sandbox origin
    needs: scope
    if: needs.scope.outputs.sandbox == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # production-web is the environment that holds the Vercel credential for
    # this team; env-drift.yml and clerk-bot-protection.yml reach it the same
    # way. Only the token is inherited, see the project-link step below.
    environment:
      name: production-web
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PRODUCTION_SANDBOX_URL: >-
        ${{ vars.PRODUCTION_SANDBOX_URL || 'https://sandbox.agiworkforce.com' }}
    steps:
      - name: Checkout the CI-verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Require the protected Vercel deployment contract
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is required in the production-web environment"
            exit 1
          fi

      # Deliberately NOT inheriting the environment's VERCEL_PROJECT_ID: that one
      # names the web project, and a sandbox deploy carrying it would publish the
      # sandbox origin's files into agiworkforce-chat. The tracked
      # infrastructure/sandbox/deploy-target.json is the only authority for which
      # project this surface is, and the name assertion makes a silently
      # retargeted file fail the job instead of deploying somewhere else.
      #
      # It is a tracked file rather than the CLI's own link directory because
      # that directory is git-ignored: it exists only in whoever ran `vercel
      # link`'s working tree, so reading it here would ENOENT on every fresh
      # checkout. Project and org ids are configuration, not credentials.
      - name: Resolve the sandbox project link
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_ENV"
          const fs = require('node:fs');

          const link = JSON.parse(
            fs.readFileSync('infrastructure/sandbox/deploy-target.json', 'utf8'),
          );
          if (link.projectName !== 'agiworkforce-sandbox') {
            console.error(
              `Refusing to deploy: infrastructure/sandbox is linked to ${link.projectName}`,
            );
            process.exit(1);
          }
          console.log(`VERCEL_ORG_ID=${link.orgId}`);
          console.log(`VERCEL_PROJECT_ID=${link.projectId}`);
          NODE

      # 58.4.0 exactly, as deploy-web pins it. Newer globals die during packaging
      # with a misleading `"maxDuration" is not a number`.
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.4.0

      # `vercel deploy` run anywhere inside this checkout picks up the repo's git
      # metadata and attaches it to the deployment; vercel.json disables git
      # deployments for main, so the deployment lands in state BLOCKED with no
      # build and no logs. deploy-web escapes that by listing .git and .github in
      # the root .vercelignore. infrastructure/sandbox has no .vercelignore of its
      # own, so it is staged into RUNNER_TEMP instead, where no ancestor is a git
      # worktree, and the check below proves that rather than assuming it.
      - name: Stage the sandbox origin outside the git worktree
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/sandbox-origin"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp -R infrastructure/sandbox/. "$staging/"
          rm -rf "$staging/.turbo"
          # outputDirectory is "." for this project, so anything left in the
          # staged tree is served from the public origin. The deploy target is
          # build-time configuration; it has no business being fetchable.
          rm -f "$staging/deploy-target.json"
          if git -C "$staging" rev-parse --git-dir >/dev/null 2>&1; then
            echo "::error::staged sandbox tree is still inside a git worktree; deploy would be BLOCKED"
            exit 1
          fi

      - name: Pull production project settings
        working-directory: ${{ runner.temp }}/sandbox-origin
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"

      - name: Build the production artifact
        working-directory: ${{ runner.temp }}/sandbox-origin
        run: vercel build --prod --token="$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"

      - name: Deploy the prebuilt artifact
        id: deploy
        working-directory: ${{ runner.temp }}/sandbox-origin
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(
            vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
          )"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Deployed $deployment_url"

      # The drift this task exists to close. Probes the public origin the web app
      # actually frames, not the deployment's own *.vercel.app alias: the aliases
      # sit behind Deployment Protection, and a promotion that never reached the
      # domain is precisely the failure worth catching.
      - name: Verify the promoted origin serves the repo's isolation headers
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const config = JSON.parse(fs.readFileSync('infrastructure/sandbox/vercel.json', 'utf8'));
          const expected = new Map(
            config.headers.flatMap((rule) => rule.headers.map(({ key, value }) => [key.toLowerCase(), value])),
          );
          const origin = process.env.PRODUCTION_SANDBOX_URL;
          const normalize = (value) => value.replace(/\s+/g, ' ').trim();

          async function drifted() {
            const response = await fetch(origin, { redirect: 'manual' });
            if (response.status >= 400) {
              return [`${origin} answered ${response.status}`];
            }
            const differences = [];
            for (const [key, value] of expected) {
              const served = response.headers.get(key);
              if (served === null || normalize(served) !== normalize(value)) {
                differences.push(
                  `${key}\n  repo:   ${normalize(value)}\n  served: ${served === null ? '(absent)' : normalize(served)}`,
                );
              }
            }
            return differences;
          }

          async function main() {
            for (let attempt = 1; attempt <= 5; attempt += 1) {
              const differences = await drifted();
              if (differences.length === 0) {
                console.log(`${origin} serves all ${expected.size} isolation headers from the repo`);
                return;
              }
              if (attempt === 5) {
                throw new Error(
                  `${origin} does not serve the repo's isolation headers:\n${differences.join('\n')}`,
                );
              }
              console.log(`Attempt ${attempt}: origin not in sync yet; retrying in 10s`);
              await new Promise((resolve) => setTimeout(resolve, 10_000));
            }
          }

          main().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Record deployment summary
        if: ${{ !cancelled() && steps.deploy.outputs.url != '' }}
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$VERIFY_OUTCOME" = "success" ]; then
            isolation="repo isolation headers verified on $PRODUCTION_SANDBOX_URL"
          else
            isolation="FAILED ($VERIFY_OUTCOME); the artifact origin may not be enforcing the repo CSP"
            echo "::error::$isolation"
          fi
          {
            echo "## Artifact sandbox origin deployment"
            echo
            echo "- Commit: \`$DEPLOYMENT_SHA\`"
            echo "- Artifact: prebuilt from infrastructure/sandbox, staged outside the git worktree"
            echo "- URL: $DEPLOYMENT_URL"
            echo "- Origin: $PRODUCTION_SANDBOX_URL"
            echo "- Isolation headers: $isolation"
          } >> "$GITHUB_STEP_SUMMARY"
