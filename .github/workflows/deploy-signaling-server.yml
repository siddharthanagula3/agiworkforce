# GitHub Actions workflow for WebSocket Signaling Server deployment
# Builds Docker image, pushes to GHCR, and deploys to Railway/Fly.io

name: Deploy Signaling Server

on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/signaling-server/**'
      - '.github/workflows/deploy-signaling-server.yml'
      - 'scripts/production-deploy-scope.mjs'
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or branch with a successful CI run'
        required: true
        default: 'main'
        type: string
      deploy_target:
        description: 'Deployment target'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - railway
          - fly
          - both

concurrency:
  group: signaling-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/signaling-server
  SERVICE_DIR: services/signaling-server

permissions:
  actions: read
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  gate:
    name: Verify upstream CI and service scope
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      signaling: ${{ steps.scope.outputs.signaling }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout the candidate commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}
          fetch-depth: 2

      - name: Resolve the candidate commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify manually selected ref passed CI
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          successful_runs="$(
            gh api \
              "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$CANDIDATE_SHA&status=success&event=push" \
              --jq '.total_count'
          )"
          if [ "$successful_runs" -lt 1 ]; then
            echo "::error::No successful push-triggered CI run exists for $CANDIDATE_SHA"
            exit 1
          fi

      - name: Select the signaling surface
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "signaling=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only HEAD^ HEAD \
              | node scripts/production-deploy-scope.mjs \
              | grep '^signaling=' >> "$GITHUB_OUTPUT"
          else
            echo "signaling=true" >> "$GITHUB_OUTPUT"
          fi

  # ===========================================================================
  # Test Job
  # ===========================================================================
  test:
    name: Test
    needs: gate
    if: needs.gate.outputs.signaling == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm build

      - name: Lint check
        run: pnpm exec eslint src/ --max-warnings 0

  # ===========================================================================
  # Build and Push Docker Image
  # ===========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    needs: [gate, test]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=${{ needs.gate.outputs.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ env.SERVICE_DIR }}
          file: ${{ env.SERVICE_DIR }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ===========================================================================
  # Deploy to Railway (only when RAILWAY_TOKEN is configured)
  # ===========================================================================
  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-24.04
    needs: [gate, build]
    timeout-minutes: 15
    if: |
      needs.gate.outputs.signaling == 'true' &&
      (github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'railway' || inputs.deploy_target == 'both')))
      && vars.RAILWAY_PUBLIC_URL != ''
    environment:
      name: production-railway
      url: ${{ vars.RAILWAY_PUBLIC_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Install Railway CLI
        # Pin to specific version to prevent supply chain attacks via @latest
        run: npm install -g @railway/cli@3.22.0

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd ${{ env.SERVICE_DIR }}
          railway up --service signaling-server --detach

      - name: Verify deployment health
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30

          # Health check with retries
          for i in {1..5}; do
            if curl -sf "${{ vars.RAILWAY_PUBLIC_URL }}/health" > /dev/null; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

          echo "Health check failed after 5 attempts"
          exit 1

  # ===========================================================================
  # Deploy to Fly.io
  # ===========================================================================
  deploy-fly:
    name: Deploy to Fly.io
    runs-on: ubuntu-24.04
    needs: [gate, build]
    timeout-minutes: 15
    if: |
      needs.gate.outputs.signaling == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.deploy_target == 'fly' || inputs.deploy_target == 'both')
    environment:
      name: production-fly
      url: ${{ vars.FLY_PUBLIC_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          cd ${{ env.SERVICE_DIR }}
          flyctl deploy --remote-only --wait-timeout 300

      - name: Verify deployment health
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Checking deployment status..."
          flyctl status --app agiworkforce-signaling

          echo "Running health check..."
          for i in {1..5}; do
            if curl -sf "${{ vars.FLY_PUBLIC_URL }}/health" > /dev/null; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

          echo "Health check failed after 5 attempts"
          exit 1

  # ===========================================================================
  # Cleanup Old Images (advisory)
  # FIX-040: continue-on-error is intentional here, this job *only* prunes
  # old container image versions from GHCR. Failing it must not undo a
  # successful deploy. The deploy + health-check steps above are blocking.
  # ===========================================================================
  cleanup:
    name: Cleanup Old Images (advisory, not part of deploy)
    runs-on: ubuntu-24.04
    needs: [build]
    if: github.event_name == 'workflow_run'
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      packages: write

    steps:
      - name: Delete old container images
        uses: actions/delete-package-versions@v5
        with:
          package-name: signaling-server
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: true
