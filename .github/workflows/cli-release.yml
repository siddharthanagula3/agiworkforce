name: CLI Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUST_VERSION: '1.94.0'
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # Prepare Release - Extract version and create draft release
  # ==========================================================================
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
      prerelease: ${{ steps.get-version.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version info
        id: get-version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
            PRERELEASE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            PRERELEASE="false"

            # Check if version contains pre-release identifiers
            if [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-rc"* ]] || [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-nightly"* ]]; then
              PRERELEASE="true"
            fi
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT

          echo "Version: ${VERSION}"
          echo "Tag: ${TAG}"
          echo "Pre-release: ${PRERELEASE}"

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            CHANGELOG="Initial release"
          else
            # Generate changelog from commits to CLI
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD -- apps/cli/ 2>/dev/null || echo "")

            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="Bug fixes and improvements"
            fi
          fi

          # Use heredoc syntax for multi-line output
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v8
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
          TAG: ${{ steps.get-version.outputs.tag }}
          PRERELEASE: ${{ steps.get-version.outputs.prerelease }}
        with:
          script: |
            const version = process.env.VERSION;
            const tag = process.env.TAG;
            const prerelease = process.env.PRERELEASE === 'true';

            const releaseBody = `## AGI Workforce CLI v${version}

            ### What's New

            ${{ steps.changelog.outputs.changelog }}

            ### Installation

            #### macOS (x86_64)
            \`\`\`bash
            mkdir -p ~/.agi/bin
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${tag}/agiworkforce-${version}-darwin-x64.tar.gz | tar xz -C ~/.agi/bin/
            ~/.agi/bin/agi --version
            \`\`\`

            #### macOS (ARM64)
            \`\`\`bash
            mkdir -p ~/.agi/bin
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${tag}/agiworkforce-${version}-darwin-arm64.tar.gz | tar xz -C ~/.agi/bin/
            ~/.agi/bin/agi --version
            \`\`\`

            #### Linux (x86_64)
            \`\`\`bash
            mkdir -p ~/.agi/bin
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${tag}/agiworkforce-${version}-linux-x64.tar.gz | tar xz -C ~/.agi/bin/
            ~/.agi/bin/agi --version
            \`\`\`

            #### Linux (ARM64)
            \`\`\`bash
            mkdir -p ~/.agi/bin
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${tag}/agiworkforce-${version}-linux-arm64.tar.gz | tar xz -C ~/.agi/bin/
            ~/.agi/bin/agi --version
            \`\`\`

            #### Windows (x86_64)
            \`\`\`bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${tag}/agiworkforce-${version}-windows-x64.zip -o agiworkforce.zip
            unzip agiworkforce.zip -d %APPDATA%/agi/bin
            %APPDATA%/agi/bin/agi.exe --version
            \`\`\`

            #### Universal Installer
            \`\`\`bash
            curl -fsSL https://agiworkforce.com/install.sh | bash
            \`\`\`

            ### Downloads

            | Platform | Architecture | File |
            |----------|--------------|------|
            | macOS | Intel (x86_64) | \`agiworkforce-${version}-darwin-x64.tar.gz\` |
            | macOS | Apple Silicon (ARM64) | \`agiworkforce-${version}-darwin-arm64.tar.gz\` |
            | Linux | x86_64 | \`agiworkforce-${version}-linux-x64.tar.gz\` |
            | Linux | ARM64 | \`agiworkforce-${version}-linux-arm64.tar.gz\` |
            | Windows | x86_64 | \`agiworkforce-${version}-windows-x64.zip\` |

            ### Changelog

            \`\`\`
            ${{ steps.changelog.outputs.changelog }}
            \`\`\`
            `;

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `AGI Workforce CLI v${version}`,
              body: releaseBody,
              draft: true,
              prerelease: prerelease
            });

            core.setOutput('release_id', data.id);
            return data.id;

  # ==========================================================================
  # Build CLI Binaries - Cross-compile for multiple platforms
  # ==========================================================================
  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: [prepare-release]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - target: x86_64-apple-darwin
            runner: macos-13
            os: darwin
            arch: x64
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: darwin
            arch: arm64

          # Linux
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            arch: x64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            arch: arm64

          # Windows
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os: windows
            arch: x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: .
          cache-on-failure: true

      # Linux ARM64 cross-compilation
      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Set CC/AR for ARM64 cross-compilation
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build CLI binary
        run: cargo build --release -p agiworkforce-cli --target ${{ matrix.target }}

      - name: Determine artifact path
        id: artifact
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            BIN_PATH="target/${{ matrix.target }}/release/agi.exe"
          else
            BIN_PATH="target/${{ matrix.target }}/release/agi"
          fi
          echo "bin_path=${BIN_PATH}" >> $GITHUB_OUTPUT

      - name: Create release artifact (Unix)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          BINARY="${{ steps.artifact.outputs.bin_path }}"
          VERSION="${{ needs.prepare-release.outputs.version }}"
          ARTIFACT_NAME="agiworkforce-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          ARCHIVE_NAME="${ARTIFACT_NAME}.tar.gz"

          mkdir -p release
          cp "$BINARY" "release/agi"
          cp "target/${{ matrix.target }}/release/agiworkforce" "release/agiworkforce"
          chmod +x "release/agi" "release/agiworkforce"
          tar -czf "$ARCHIVE_NAME" -C release agi agiworkforce
          ls -lh "$ARCHIVE_NAME"
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

      - name: Create release artifact (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $binary = "${{ steps.artifact.outputs.bin_path }}"
          $version = "${{ needs.prepare-release.outputs.version }}"
          $artifactName = "agiworkforce-${version}-${{ matrix.os }}-${{ matrix.arch }}"
          $archiveName = "${artifactName}.zip"

          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          Copy-Item "$binary" "release/agi.exe"
          Copy-Item "target/${{ matrix.target }}/release/agiworkforce.exe" "release/agiworkforce.exe"
          Compress-Archive -Path "release/agi.exe","release/agiworkforce.exe" -DestinationPath "$archiveName"
          Get-Item "$archiveName" | ForEach-Object { Write-Host "Archive: $($_.Name) ($($_.Length) bytes)" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "archive_name=${archiveName}"

      - name: Upload artifact to release
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77 # v1
        with:
          draft: true
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: |
            ${{ steps.artifact.outputs.archive_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Publish Release - Make the release public
  # ==========================================================================
  publish-release:
    name: Publish Release
    needs: [prepare-release, build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.prepare-release.outputs.release_id }},
              draft: false
            });

            console.log('Release published successfully!');

      - name: Notify on success
        if: success()
        run: |
          echo "CLI Release v${{ needs.prepare-release.outputs.version }} published successfully!"
          echo "Pre-release: ${{ needs.prepare-release.outputs.prerelease }}"

  # ==========================================================================
  # Cleanup on Failure
  # ==========================================================================
  cleanup-on-failure:
    name: Cleanup Failed Release
    needs: [prepare-release, build-cli]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete draft release
        uses: actions/github-script@v8
        with:
          script: |
            const releaseId = ${{ needs.prepare-release.outputs.release_id }};

            if (releaseId) {
              try {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: releaseId
                });
                console.log('Draft release deleted due to build failure');
              } catch (error) {
                console.warn('Failed to delete draft release:', error.message);
              }
            }

      - name: Notify on failure
        run: |
          echo "CLI release build failed for v${{ needs.prepare-release.outputs.version }}"
          echo "Draft release has been cleaned up"
