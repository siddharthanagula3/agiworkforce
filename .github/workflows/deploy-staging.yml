name: Deploy Staging Web

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: staging-web
  cancel-in-progress: false

permissions:
  contents: read
  # The verdict this workflow publishes is a commit status on the exact SHA it
  # deployed. deploy-production.yml's staging-gate reads that status rather than
  # this run's own head_sha: a workflow_run-triggered run reports the default
  # branch's head, which is a different commit the moment anything else lands
  # while CI is still going.
  statuses: write

jobs:
  deploy:
    name: Deploy and verify the staging web artifact
    if: >-
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: staging-web
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      AGI_STAGING_DATABASE_URL: ${{ secrets.AGI_STAGING_DATABASE_URL }}
      AGI_DATABASE_URL: ${{ secrets.AGI_STAGING_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.AGI_STAGING_DATABASE_URL }}
    steps:
      - name: Checkout the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve the candidate commit
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Require the protected staging deployment contract
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID AGI_STAGING_DATABASE_URL VERCEL_AUTOMATION_BYPASS_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required in the staging-web environment"
              exit 1
            fi
          done

      - name: Self-test the serving-path verifier
        run: node --test scripts/verify-deployment.test.mjs

      - name: Install migration-ledger dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.4.0

      - name: Pull preview project settings
        id: pull
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"

      - name: Verify the staging database binding
        id: database
        run: node scripts/verify-staging-database.mjs

      # The whole point of the tier: the migrations run here, against a database
      # that keeps its state between deploys, before the same commit is allowed
      # near production. A migration that only ever meets an empty CI Postgres
      # has not been tested against data.
      - name: Apply pending migrations to the staging database
        id: migrate
        env:
          AGI_DATABASE_URL: ${{ secrets.AGI_STAGING_DATABASE_URL }}
        run: pnpm db:migrate -- apply --target staging

      - name: Build the staging artifact
        id: build
        env:
          AGI_DATABASE_URL: ${{ secrets.AGI_STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.AGI_STAGING_DATABASE_URL }}
        run: vercel build --token="$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"

      - name: Deploy the prebuilt artifact
        id: deploy
        env:
          AGI_DATABASE_URL: ${{ secrets.AGI_STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.AGI_STAGING_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(
            vercel deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --env AGI_DATABASE_URL --env DATABASE_URL
          )"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Deployed $deployment_url"

      - name: Verify the staging serving path
        id: verify
        env:
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: >-
          node scripts/verify-deployment.mjs --vercel-preview
          "$DEPLOYMENT_URL" "$HEAD_SHA"

      - name: Record the migration state staging serves
        id: record
        env:
          AGI_DATABASE_URL: ${{ secrets.AGI_STAGING_DATABASE_URL }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
        run: >-
          pnpm db:migrate -- record --surface web --commit "$HEAD_SHA"
          --target staging --deployment-ref "$DEPLOYMENT_URL"

      - name: Record staging deployment summary
        if: ${{ !cancelled() && steps.deploy.outputs.url != '' }}
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          DEPLOYMENT_SHA: ${{ steps.commit.outputs.sha }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          RECORD_OUTCOME: ${{ steps.record.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$VERIFY_OUTCOME" = "success" ]; then
            serving_path="health plus authenticated routes verified"
          else
            serving_path="FAILED ($VERIFY_OUTCOME); production will not promote this commit"
            echo "::error::$serving_path"
          fi
          if [ "$RECORD_OUTCOME" = "success" ]; then
            migration_state="applied to the verified staging database and recorded at target staging"
          else
            migration_state="FAILED (${RECORD_OUTCOME:-not reached}); production will not promote this commit"
          fi
          {
            echo "## Staging web deployment"
            echo
            echo "- Commit: \`$DEPLOYMENT_SHA\`"
            echo "- Artifact: prebuilt from $DEPLOYMENT_SHA"
            echo "- URL: $DEPLOYMENT_URL"
            echo "- Origin: $DEPLOYMENT_URL"
            echo "- Migrations: $migration_state"
            echo "- Serving path: $serving_path"
          } >> "$GITHUB_STEP_SUMMARY"

      # The background workers ship inside this artifact, so staging is where
      # their versions are exercised before production carries the same roster.
      - name: Record the background components staging carries
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const registry = JSON.parse(
            fs.readFileSync('apps/web/app/api/cron/deployable-components.json', 'utf8'),
          );
          const byRole = new Map();
          for (const component of registry.components) {
            const roster = byRole.get(component.role) ?? [];
            roster.push(`${component.name}@${component.version}`);
            byRole.set(component.role, roster);
          }
          console.log('## Background components');
          console.log('');
          console.log(`${registry.components.length} registered deployable components.`);
          console.log('');
          console.log('| Role | Components |');
          console.log('| ---- | ---------- |');
          for (const [role, roster] of [...byRole].sort()) {
            console.log(`| ${role} | ${roster.sort().join(', ')} |`);
          }
          NODE

      # The gate deploy-production.yml waits on. It runs on the failure path too:
      # a staging run that ends without posting anything would hold the
      # production promotion until its 25-minute deadline and then fail it with
      # a timeout rather than with the reason.
      - name: Publish the staging verdict for this commit
        if: ${{ always() }}
        env:
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          # Falls back to the triggering commit: a job that failed before the
          # checkout resolved still has to report, or the production gate waits
          # out its deadline instead of being told why.
          HEAD_SHA: >-
            ${{ steps.commit.outputs.sha || github.event.workflow_run.head_sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          RECORD_OUTCOME: ${{ steps.record.outcome }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ] && [ "$RECORD_OUTCOME" = "success" ]; then
            state=success
            description='staging served this commit and verified it'
          else
            state=failure
            description="staging verification failed (job: ${JOB_STATUS:-not reached}, record: ${RECORD_OUTCOME:-not reached})"
          fi
          gh api --method POST "repos/$REPOSITORY/statuses/$HEAD_SHA" \
            -f "state=$state" \
            -f context=staging-web \
            -f "description=$description" \
            -f "target_url=$WORKFLOW_RUN_URL" \
            --silent
