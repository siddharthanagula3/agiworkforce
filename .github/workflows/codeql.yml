name: 'Rust Security'

# JS/TS CodeQL is handled by GitHub's default CodeQL setup.
# This workflow only runs Rust-specific security checks.

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/codeql.yml'
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/codeql.yml'
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  schedule:
    - cron: '17 4 * * 1' # Weekly on Monday at 4:17 UTC

permissions:
  contents: read

jobs:
  rust-security:
    name: Rust Security (cargo audit + clippy)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libleptonica-dev libpng-dev libjpeg-dev libtiff-dev zlib1g-dev libwebp-dev tesseract-ocr libtesseract-dev libasound2-dev libclang-dev

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: '1.94.0'
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
          cache-on-failure: true

      - name: Install pinned cargo-audit
        # audit-check installs cargo-audit without --locked when the binary is
        # absent. That selected kstring 2.0.4 (Rust 1.96) on our Rust 1.94
        # runner. Preinstall the current cargo-audit release from its published
        # lockfile so the action finds the compatible, deterministic binary.
        env:
          RUSTFLAGS: ''
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run cargo audit (CVE scanning)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Seed native messaging host sidecar placeholder
        # Tauri's `bundle.externalBin` validation in agiworkforce-desktop's
        # build script requires the sidecar binary at
        # `apps/desktop/src-tauri/binaries/native_messaging_host-<triple>`.
        # Building the real binary here would more than triple the job
        # runtime (separate cargo build + target dir). Clippy only needs
        # the path to exist so Tauri's build script `assert_files_exist`
        # check passes. Matches the macOS/Windows pattern already in
        # `.github/workflows/ci.yml`.
        run: |
          triple="$(rustc -vV | awk '/^host: / {print $2}')"
          mkdir -p apps/desktop/src-tauri/binaries
          printf '#!/usr/bin/env sh\nexit 1\n' > "apps/desktop/src-tauri/binaries/native_messaging_host-${triple}"
          chmod +x "apps/desktop/src-tauri/binaries/native_messaging_host-${triple}"

      - name: Run cargo clippy (lint as errors)
        # Scope clippy to the binaries we actually ship. The ported codex-rs
        # crates under crates/* legitimately use unsafe (PTY, exec policy via
        # starlark `ProvidesStaticType`, etc.) and would fail `-D unsafe-code`
        # even though they are well-vetted upstream. This matches ci.yml's
        # clippy step (.github/workflows/ci.yml) so the two security gates
        # stay consistent, see that file for the long-form rationale.
        run: cargo clippy -p agiworkforce-desktop -p agiworkforce-cli --lib -- -D warnings -D unsafe-code
