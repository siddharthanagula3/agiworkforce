name: AGI Workforce Bot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  process:
    if: |
      (startsWith(github.event.comment.body, '/agi ') || github.event.comment.body == '/agi') &&
      (github.event.issue.pull_request != null || github.event.pull_request != null) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Parse command
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          FIRST_LINE=${COMMENT_BODY%%$'\n'*}
          COMMAND=$(printf '%s' "$FIRST_LINE" | tr -d '\r' |
            sed 's|^/agi[[:space:]]*||' | awk '{print tolower($1)}' | tr -cd 'a-z0-9_-' | cut -c1-32)
          if [ -z "$COMMAND" ]; then
            COMMAND="help"
          fi
          echo "command=$COMMAND" >> "$GITHUB_OUTPUT"

      - name: React to comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const reaction = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            };
            try {
              if (context.eventName === 'pull_request_review_comment') {
                await github.rest.reactions.createForPullRequestReviewComment(reaction);
              } else {
                await github.rest.reactions.createForIssueComment(reaction);
              }
            } catch (error) {
              core.warning(`Could not react to the command comment: ${error.message}`);
            }

      - name: Handle help command
        if: steps.parse.outputs.command == 'help'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const helpText = '## AGI Workforce Bot\n\nAvailable commands:\n- `/agi help` - Show this help message\n- `/agi review` - Review the PR for code quality and common issues\n- `/agi explain` - Explain the changes in this PR\n- `/agi check` - Report the status of the checks on the latest commit\n- `/agi stats` - Show PR statistics (files changed, lines, complexity)';
            const issueNumber = context.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: helpText
            });

      - name: Handle explain command
        if: steps.parse.outputs.command == 'explain'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });
            const FILE_LIST_LIMIT = 3000;
            const fileListNote = files.length >= FILE_LIST_LIMIT
              ? `GitHub lists at most ${FILE_LIST_LIMIT} files for a pull request, so these totals cover only the first ${FILE_LIST_LIMIT}.\n\n`
              : '';

            let summary = '## PR Change Summary\n\n';
            let totalAdditions = 0;
            let totalDeletions = 0;

            const byType = {};
            for (const file of files) {
              totalAdditions += file.additions;
              totalDeletions += file.deletions;
              const ext = file.filename.split('.').pop() || 'other';
              byType[ext] = (byType[ext] || 0) + 1;
            }

            summary += `**${files.length}** files changed: **+${totalAdditions}** / **-${totalDeletions}**\n\n${fileListNote}`;
            summary += '### Files by type\n';
            for (const [ext, count] of Object.entries(byType).sort((a, b) => b[1] - a[1])) {
              summary += `- .${ext}: ${count} files\n`;
            }

            summary += '\n### Changed files\n';
            for (const file of files.slice(0, 30)) {
              const status = file.status === 'added' ? '(new)' : file.status === 'removed' ? '(removed)' : '(modified)';
              summary += `- ${status} ${file.filename} (+${file.additions}/-${file.deletions})\n`;
            }
            if (files.length > 30) {
              summary += `\n...and ${files.length - 30} more files\n`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });

      - name: Handle stats command
        if: steps.parse.outputs.command == 'stats'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });

            let stats = '## PR Statistics\n\n';
            stats += '| Metric | Value |\n';
            stats += '|--------|-------|\n';
            stats += `| Commits | ${pr.commits} |\n`;
            stats += `| Files changed | ${pr.changed_files} |\n`;
            stats += `| Additions | +${pr.additions} |\n`;
            stats += `| Deletions | -${pr.deletions} |\n`;
            stats += `| Reviews | ${reviews.length} |\n`;
            const mergeableIcon = pr.mergeable === null || pr.mergeable === undefined
              ? 'UNKNOWN (GitHub is still computing it)'
              : pr.mergeable ? 'OK' : 'CONFLICT';
            const draftStatus = pr.draft ? 'Yes' : 'No';
            stats += `| Mergeable | ${mergeableIcon} |\n`;
            stats += `| Draft | ${draftStatus} |\n`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: stats
            });

      - name: Handle check command
        if: steps.parse.outputs.command == 'check'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const readHeadSha = async () => {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
              });
              return pr.head.sha;
            };

            let headSha = await readHeadSha();
            let runs = [];
            let settled = false;
            for (let attempt = 0; attempt < 3 && !settled; attempt++) {
              runs = await github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
                per_page: 100
              });
              const currentSha = await readHeadSha();
              settled = currentSha === headSha;
              headSha = currentSha;
            }

            let report = `## Build Check Status\n\nCommit \`${headSha.slice(0, 12)}\`\n\n`;
            if (!settled) {
              report += 'The pull request head changed while these checks were being read. Run `/agi check` again.\n';
            } else if (runs.length === 0) {
              report += 'No check runs found for this commit.\n';
            } else {
              report += '| Check | Status | Conclusion |\n';
              report += '|-------|--------|------------|\n';
              for (const run of runs) {
                const icon = run.conclusion === 'success' ? 'PASS' :
                             run.conclusion === 'failure' ? 'FAIL' : 'PENDING';
                report += `| ${run.name} | ${run.status} | ${icon} |\n`;
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });

      - name: Handle review command
        if: steps.parse.outputs.command == 'review'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });
            const FILE_LIST_LIMIT = 3000;

            let review = '## Automated PR Review\n\n';

            const issues = [];
            for (const file of files) {
              if (file.filename.endsWith('.env') || file.filename.endsWith('.env.local') ||
                  file.filename.includes('credentials') || file.filename.includes('secrets')) {
                issues.push(`SECURITY: ${file.filename} may contain secrets`);
              }
              if (file.additions > 500) {
                issues.push(`SIZE: ${file.filename} has ${file.additions}+ additions - consider splitting`);
              }
              if (file.filename.includes('node_modules') || file.filename.includes('.git')) {
                issues.push(`ARTIFACTS: ${file.filename} may be unnecessary`);
              }
            }

            if (issues.length > 0) {
              review += '### Issues Found\n\n';
              for (const issue of issues) {
                review += `- ${issue}\n`;
              }
            } else {
              review += files.length >= FILE_LIST_LIMIT
                ? `No obvious issues found in the first ${FILE_LIST_LIMIT} files.\n`
                : 'No obvious issues found.\n';
            }

            review += '\n### Summary\n';
            review += files.length >= FILE_LIST_LIMIT
              ? `- Files reviewed: the first ${FILE_LIST_LIMIT} (GitHub lists no more)\n`
              : `- Files changed: ${files.length}\n`;

            const rustFiles = files.filter(f => f.filename.endsWith('.rs')).length;
            const tsFiles = files.filter(f => f.filename.endsWith('.ts') || f.filename.endsWith('.tsx')).length;
            const ymlFiles = files.filter(f => f.filename.endsWith('.yml') || f.filename.endsWith('.yaml')).length;

            if (rustFiles > 0) review += `- Rust files: ${rustFiles}\n`;
            if (tsFiles > 0) review += `- TypeScript files: ${tsFiles}\n`;
            if (ymlFiles > 0) review += `- YAML files: ${ymlFiles}\n`;

            review += '\nNote: This is a basic automated review. For deep code analysis, request a human review.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: review
            });

      - name: Unknown command handler
        if: |
          steps.parse.outputs.command != 'help' &&
          steps.parse.outputs.command != 'review' &&
          steps.parse.outputs.command != 'explain' &&
          steps.parse.outputs.command != 'check' &&
          steps.parse.outputs.command != 'stats'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PARSED_COMMAND: ${{ steps.parse.outputs.command }}
        with:
          script: |
            const command = process.env.PARSED_COMMAND;
            const response = `Unknown command: ${command}\n\nType /agi help to see available commands.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: response
            });
