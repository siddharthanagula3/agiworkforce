name: Priority Level 1 tests

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'crates/**'
      - '.github/workflows/test-l1.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'crates/**'
      - '.github/workflows/test-l1.yml'

concurrency:
  group: tests-l1-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Without an explicit block GITHUB_TOKEN inherits the
# repository default, which on a public repo can be write-all, so a
# compromised dependency in a test run could push commits or publish
# packages. These jobs only read the checkout.
permissions:
  contents: read

jobs:
  test-l1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_TEST }}
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_TEST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Priority Level 1 tests
        run: pnpm test:l1
        continue-on-error: false

      - name: Generate Coverage Report
        if: always()
        run: pnpm test:coverage || true

      - name: Upload Coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true

      - name: Verify Boundaries
        if: always()
        run: pnpm check:boundaries

      - name: Verify LLM Failures
        if: always()
        run: pnpm check:llm-failures:staged || echo "LLM failure check warning"
