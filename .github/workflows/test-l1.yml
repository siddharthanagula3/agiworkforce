name: Priority Level 1 tests

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'crates/**'
      - 'services/**'
      - 'tools/evals/**'
      - '.github/workflows/test-l1.yml'
      - 'scripts/run-coverage*'
      - 'scripts/check-coverage-floors*'
      - 'scripts/lib/coverage-floors.mjs'
      - 'vitest.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'crates/**'
      - 'services/**'
      - 'tools/evals/**'
      - '.github/workflows/test-l1.yml'
      - 'scripts/run-coverage*'
      - 'scripts/check-coverage-floors*'
      - 'scripts/lib/coverage-floors.mjs'
      - 'vitest.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'

concurrency:
  group: tests-l1-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Without an explicit block GITHUB_TOKEN inherits the
# repository default, which on a public repo can be write-all, so a
# compromised dependency in a test run could push commits or publish
# packages. These jobs only read the checkout.
permissions:
  contents: read

jobs:
  test-l1:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_TEST }}
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_TEST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Priority Level 1 tests
        run: pnpm test:l1
        continue-on-error: false

      - name: Generate Coverage Report
        if: ${{ !cancelled() }}
        run: pnpm test:coverage

      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage/coverage-final.json
            coverage/coverage-summary.json
          if-no-files-found: error

      - name: Verify Boundaries
        if: always()
        run: pnpm check:boundaries

      - name: Verify LLM Failures
        if: always()
        run: pnpm check:llm-failures:staged

  upload-coverage:
    needs: test-l1
    if: ${{ always() && github.event_name == 'push' && needs.test-l1.result == 'success' && vars.CODECOV_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source identity
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download coverage evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage
          path: coverage
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/coverage-final.json
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
          verbose: true

  coverage-publication-status:
    needs: test-l1
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Report Codecov activation state
        env:
          CODECOV_ENABLED: ${{ vars.CODECOV_ENABLED }}
        run: |
          if [[ "$CODECOV_ENABLED" == "true" ]]; then
            echo "Codecov publishing is active." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Codecov publishing is inactive"
              echo "Coverage tests, the repository floor, and the required GitHub artifact remain enforced."
              echo "To publish externally, install the Codecov GitHub App for this repository, complete Codecov repository setup, set the repository variable CODECOV_ENABLED to true, and rerun this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
