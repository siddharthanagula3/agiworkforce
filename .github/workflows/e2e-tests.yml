# Desktop only, and only the smoke/chat/v3-locks Playwright projects. Do not
# read this workflow as cross-surface coverage — the per-surface E2E lanes are
# jobs in ci.yml (desktop deterministic mocks, Chrome extension, VS Code + CLI,
# mobile, web).
name: Desktop E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/desktop/**'
      # A pull request that edits this gate must be checked by this gate.
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:
  schedule:
    # Weekly coverage supplements the path-filtered PR/main runs without
    # spending roughly 900 private-repository minutes on a nightly duplicate.
    - cron: '0 2 * * 1'

concurrency:
  group: desktop-e2e-${{ github.ref }}
  # Only superseded pull-request pushes may be cancelled. Cancelling on
  # main/develop would leave a merged commit with no E2E verdict, which is the
  # same outcome as continue-on-error the M22 note below forbids.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Limit GITHUB_TOKEN permissions to minimum required
permissions:
  contents: read

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # M22: No continue-on-error here — E2E failures intentionally block the pipeline on main/develop.
    # Do NOT add continue-on-error: true without a documented exception.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
        working-directory: apps/desktop

      - name: Build desktop web frontend
        run: pnpm exec turbo run build:web --filter=@agiworkforce/desktop
        env:
          CI: true
          # Vite needs the web target so esbuild uses the right browser support
          # matrix (without it the build fails with esbuild safari14 errors).
          VITE_BUILD_TARGET: web

      - name: Start Vite dev server (background)
        run: |
          set -euo pipefail
          VITE_DEV_PORT=5175 TAURI_DEV_HOST=127.0.0.1 pnpm dev:vite > app.log 2>&1 &
          echo $! > app.pid
          echo "Started Vite server with PID $(cat app.pid)"
        working-directory: apps/desktop
        timeout-minutes: 5

      - name: Wait for app to be ready (180s max)
        run: |
          set -euo pipefail
          for i in {1..90}; do
            if ! kill -0 "$(cat app.pid)" > /dev/null 2>&1; then
              echo "Vite process exited before app became ready"
              tail -200 app.log || true
              exit 1
            fi
            if curl -fsS http://127.0.0.1:5175/ > /dev/null; then
              echo "App is ready after $((i*2)) seconds"
              exit 0
            fi
            echo "Waiting for app... attempt $i/90"
            sleep 2
          done
          echo "App failed to start after 180 seconds"
          tail -200 app.log || true
          exit 1
        working-directory: apps/desktop

      # M22: No continue-on-error — E2E failures intentionally block CI.
      #
      # One invocation for all three projects: separate invocations each
      # overwrote the same results.json, so the gate below could only ever see
      # the last one. There is deliberately no --reporter flag — passing it
      # replaces the reporters in playwright.config.ts and sends the JSON to
      # stdout, which is what left the results gate reading a file that was
      # never written.
      #
      # v3-locks/v3-reachability/v3-smoke were dev-local-only until 2026-07-03
      # (fixed to mount deterministically via mock cloud auth, see git history
      # on these spec files) — kept in CI so v3 shell regressions block the
      # pipeline instead of only surfacing to whoever happens to run them locally.
      - name: Run desktop E2E projects (smoke, chat, v3-locks)
        run: |
          pnpm exec playwright test \
            --project=smoke \
            --project=chat \
            --project=v3-locks \
            --retries=2 \
            --workers=1
        working-directory: apps/desktop

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 30

      - name: Upload test videos and traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-videos
          path: |
            apps/desktop/test-results/**/*.webm
            apps/desktop/test-results/**/*.zip
          retention-days: 7

      - name: Upload app logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-logs
          path: apps/desktop/app.log
          retention-days: 7

      # A missing or empty report fails this step. Treating "no report" as
      # success is how a skipped E2E run reports green.
      - name: Check test results
        if: always()
        run: |
          set -euo pipefail
          cat > check-e2e-results.mjs <<'EOF'
          import { readFileSync } from 'node:fs';

          const reportPath = 'apps/desktop/playwright-report/results.json';
          let report;
          try {
            report = JSON.parse(readFileSync(reportPath, 'utf8'));
          } catch (error) {
            console.error(`No readable Playwright report at ${reportPath}: ${error.message}`);
            process.exit(1);
          }

          const stats = report.stats ?? {};
          const expected = stats.expected ?? 0;
          const unexpected = stats.unexpected ?? 0;
          const flaky = stats.flaky ?? 0;

          if (expected + unexpected + flaky === 0) {
            console.error('Playwright report contains zero executed tests');
            process.exit(1);
          }
          if (unexpected > 0) {
            console.error(`Tests failed: ${unexpected} unexpected failure(s)`);
            process.exit(1);
          }
          console.log(`All tests passed: ${expected} expected, ${flaky} flaky`);
          EOF
          node check-e2e-results.mjs

      - name: Stop app server
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" 2>/dev/null || true
          fi
        working-directory: apps/desktop
