name: Verify Signed Desktop Candidate

on:
  workflow_dispatch:
  push:
    branches: ['codex/verify-desktop-*']
    paths:
      - '.github/workflows/verify-desktop-candidate.yml'
      - 'apps/desktop/electron/__tests__/packaged-acceptance.mjs'

permissions:
  contents: read

concurrency:
  group: desktop-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intel-package:
    # GitHub rejects unpublished draft assets for contents-read integration tokens.
    # This ephemeral repository token reaches only the download step below.
    # Checkout never persists it and the app harness strips token variables.
    permissions:
      contents: write
    runs-on: macos-26-intel
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Validate the selected immutable candidate
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const candidate = JSON.parse(fs.readFileSync('audit/ledger/claude-desktop-implementation.json')).releaseContinuation.intelCandidate;
          if (!Number.isSafeInteger(candidate.assetId) || candidate.assetId < 1) throw Error('Invalid asset ID');
          if (!/^e10-candidate-[a-z0-9-]+$/.test(candidate.releaseTag) || !/^AGI-Cloud-[0-9A-Za-z.-]+-x64\.zip$/.test(candidate.asset) || !/^[a-f0-9]{64}$/.test(candidate.sha256) || !/^[0-9A-Za-z.-]+$/.test(candidate.version)) throw Error('Invalid candidate identity');
          for (const [key, value] of Object.entries({ CANDIDATE_TAG: candidate.releaseTag, CANDIDATE_ASSET_ID: candidate.assetId, CANDIDATE_ASSET: candidate.asset, CANDIDATE_SHA256: candidate.sha256, CANDIDATE_VERSION: candidate.version })) fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          JS
      - name: Download the private draft candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$CANDIDATE_ASSET_ID" --header 'Accept: application/octet-stream' > "$RUNNER_TEMP/candidate/$CANDIDATE_ASSET"
      - name: Verify bytes and install in an owned directory
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          printf '%s  %s\n' "$CANDIDATE_SHA256" "$CANDIDATE_ASSET" | shasum -a 256 -c -
          mkdir installed
          ditto -x -k "$CANDIDATE_ASSET" installed
          signature=$(codesign -d --verbose=4 'installed/AGI Cloud.app' 2>&1)
          printf '%s\n' "$signature" | grep -F 'TeamIdentifier=D2PR62RLT4'
          test "$(lipo -archs 'installed/AGI Cloud.app/Contents/MacOS/AGI Cloud')" = x86_64
          test "$(uname -m)" = x86_64
      - name: Install the pinned harness dependencies
        run: pnpm install --frozen-lockfile
      - name: Exercise the unchanged signed Intel application
        env:
          AGI_ACCEPTANCE_OUTPUT_DIR: ${{ runner.temp }}/candidate/evidence
          AGI_ACCEPTANCE_EXPECT_BROWSER_SIGN_IN: '1'
          AGI_ACCEPTANCE_EXPECT_WORKSPACE_CONSENT: '1'
        run: |
          node apps/desktop/electron/__tests__/packaged-acceptance.mjs "$RUNNER_TEMP/candidate/installed/AGI Cloud.app"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync(`${process.env.AGI_ACCEPTANCE_OUTPUT_DIR}/packaged-acceptance.json`));
          if (receipt.status !== 'passed' || receipt.checks.version !== process.env.CANDIDATE_VERSION || receipt.checks.architecture !== 'x86_64') throw Error('Candidate execution did not match the selected release');
          JS
      - name: Retain bounded acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-candidate-intel
          path: ${{ runner.temp }}/candidate/evidence
          retention-days: 7
