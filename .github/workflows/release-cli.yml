name: Release CLI

# Triggers on tags starting with v-cli- (e.g. v-cli-1.0.0).
# Builds 6 platform binaries, publishes 7 npm packages, creates a GitHub release.
#
# Required GitHub Secrets:
#   NPM_TOKEN, npm automation token (npmjs.com → access tokens → automation)
#
# Existing secrets reused:
#   GITHUB_TOKEN, auto-provided by GitHub Actions

on:
  push:
    tags:
      - 'v-cli-*'

concurrency:
  group: release-cli-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_VERSION: '1.94.0'
  NODE_VERSION: '24'

jobs:
  validate-version:
    name: Validate CLI release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release-metadata.outputs.version }}
      prerelease: ${{ steps.release-metadata.outputs.prerelease }}
      npm_dist_tag: ${{ steps.release-metadata.outputs.npm_dist_tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Require tag and package versions to match
        id: release-metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v-cli-}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "ERROR: invalid CLI release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v-cli-${VERSION}" ]; then
            echo "ERROR: CLI release tags must use v-cli-X.Y.Z" >&2
            exit 1
          fi

          CARGO_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/cli/Cargo.toml | head -1)
          NPM_VERSION=$(node -p "require('./apps/cli/npm/package.json').version")
          if [ "$CARGO_VERSION" != "$VERSION" ] || [ "$NPM_VERSION" != "$VERSION" ]; then
            echo "ERROR: tag $RELEASE_TAG does not match CLI versions (Cargo=$CARGO_VERSION npm=$NPM_VERSION)" >&2
            exit 1
          fi

          VERSION_WITHOUT_BUILD="${VERSION%%+*}"
          if [[ "$VERSION_WITHOUT_BUILD" == *-* ]]; then
            PRERELEASE="true"
            NPM_DIST_TAG="next"
          else
            PRERELEASE="false"
            NPM_DIST_TAG="latest"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "npm_dist_tag=${NPM_DIST_TAG}" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate CLI source
    needs: validate-version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt,clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint CLI library
        run: cargo clippy -p agiworkforce-cli --lib -- -D warnings

      - name: Test CLI
        run: cargo test -p agiworkforce-cli

  build:
    name: Build ${{ matrix.target }}
    needs: [validate-version, validate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: darwin-arm64
            archive: tar.gz
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: darwin-x64
            archive: tar.gz
            smoke: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
            archive: tar.gz
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-arm64
            archive: tar.gz
            cross: true
            smoke: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            platform: win32-arm64
            archive: zip
            smoke: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: win32-x64
            archive: zip
            smoke: true

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-05
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Node for native release smoke
        if: matrix.smoke
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Linux-only: install ALSA + udev dev headers so cpal (voice) and any
      # other linux-system-lib crate can compile. Required because the cli
      # binary statically links cpal regardless of feature flags.
      - name: Install linux system deps (libasound2-dev, libudev-dev)
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Install cross (for aarch64 linux)
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked

      # Cross runs builds in a Docker container, system deps need to be
      # installed inside the container via Cross.toml's pre-build hook.
      # Generate it on the fly (kept out of git so the file doesn't apply
      # to local cargo invocations).
      - name: Configure cross with linux deps
        if: matrix.cross
        run: |
          cat > Cross.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          pre-build = [
              "dpkg --add-architecture $CROSS_DEB_ARCH",
              "apt-get update && apt-get install -y libasound2-dev:$CROSS_DEB_ARCH libudev-dev:$CROSS_DEB_ARCH pkg-config",
          ]
          EOF

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p agiworkforce-cli

      - name: Build (cargo)
        if: '!matrix.cross'
        run: cargo build --release --target ${{ matrix.target }} -p agiworkforce-cli

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist/cli/${{ matrix.platform }}/bin
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            cp target/${{ matrix.target }}/release/agi.exe dist/cli/${{ matrix.platform }}/bin/
            cp target/${{ matrix.target }}/release/agiworkforce.exe dist/cli/${{ matrix.platform }}/bin/
          else
            cp target/${{ matrix.target }}/release/agi dist/cli/${{ matrix.platform }}/bin/
            cp target/${{ matrix.target }}/release/agiworkforce dist/cli/${{ matrix.platform }}/bin/
            chmod +x dist/cli/${{ matrix.platform }}/bin/agi
            chmod +x dist/cli/${{ matrix.platform }}/bin/agiworkforce
          fi

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE_PLATFORM="${{ matrix.platform }}"
          tar -czf "agiworkforce-${ARCHIVE_PLATFORM}.tar.gz" -C dist/cli/${{ matrix.platform }}/bin .

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archivePlatform = "${{ matrix.platform }}".Replace("win32-", "windows-")
          cd dist/cli/${{ matrix.platform }}/bin
          7z a "../../../../agiworkforce-$archivePlatform.zip" *

      - name: Smoke exact release archive (Unix)
        if: matrix.smoke && matrix.archive == 'tar.gz'
        shell: bash
        run: |
          SMOKE_ROOT="$RUNNER_TEMP/agi-cli-release-smoke"
          mkdir -p "$SMOKE_ROOT"
          tar -xzf "agiworkforce-${{ matrix.platform }}.tar.gz" -C "$SMOKE_ROOT"
          AGI_CLI_SMOKE_BINARY="$SMOKE_ROOT/agi" \
            AGI_CLI_SMOKE_REQUIRE_ALIAS=1 \
            node apps/cli/scripts/cli-smoke.mjs

      - name: Smoke exact release archive (Windows)
        if: matrix.smoke && matrix.archive == 'zip'
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "agi-cli-release-smoke"
          Expand-Archive -Path "agiworkforce-windows-x64.zip" -DestinationPath $smokeRoot
          $env:AGI_CLI_SMOKE_BINARY = Join-Path $smokeRoot "agi.exe"
          $env:AGI_CLI_SMOKE_REQUIRE_ALIAS = "1"
          node apps/cli/scripts/cli-smoke.mjs

      - name: Upload binary artifact (npm)
        uses: actions/upload-artifact@v5
        with:
          name: cli-${{ matrix.platform }}
          path: dist/cli/${{ matrix.platform }}/

      - name: Upload archive artifact (gh release)
        uses: actions/upload-artifact@v5
        with:
          name: archive-${{ matrix.platform }}
          path: agiworkforce-*.${{ matrix.archive }}

  sign-release-assets:
    name: Sign CLI release assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Download archives
        uses: actions/download-artifact@v6
        with:
          path: archives
          pattern: archive-*
          merge-multiple: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create and verify signed checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd archives
          sha256sum agiworkforce-* > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${REPOSITORY}/.github/workflows/release-cli.yml@refs/tags/${RELEASE_TAG}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            SHA256SUMS

      - name: Upload signed release assets
        uses: actions/upload-artifact@v7
        with:
          name: signed-cli-release-assets
          path: archives/*
          if-no-files-found: error

  publish-npm:
    name: Publish to npm
    needs: [validate-version, build, sign-release-assets]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Require npm publication credentials
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "ERROR: NPM_TOKEN is required for npm publication" >&2
            exit 1
          fi

      - name: Download all binary artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist/cli
          pattern: cli-*
          merge-multiple: false

      - name: Reorganize artifacts (cli-darwin-arm64 -> dist/cli/darwin-arm64)
        run: |
          for d in dist/cli/cli-*; do
            mv "$d" "dist/cli/$(basename $d | sed 's/^cli-//')"
          done
          ls -R dist/cli/

      - name: Test CLI npm wrapper
        run: npm test --prefix apps/cli/npm

      - name: Verify npm package staging
        run: npm run --prefix apps/cli/npm package-check -- --staged

      - name: Publish all packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ needs.validate-version.outputs.npm_dist_tag }}
        run: ./scripts/publish-cli.sh --yes

  github-release:
    name: Create GitHub Release
    needs: [validate-version, sign-release-assets]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download signed release assets
        uses: actions/download-artifact@v6
        with:
          path: archives
          name: signed-cli-release-assets

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v-cli-}" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: 'AGI Workforce CLI v${{ steps.version.outputs.VERSION }}'
          generate_release_notes: true
          files: archives/*
          draft: false
          prerelease: ${{ needs.validate-version.outputs.prerelease }}
