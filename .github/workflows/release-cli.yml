name: Release CLI

# Triggers on tags starting with v-cli- (e.g. v-cli-1.0.0).
# Builds 6 platform archives, signs their checksum manifest, and publishes a
# GitHub release that https://agiworkforce.com/install.sh installs from.
#
# A manual run (workflow_dispatch) validates the source and builds and smokes
# every archive, then stops: it never signs, tags or publishes. It proves the
# matrix before a tag exists. Procedure: docs/runbooks/cli-release.md.
#
# Required secret, stored in the cli-release environment and never at
# repository level (scripts/release/check-release-environments.mjs checks it):
#   AGI_CLI_RELEASE_SIGNING_KEY, the PEM EC P-256 private key whose public half
#   is pinned in RELEASE_SIGNING_KEY in apps/web/public/install.sh
#
# Existing secrets reused:
#   GITHUB_TOKEN, auto-provided by GitHub Actions

on:
  push:
    tags:
      - 'v-cli-*'
  workflow_dispatch:

concurrency:
  group: release-cli-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_VERSION: '1.99.1'
  NODE_VERSION: '24'

jobs:
  validate-version:
    name: Validate CLI release version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release-metadata.outputs.version }}
      prerelease: ${{ steps.release-metadata.outputs.prerelease }}
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The release gates themselves are tested first: a guard whose fixtures no
      # longer fail it is a step that passes without checking anything.
      - name: Self-test the release guards
        run: |
          node --test scripts/lib/rollout/release-guards.test.mjs
          node --test scripts/lib/rollout/channels.test.mjs
          node --test scripts/release/install-script.test.mjs

      - name: Require a pinned release signing key
        if: github.event_name == 'push'
        run: node scripts/release/check-pinned-release-key.mjs

      # The migration guard reads the route table through the TypeScript
      # compiler, so it needs the workspace's installed packages.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A migration that cannot be reversed, or destroys rows without saying
      # so, must not reach a released version number.
      - name: Refuse a version whose migrations skip the safety guard
        run: |
          node --test scripts/check-neon-migrations.test.mjs
          node scripts/check-neon-migrations.mjs

      - name: Resolve the release channel this tag publishes to
        if: github.event_name == 'push'
        id: channel
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release/resolve-channel.mjs cli "$RELEASE_TAG"

      - name: Require tag and package versions to match
        if: github.event_name == 'push'
        id: release-metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RESOLVED_PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          VERSION="${RELEASE_TAG#v-cli-}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "ERROR: invalid CLI release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v-cli-${VERSION}" ]; then
            echo "ERROR: CLI release tags must use v-cli-X.Y.Z" >&2
            exit 1
          fi

          CARGO_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/cli/Cargo.toml | head -1)
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "ERROR: tag $RELEASE_TAG does not match the CLI version (Cargo=$CARGO_VERSION)" >&2
            exit 1
          fi

          VERSION_WITHOUT_BUILD="${VERSION%%+*}"
          if [[ "$VERSION_WITHOUT_BUILD" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          # Two places derive the distribution channel from one version: the
          # shell here and scripts/lib/rollout/channels.mjs, which the desktop
          # and VS Code pipelines also read. They must never disagree.
          if [ "$PRERELEASE" != "$RESOLVED_PRERELEASE" ]; then
            echo "ERROR: channel derivation disagrees for $VERSION (shell: $PRERELEASE, rollout lib: $RESOLVED_PRERELEASE)" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate CLI source
    needs: validate-version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt,clippy

      # The CLI tests run sandboxed commands through bubblewrap, so they get
      # the host of the CI lane that keeps them green (ci.yml rust-desktop-cli):
      # bubblewrap with its AppArmor profile, and a virtual display.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config xvfb apparmor-profiles bubblewrap

      - name: Prepare unprivileged Linux sandbox
        run: /usr/bin/python3 -I -S scripts/prepare-linux-sandbox.py

      - name: Install Node for the notices check
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Require current CLI open-source notices
        run: node apps/cli/scripts/generate-third-party-notices.mjs --check

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint CLI library
        run: cargo clippy --locked -p agiworkforce-cli --lib -- -D warnings

      - name: Test CLI
        env:
          RUSTFLAGS: ''
          CARGO_INCREMENTAL: '0'
        run: xvfb-run --auto-servernum cargo test --locked -p agiworkforce-cli

  # A tag builds only source that passed validation. A manual run builds
  # either way, so a red test never hides whether the six archives compile.
  build:
    name: Build ${{ matrix.target }}
    needs: [validate-version, validate]
    if: ${{ !cancelled() && needs.validate-version.result == 'success' && (needs.validate.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            platform: darwin-arm64
            archive: tar.gz
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-15
            platform: darwin-x64
            archive: tar.gz
            smoke: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            platform: linux-x64
            archive: tar.gz
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            platform: linux-arm64
            archive: tar.gz
            cross: true
            smoke: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            platform: win32-arm64
            archive: zip
            smoke: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: win32-x64
            archive: zip
            smoke: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-10-16
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Node for native release smoke
        if: matrix.smoke
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Linux builds leave out the voice feature, the only part of the CLI
      # that links a system library (ALSA), so they need no -dev packages.
      - name: Install cross (for aarch64 linux)
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked

      # Generated on the fly so it never applies to local cargo invocations.
      # cross 0.2.5 otherwise pulls ghcr.io/cross-rs/<target>:0.2.5, a tag that
      # can be moved; the digest is that tag's image index as of 2026-11-11.
      - name: Configure cross
        if: matrix.cross
        run: |
          cat > Cross.toml <<'EOF'
          [build.env]
          passthrough = ["AGI_CLI_SENTRY_DSN"]

          [target.aarch64-unknown-linux-gnu]
          image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu@sha256:7f8308a8734d9fcd2ebbe9a3e4bdea74af293f0799d80c3cc341e340cda49a4c"
          EOF

      - name: Build (cross)
        if: matrix.cross
        env:
          AGI_CLI_SENTRY_DSN: ${{ secrets.SENTRY_DSN_CLI }}
        run: cross build --locked --release --target ${{ matrix.target }} -p agiworkforce-cli

      - name: Build (cargo)
        if: '!matrix.cross'
        shell: bash
        env:
          CLI_BUILD_TARGET: ${{ matrix.target }}
          CLI_BUILD_VOICE: ${{ runner.os != 'Linux' }}
          AGI_CLI_SENTRY_DSN: ${{ secrets.SENTRY_DSN_CLI }}
        # Voice ships on macOS and Windows only: cpal links libasound on Linux,
        # which would stop the binary from starting on hosts without ALSA.
        run: |
          args=(--release --target "$CLI_BUILD_TARGET" -p agiworkforce-cli)
          if [[ "$CLI_BUILD_VOICE" == true ]]; then
            args+=(--features voice)
          fi
          cargo build --locked "${args[@]}"

      - name: Stage binary
        shell: bash
        env:
          CLI_PLATFORM: ${{ matrix.platform }}
          CLI_MATRIX_OS: ${{ matrix.os }}
          CLI_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "dist/cli/${CLI_PLATFORM}/bin"
          if [[ "$CLI_MATRIX_OS" == windows-* ]]; then
            cp "target/${CLI_TARGET}/release/agi.exe" "dist/cli/${CLI_PLATFORM}/bin/"
            cp "target/${CLI_TARGET}/release/agiworkforce.exe" "dist/cli/${CLI_PLATFORM}/bin/"
          else
            cp "target/${CLI_TARGET}/release/agi" "dist/cli/${CLI_PLATFORM}/bin/"
            cp "target/${CLI_TARGET}/release/agiworkforce" "dist/cli/${CLI_PLATFORM}/bin/"
            chmod +x "dist/cli/${CLI_PLATFORM}/bin/agi"
            chmod +x "dist/cli/${CLI_PLATFORM}/bin/agiworkforce"
          fi

      # A gnu binary links the newest glibc symbols of the image it is built
      # on, so a build image newer than the floor install.sh promises would
      # ship an agi that refuses to start on a supported distribution.
      - name: Require the glibc floor the installer promises
        if: runner.os == 'Linux'
        shell: bash
        env:
          CLI_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          floor=$(sed -n 's/^MIN_GLIBC_VERSION="\([0-9.]*\)"$/\1/p' apps/web/public/install.sh)
          if [ -z "$floor" ]; then
            echo "ERROR: apps/web/public/install.sh names no MIN_GLIBC_VERSION" >&2
            exit 1
          fi
          for binary in "dist/cli/${CLI_PLATFORM}/bin/agi" "dist/cli/${CLI_PLATFORM}/bin/agiworkforce"; do
            needed=$(readelf -V --wide "$binary" | { grep -o 'GLIBC_[0-9][0-9.]*' || true; } | sed 's/^GLIBC_//' | sort -uV | tail -1)
            if [ -z "$needed" ]; then
              echo "ERROR: $binary names no glibc symbol version; readelf could not read it" >&2
              exit 1
            fi
            if [ "$(printf '%s\n%s\n' "$floor" "$needed" | sort -V | tail -1)" != "$floor" ]; then
              echo "ERROR: $binary needs glibc $needed, above the $floor floor install.sh promises" >&2
              exit 1
            fi
            echo "$binary needs glibc $needed (floor $floor)"
          done

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          CLI_PLATFORM: ${{ matrix.platform }}
        run: |
          ARCHIVE_PLATFORM="$CLI_PLATFORM"
          tar -czf "agiworkforce-${ARCHIVE_PLATFORM}.tar.gz" -C "dist/cli/${CLI_PLATFORM}/bin" .

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          CLI_PLATFORM: ${{ matrix.platform }}
        run: . ./scripts/release/archive-cli-windows.ps1

      - name: Smoke exact release archive (Unix)
        if: matrix.smoke && matrix.archive == 'tar.gz'
        shell: bash
        env:
          CLI_PLATFORM: ${{ matrix.platform }}
        run: |
          SMOKE_ROOT="$RUNNER_TEMP/agi-cli-release-smoke"
          mkdir -p "$SMOKE_ROOT"
          tar -xzf "agiworkforce-${CLI_PLATFORM}.tar.gz" -C "$SMOKE_ROOT"
          AGI_CLI_SMOKE_BINARY="$SMOKE_ROOT/agi" \
            AGI_CLI_SMOKE_REQUIRE_ALIAS=1 \
            node apps/cli/scripts/cli-smoke.mjs

      # The handshake is unit-tested against a cargo binary; this is the archive
      # a user unpacks, so a packaging change cannot ship a mismatched protocol.
      - name: Handshake against the exact release archive
        if: matrix.smoke && matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_ROOT="$RUNNER_TEMP/agi-cli-release-smoke"
          node scripts/release/verify-cli-protocol-handshake.mjs "$SMOKE_ROOT/agi"
          node scripts/release/scan-release-artifact.mjs "$SMOKE_ROOT/agi"

      - name: Smoke exact release archive (Windows)
        if: matrix.smoke && matrix.archive == 'zip'
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "agi-cli-release-smoke"
          Expand-Archive -Path "agiworkforce-windows-x64.zip" -DestinationPath $smokeRoot
          $env:AGI_CLI_SMOKE_BINARY = Join-Path $smokeRoot "agi.exe"
          $env:AGI_CLI_SMOKE_REQUIRE_ALIAS = "1"
          node apps/cli/scripts/cli-smoke.mjs

      - name: Upload archive artifact (gh release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.platform }}
          path: agiworkforce-*.${{ matrix.archive }}

  sign-release-assets:
    name: Sign CLI release assets
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cli-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: archives
          pattern: archive-*
          merge-multiple: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Create and verify signed checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          AGI_CLI_RELEASE_SIGNING_KEY: ${{ secrets.AGI_CLI_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$AGI_CLI_RELEASE_SIGNING_KEY" ]; then
            echo "ERROR: the AGI_CLI_RELEASE_SIGNING_KEY secret is required to sign a CLI release" >&2
            exit 1
          fi
          pinned="$RUNNER_TEMP/pinned-keys"
          node scripts/release/release-signing-key.mjs export "$pinned"

          ( umask 077 && printf '%s\n' "$AGI_CLI_RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-signing.key" )
          if ! openssl ec -in "$RUNNER_TEMP/release-signing.key" -pubout -outform DER -out "$RUNNER_TEMP/signing.der" 2>/dev/null; then
            rm -f "$RUNNER_TEMP/release-signing.key"
            echo "ERROR: the AGI_CLI_RELEASE_SIGNING_KEY secret is not a PEM EC private key; the release key is an unencrypted P-256 (prime256v1) key" >&2
            exit 1
          fi
          signing_key_is_pinned=false
          for key in "$pinned"/*.pem; do
            [ -e "$key" ] || continue
            if openssl pkey -pubin -in "$key" -outform DER | cmp -s - "$RUNNER_TEMP/signing.der"; then
              signing_key_is_pinned=true
            fi
          done
          if [ "$signing_key_is_pinned" != true ]; then
            rm -f "$RUNNER_TEMP/release-signing.key"
            echo "ERROR: the AGI_CLI_RELEASE_SIGNING_KEY public key is not pinned in RELEASE_SIGNING_KEY in apps/web/public/install.sh, so neither the installer nor agi update could verify this release" >&2
            exit 1
          fi

          cd archives
          sha256sum agiworkforce-* > SHA256SUMS
          openssl dgst -sha256 -sign "$RUNNER_TEMP/release-signing.key" -out SHA256SUMS.sig SHA256SUMS
          rm -f "$RUNNER_TEMP/release-signing.key"
          openssl dgst -sha256 -verify <(openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/signing.der") \
            -signature SHA256SUMS.sig SHA256SUMS

          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${REPOSITORY}/.github/workflows/release-cli.yml@refs/tags/${RELEASE_TAG}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            SHA256SUMS

      - name: Upload signed release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-cli-release-assets
          path: archives/*
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: [validate-version, sign-release-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: cli-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download signed release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: archives
          name: signed-cli-release-assets

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # The assets crossed the artifact store since signing, so the signature
      # is checked again where they are published.
      - name: Verify the signed checksums before publishing them
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pinned="$RUNNER_TEMP/pinned-keys"
          node scripts/release/release-signing-key.mjs export "$pinned"
          verified=false
          for key in "$pinned"/*.pem; do
            [ -e "$key" ] || continue
            if openssl dgst -sha256 -verify "$key" -signature archives/SHA256SUMS.sig archives/SHA256SUMS; then
              verified=true
            fi
          done
          if [ "$verified" != true ]; then
            echo "ERROR: SHA256SUMS.sig verifies against no key pinned in apps/web/public/install.sh" >&2
            exit 1
          fi
          cosign verify-blob \
            --bundle archives/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${REPOSITORY}/.github/workflows/release-cli.yml@refs/tags/${RELEASE_TAG}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            archives/SHA256SUMS
          (cd archives && sha256sum -c SHA256SUMS)

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v-cli-}" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: 'AGI Workforce CLI v${{ steps.version.outputs.VERSION }}'
          generate_release_notes: true
          files: archives/*
          draft: false
          prerelease: ${{ needs.validate-version.outputs.prerelease }}

  # npm resolves this install fresh from the registry, so it runs in a job of
  # its own, after the release is published, holding only a read token.
  sentry-release:
    name: Register the CLI release in Sentry
    needs: [validate-version, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # set-commits below reads the range between the previous tag and this
          # one out of the local clone.
          fetch-depth: 0
          persist-credentials: false

      # apps/cli/src/crash_reports.rs sends `agiworkforce-cli@<CARGO_PKG_VERSION>`
      # as the release, so that exact string is what a crash arrives under and
      # what has to exist here for the version to mean anything in Sentry.
      #
      # There is no debug-file upload and there should not be one: the panic
      # hook sends `file:line:column` from std::panic::Location and deliberately
      # nothing else, no addresses and no payload, so a crash is already at
      # source level. What it lacks is the commit range, which set-commits adds.
      - name: Register and finalize the Sentry release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_CLI }}
          SENTRY_RELEASE: agiworkforce-cli@${{ needs.validate-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ] || [ -z "${SENTRY_ORG:-}" ] || [ -z "${SENTRY_PROJECT:-}" ]; then
            echo "::warning::Sentry is unconfigured; $SENTRY_RELEASE will not be segmented in Sentry"
            exit 0
          fi
          npm install --global @sentry/cli@2.58.6
          sentry-cli releases new "$SENTRY_RELEASE"
          sentry-cli releases set-commits "$SENTRY_RELEASE" --local --ignore-missing
          sentry-cli releases finalize "$SENTRY_RELEASE"
