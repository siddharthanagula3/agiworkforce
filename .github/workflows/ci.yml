name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Limit GITHUB_TOKEN permissions to minimum required
permissions:
  contents: read

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      web_changed: ${{ steps.scope.outputs.web }}
      desktop_changed: ${{ steps.scope.outputs.desktop }}
      native_changed: ${{ steps.scope.outputs.native }}
      extension_changed: ${{ steps.scope.outputs.extension }}
      vscode_changed: ${{ steps.scope.outputs.vscode }}
      mobile_changed: ${{ steps.scope.outputs.mobile }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Turborepo --affected needs the actual merge base. Two commits are
          # insufficient for multi-commit pull requests and silently degrade
          # affected selection to a full or incorrect graph.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Select expensive CI lanes
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/$BASE_REF"...HEAD \
              | node scripts/production-deploy-scope.mjs >> "$GITHUB_OUTPUT"
          elif [ -n "${BEFORE_SHA:-}" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --name-only "$BEFORE_SHA" HEAD \
              | node scripts/production-deploy-scope.mjs >> "$GITHUB_OUTPUT"
          else
            node scripts/production-deploy-scope.mjs --all >> "$GITHUB_OUTPUT"
          fi

  repo-guards:
    name: Repository guards
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9.15.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Conflict-marker gate
        run: python3 scripts/check-no-conflict-markers.py

      - name: Security gate policy (blocking, INFRA-05)
        # .github/security-gate-policy.json is the single place every dependency
        # and static-analysis gate declares the severity it blocks at, and the
        # only place an exclusion may live. A continue-on-error step that is not
        # registered there, or a registered exclusion that has gone stale.
        # fails here instead of quietly weakening the gate.
        run: |
          node --test scripts/check-security-gates.test.mjs
          node scripts/check-security-gates.mjs

      - name: Release gate contract (blocking, DESK-25 / INFRA-18 / INFRA-19)
        # Desktop releases must emit an SBOM, install on a clean machine, and
        # survive an upgrade plus rollback before publication; mobile releases
        # must reconcile the iOS privacy manifest with the Play data-safety
        # declaration and pass a device matrix before either store submission.
        run: |
          node --test scripts/check-release-gates.test.mjs
          node --test scripts/generate-sbom.test.mjs
          node --test scripts/verify-desktop-upgrade.test.mjs
          node scripts/check-release-gates.mjs

      - name: Hardcoded-model-id gate (Rust)
        # ESLint covers TS/JS in the js-verify lane; this script covers
        # Rust (CLI + Tauri backend) so the rule "never hardcode model
        # IDs; derive them from the catalog" is enforced uniformly.
        run: bash scripts/check-no-hardcoded-models.sh

      - name: HookEvent fire-site gate (AP-07)
        # AP-07 / R27-PARITY: every HookEvent enum variant must have ≥1
        # run_hooks() call site in apps/cli/src. Static grep, no cargo build.
        run: pnpm check:hook-fire-sites

      - name: Rust egress boundary gate
        # DESK-01: a Rust transport that builds its own reqwest client bypasses
        # the host-owned egress policy (and its connect-time address pinning).
        # The allowlist records the transports that predate the boundary and
        # only ratchets down; a new bare client fails here.
        run: |
          node --test scripts/check-rust-egress-boundary.test.mjs
          pnpm check:rust-egress-boundary

      - name: Module reachability gate
        # R26-1 prevention layer: Rust files under CLI/Desktop native sources
        # must be reachable from lib.rs, main.rs, or bin roots. The ratchet test
        # guards the one rule the baseline itself cannot state: it only shrinks.
        run: |
          node --test scripts/check-module-reachability-ratchet.test.mjs
          pnpm check:module-reachability

      - name: Extension AP-02, no hardcoded color literals
        # R27-PARITY: extension must use var(--agi-ext-*) design tokens; no hex/rgb/hsl literals.
        run: pnpm --filter @agiworkforce/extension check:no-hex

      - name: Web AP-02, no new hardcoded color literals
        # DESIGN-SYSTEM-004: ratchet guard over apps/web app/components/lib/features.
        # Pre-existing literals are grandfathered in apps/web/scripts/.no-hex-baseline.json;
        # anything new fails here.
        run: pnpm --filter @agiworkforce/web check:no-hex-web

      - name: Mobile AP-02, no new hardcoded color literals
        # DESIGN-SYSTEM-005: ratchet guard over apps/mobile TS/TSX.
        # Pre-existing literals are grandfathered in apps/mobile/scripts/.no-hex-baseline.json,
        # whose own _description already promised "New violations will fail CI".
        run: pnpm check:no-hex-mobile

      - name: Web UI invariants, no new colour, type or legibility regressions
        # Ratchet guard over apps/web and packages/ui TS/TSX during the frontend
        # redesign: raw palette utilities, arbitrary colour literals, opacity-diluted
        # foreground tokens, type below the 12px floor, and hover-only affordances.
        # Pre-existing violations are grandfathered in
        # scripts/.web-ui-invariants-baseline.json and that list only shrinks.
        run: pnpm check:web-ui-invariants

      - name: Extension AP-10, no direct cloud-IPC in v1
        # R27-PARITY / v1-local-only: cloud feature paths must gate through InviteCodeModal.
        run: pnpm --filter @agiworkforce/extension check:no-cloud-ipc

      - name: Hardcoded-fixture-array gate (AP-08)
        # R27-PARITY: detects UI components that declare their own copy of
        # display data (CONNECTORS, SKILLS_LIST, etc.) when a live store
        # already exists for the same domain. Canonical definition files
        # (*Definitions.ts, *Catalog.ts) are exempt. Exit 1 = anti-pattern.
        run: pnpm check:hardcoded-arrays

      - name: Secret scan (CRIT-017)
        # Repository-owned credential scanning over every tracked file. BLOCKING
        # on purpose: a committed credential is already in history by the time
        # anyone reads an advisory warning, so the only useful moment to stop it
        # is before the merge.
        #
        # Not entropy analysis, every pattern matches a vendor-prefixed
        # credential format, so a hit is a credential SHAPE rather than "this
        # looks random". Reviewed fixtures live in
        # scripts/secret-scan-allowlist.json keyed on (path, format), and an
        # entry that stops matching fails the job as stale.
        run: pnpm check:secrets

      - name: Lock-vs-build drift check (AP-09, advisory)
        # R27-PARITY: compares model ID references in Claude memory lock files
        # against packages/contracts/types/src/models.json. Lock files live in ~/.claude/
        # (user home, not in repo), so this step exits 0 (skip) in CI and is
        # only substantive when run locally by a developer. Exit 2 = drift
        # warnings; non-blocking (continue-on-error).
        run: pnpm check:lock-drift
        continue-on-error: true

      - name: Tauri IPC wiring (FIX-023)
        # Catches two regressions:
        #   1. Frontend invoke('foo') where lib.rs has no `foo` registered.
        #   2. #[tauri::command] fn defined in src-tauri but missing from
        #      the generate_handler!{} list (silently dead, a frontend
        #      invoke would fail at runtime instead of compile time).
        run: bash apps/desktop/check-wiring.sh

  database:
    name: Postgres migrations and RLS
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agiworkforce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agiworkforce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9.15.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup test environment
        run: |
          {
            echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/agiworkforce_test"
            echo "NEON_DATABASE_URL=postgres://postgres:postgres@localhost:5432/agiworkforce_test"
            echo "CLERK_SECRET_KEY=test-clerk-secret-key"
            echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Y2xlcmsuZXhhbXBsZS50ZXN0JA"
          } >> "$GITHUB_ENV"

      - name: Apply and verify canonical Postgres migrations
        run: |
          pnpm test:db-migrate
          pnpm db:migrate -- apply --target ci
          pnpm db:migrate -- apply --target ci
          pnpm db:migrate -- verify
          pnpm db:rls-probe -- --target ci

  js-verify:
    name: JS lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agiworkforce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agiworkforce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          # Turborepo --affected needs the actual merge base. Two commits are
          # insufficient for multi-commit pull requests and silently degrade
          # affected selection to a full or incorrect graph.
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9.15.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup test environment
        run: |
          {
            echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/agiworkforce_test"
            echo "NEON_DATABASE_URL=postgres://postgres:postgres@localhost:5432/agiworkforce_test"
            echo "CLERK_SECRET_KEY=test-clerk-secret-key"
            echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Y2xlcmsuZXhhbXBsZS50ZXN0JA"
          } >> "$GITHUB_ENV"

      - name: Prepare the test database
        run: pnpm db:migrate -- apply --target ci

      - name: Install Chromium
        # apps/web/scripts/__tests__/a11y-audit.test.ts drives a real browser, so the
        # test step needs one even though this job is not the E2E job.
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        # H24: --max-warnings=0 enforced via package.json lint script.
        # Wave 1.5 prevention layer: ESLint `no-restricted-syntax` rule
        # (eslint.config.mjs §"PREVENTION LAYER") flags hardcoded model
        # IDs + direct cloud database clients across TS/JS.
        run: pnpm exec turbo run lint --affected

      - name: Type check
        # @agiworkforce/web's `tsc --noEmit` aborts with SIGABRT (exit 134).
        # "Ineffective mark-compacts near heap limit", under Node's default
        # old-space cap on a standard runner. It is not intermittent: every run
        # that actually schedules web's typecheck has died here, and the runs
        # that looked green simply had web outside `--affected`, so the biggest
        # package never got checked. That made any commit touching apps/web
        # unable to pass CI, and therefore unable to deploy.
        #
        # The runner has 16 GB, so 8 GB of old space is well within budget.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec turbo run typecheck --affected

      - name: VS Code extension project-reference DAG check
        # `turbo run typecheck --affected` runs each package's own
        # `tsc --noEmit`, which resolves @agiworkforce/types and
        # @agiworkforce/client-runtime against their already-built dist/.
        # it does not rebuild the composite project-reference graph from
        # source. check:refs (`tsc -b tsconfig.build.json`) is the only thing
        # that does, and is the only thing that would catch a broken
        # `references` path, a dependency missing `composite: true`, or (as
        # found while wiring this in) a consumer left out of sync with an
        # in-flight change to @agiworkforce/types' exports.
        run: pnpm --filter agi-workforce check:refs

      - name: Test
        # Vitest/Jest packages already own internal worker pools. Bounding the
        # outer Turbo graph prevents scheduler starvation from turning fast,
        # deterministic tests into timeout flakes on shared CI runners.
        run: pnpm test:affected

      - name: Test (webview HTML rendering, jsdom)
        # F-01 regression gate: parses the rendered webview <script> bodies
        # in jsdom and fails if any contain syntax errors. Catches the class
        # of bug where TypeScript syntax leaks into a JS template literal.
        run: pnpm --filter agi-workforce test:webview

      - name: Test CLI npm wrapper
        # apps/cli/npm is intentionally outside pnpm-workspace.yaml (it's the
        # npm-publish staging package, not a workspace member) and has zero
        # dependencies, so this needs no install, it guards bin/agi.js, the
        # actual entrypoint every `npx agi`/`npm i -g` install resolves to.
        # Lives in js-verify (unconditional), not rust-desktop-cli, on
        # purpose: apps/cli/npm/** DOES set rust-desktop-cli's
        # native_changed gate too (production-deploy-scope.mjs's `isWithin`
        # prefix-matches all of apps/cli, Rust crate and npm folder alike),
        # but a check for a JS file should not depend on a Rust-named job's
        # scope classifier to be the one thing keeping it alive.
        working-directory: apps/cli/npm
        run: node --test test/agi.test.mjs

      # CRIT-018. This step scanned NOTHING for an unknown but long period, and
      # reported success while doing it.
      #
      # The pinned `returntocorp/semgrep-action@v1` image carries semgrep
      # 1.36.0 (2023). Registry rules have since adopted the `MEDIUM` severity
      # value, which that version's enum rejects, so every run died at rule
      # loading:
      #
      #     ValueError: invalid rule severity value: MEDIUM
      #
      # `continue-on-error: true` then swallowed the crash. The "41 pre-existing
      # findings" the old comment tracked as a backlog were not being counted at
      # all, a crashed scanner and a clean scan were indistinguishable in this
      # job, which is the actual defect and is what the split below fixes.
      #
      # Semgrep's exit codes separate the two cases: 0 = no findings, 1 =
      # findings, >=2 = the scanner itself failed. A scanner failure fails the
      # job here; findings are adjudicated by the gate step below, which is what
      # actually blocks the merge. No rule is dismissed on this command line:
      # every acceptance lives in scripts/semgrep-allowlist.json with an owner,
      # an expiry and a reason, so it cannot outlive the triage behind it.

      - name: Build affected deployable JavaScript surfaces
        run: >-
          pnpm exec turbo run build --affected
          --filter=@agiworkforce/signaling-server
          --filter=@agiworkforce/extension
          --filter=@agiworkforce/web
          --filter=agi-workforce

      - name: Package browser and VS Code release artifacts
        # The package commands enforce release-only contents. Running only the
        # normal build would miss stale Chrome ZIP entries and leaked VSIX
        # source maps/configuration files.
        env:
          # Public, non-routable contract fixtures. Real release values live in
          # the protected release environment; CI proves manifest injection and
          # validation without producing a publishable authenticated artifact.
          CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmstY2kuaW52YWxpZCQ
          CLERK_FRONTEND_API: https://clerk-ci.invalid
          CLERK_SYNC_HOST: https://clerk-ci.invalid
          # Syntactically valid public-only RSA fixture so Chromium can load
          # the exact package; it is unrelated to the production store item.
          CHROME_EXTENSION_PUBLIC_KEY: 
        run: |
          pnpm --filter @agiworkforce/extension package
          pnpm --filter agi-workforce package

  security:
    name: Security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9.15.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (JS), critical (blocking)
        shell: bash
        env:
          npm_config_fetch_timeout: '300000'
          npm_config_fetch_retries: '5'
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            output=$(pnpm audit --audit-level=critical 2>&1)
            status=$?
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then exit 0; fi
            if ! printf '%s' "$output" | grep -Eq 'ERR_SOCKET_TIMEOUT|ERR_PNPM_FETCH|ECONNRESET|ETIMEDOUT|Socket timeout'; then
              exit "$status"
            fi
            echo "registry audit endpoint unreachable on attempt $attempt; retrying"
            sleep 60
          done
          echo "registry audit endpoint unreachable after 3 attempts"
          exit 1

      - name: Dependency audit (JS), high (blocking, FIX-043)
        shell: bash
        env:
          npm_config_fetch_timeout: '300000'
          npm_config_fetch_retries: '5'
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            output=$(pnpm audit --audit-level=high 2>&1)
            status=$?
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then exit 0; fi
            if ! printf '%s' "$output" | grep -Eq 'ERR_SOCKET_TIMEOUT|ERR_PNPM_FETCH|ECONNRESET|ETIMEDOUT|Socket timeout'; then
              exit "$status"
            fi
            echo "registry audit endpoint unreachable on attempt $attempt; retrying"
            sleep 60
          done
          echo "registry audit endpoint unreachable after 3 attempts"
          exit 1

      - name: Semgrep (security audit)
        id: semgrep
        shell: bash
        run: |
          set -uo pipefail
          python3 -m pip install --quiet --disable-pip-version-check semgrep==1.172.0
          set +e
          semgrep scan \
            --config p/security-audit \
            --config p/typescript \
            --config p/owasp-top-ten \
            --metrics=off \
            --json --output semgrep-results.json
          status=$?
          set -e

          if [ "$status" -ge 2 ]; then
            echo "::error::Semgrep failed to run (exit $status). This is a broken scanner, not a clean scan."
            exit 1
          fi

          findings=$(node -e "
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('semgrep-results.json', 'utf8'));
            console.log((report.results ?? []).length);
          ")
          echo "count=$findings" >> "$GITHUB_OUTPUT"
          echo "Semgrep ran successfully and reported $findings finding(s)."

      - name: Upload Semgrep findings
        if: always() && hashFiles('semgrep-results.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 14

      - name: Semgrep gate (unaccepted findings block the merge)
        run: node scripts/check-semgrep-findings.mjs semgrep-results.json

  auto-route-conformance:
    name: Auto-route TS/Rust conformance
    runs-on: ubuntu-24.04
    needs: scope
    # Two independent Auto resolvers replay one shared fixture. The Rust half
    # never ran in CI, so a change to the TypeScript resolver could ship
    # divergence. This lane is deliberately not the native one: the registry
    # crate depends only on serde, serde_json and thiserror, so it needs no
    # system libraries and no main-only gate, and the contract is checked at
    # review rather than at merge.
    if: needs.scope.outputs.native_changed == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: '1.94.0'

      - name: Replay the shared auto-route fixture against the Rust resolver
        run: cargo test -p agiworkforce-model-registry --test auto_route_conformance

  rust-desktop-cli:
    name: Rust desktop and CLI (default features)
    runs-on: ubuntu-24.04
    needs: scope
    # Rust builds every crate in the workspace from source and is the
    # slowest thing in CI by an order of magnitude. It only covers desktop
    # and CLI, which are built and tested locally before they ship, so on
    # pull requests the cost buys almost nothing. Running it on main keeps
    # the gate: a native regression still blocks the production promotion,
    # it is just caught at merge instead of at review.
    if: needs.scope.outputs.native_changed == 'true' && github.ref == 'refs/heads/main'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libleptonica-dev libpng-dev libjpeg-dev libtiff-dev zlib1g-dev libwebp-dev tesseract-ocr libtesseract-dev libasound2-dev xvfb libclang-dev

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9.15.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: '1.94.0'
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
          cache-on-failure: true
          cache-directories: ~/.cargo/bin

      - name: Ensure clippy is available
        run: rustup component add clippy --toolchain 1.94.0

      # H41: Verify exact Rust toolchain version before running clippy/tests

      - name: Verify Rust toolchain
        run: rustup show active-toolchain && rustc --version && cargo --version

      - name: Rust formatting gate
        run: cargo fmt --all -- --check

      - name: Verify generated protocol bindings are current
        # Generates into an isolated staging directory and compares against the
        # checked-in TypeScript bindings. A failed exporter must never erase the
        # last known-good bindings used by downstream packages.
        run: pnpm check:protocol-types

      - name: Reclaim runner disk before the native build
        # The sidecar build died with
        #   rustc-LLVM ERROR: IO failure on output stream: No space left on device
        # Building the desktop lib drags in the whole native tree, openssl,
        # aws-lc, libgit2, libsodium, sqlite, and `--profile debug` compiles it
        # all with -C debuginfo=2, which is what fills the volume. The error is
        # about the runner's disk, not about the code.
        #
        # None of the toolchains removed here are used by this job: no .NET, no
        # Android (the mobile E2E job runs on its own macOS runner), no GHC, no
        # CodeQL. Each job gets a fresh runner, so this cannot affect the others.
        # `df -h` is printed on both sides so the next disk failure is legible
        # instead of arriving as a bare LLVM IO error.
        run: |
          echo "--- before ---"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "--- after ---"; df -h /

      - name: Build native messaging host sidecar
        run: pnpm exec turbo run build:native-host --filter=@agiworkforce/desktop -- --profile debug

      - name: Dependency policy (Rust), bans/sources/licenses (blocking)
        # deny.toml is the policy source of truth; bans, sources, and licenses
        # are green on the workspace and must stay green.
        run: cargo install cargo-deny --version 0.20.2 --locked --quiet && cargo deny check bans sources licenses
        env:
          CARGO_HOME: ~/.cargo

      - name: Dependency vulnerabilities (Rust), blocking
        # Three real rustls-webpki TLS advisories rode into main because the
        # only advisories step was continue-on-error and the audit ignore list
        # blamed them on Tauri. RUSTSEC vulnerabilities now fail the job; the
        # maintenance classes stay allowed here and are reported by the step
        # below, bundling the two is what made a vulnerability invisible.
        run: cargo deny check advisories --allow unmaintained --allow unsound --allow notice
        env:
          CARGO_HOME: ~/.cargo

      - name: Dependency advisories (Rust), non-blocking warning-policy debt
        # Unmaintained/unsound/yanked warnings on transitive deps we cannot move
        # past upstream, tracked as RUST-DEPENDENCY-ADVISORIES-01 in
        # docs/agent-context/known-flaws.md. Reported, never blocking.
        run: cargo deny check advisories
        continue-on-error: true
        env:
          CARGO_HOME: ~/.cargo

      - name: Test (apps/desktop + apps/cli + shared crates, default features)
        # Scope the test step to the binaries we actually ship, matches
        # the Clippy step's scope (323ab2e5). The 100+ ported codex-rs
        # crates under crates/* have their own pre-existing test
        # regressions (rebrand-related fixture mismatches, mid-port
        # stubs) that are unrelated to whether the desktop + cli
        # binaries work. Track those separately under FIX-021's TUI
        # defork plan.
        #
        # FIX-039 (Sprint 4): the previous form skipped enigo /
        # AutomationService / automation suites. They were silenced under
        # the assumption that they need DISPLAY, but xvfb-run is already
        # set up at the CI step level, so they can run. If a specific test
        # genuinely needs a real DE, mark it `#[ignore]` at the test level
        # rather than blanket-skipping with `--skip <substring>`.
        env:
          # agiworkforce-linux-sandbox/build.rs panics if vendored
          # bubblewrap source isn't checked out. CI doesn't ship the
          # vendor/ tree, and runtime sandboxing uses the system bwrap
          # binary (not the compile-time-vendored one), so unit tests
          # don't need it. The build.rs already honours this opt-out.
          AGIWORKFORCE_SKIP_VENDORED_BWRAP: '1'
          # actions-rust-lang/setup-rust-toolchain@v1 sets
          # `RUSTFLAGS=-D warnings` by default, which turns every unused
          # import / dead_code warning across the workspace into a test
          # build failure even though they have nothing to do with whether
          # the tests pass. Lint cleanliness is enforced separately by the
          # Clippy step below; keep the Test step focused on test outcomes.
          RUSTFLAGS: ''
          CARGO_INCREMENTAL: '0'
        run: |
          xvfb-run --auto-servernum cargo test -p agiworkforce-desktop --lib
          xvfb-run --auto-servernum cargo test -p agiworkforce-cli
          cargo test --workspace --lib --exclude agiworkforce-desktop --exclude agiworkforce-cli

      - name: Trust boundaries (blocking)
        # The only other place this runs is the Guardian lane, which is
        # `mode: shadow` in .agi-guardian.yml and returns neutral for every
        # finding, so a trust-boundary regression could not fail anything. This
        # guard is deterministic - it needs the sidecar built above, not a
        # precision corpus - so it blocks here while the LLM reviewers stay in
        # shadow until docs/guardian exists.
        env:
          CARGO_INCREMENTAL: '0'
        run: pnpm check:trust-boundaries

      - name: Cross-language sync parity (TEST-05)
        # packages/client/sync (TS) and data::cloud_sync (Rust) reimplement the
        # same delta-sync rules and agree only because both replay the golden
        # fixtures in packages/client/sync/src/__fixtures__. `turbo --affected`
        # never selects the TS package for a Rust-only change (it is a
        # dependency of apps/desktop, not a dependent), so the TS half is run
        # here by name rather than left to affected-selection. The scope
        # classifier forces this lane on for fixture-only edits so the Rust half
        # cannot be skipped on the commit that changes the contract.
        env:
          AGIWORKFORCE_SKIP_VENDORED_BWRAP: '1'
          RUSTFLAGS: ''
          CARGO_INCREMENTAL: '0'
        run: |
          set -euo pipefail
          pnpm --filter @agiworkforce/sync test
          # A cargo name filter that matches nothing still exits 0, which would
          # make this half of the gate silently vacuous if the module is renamed.
          matched=$(cargo test -p agiworkforce-desktop --lib data::cloud_sync::fixture_tests -- --list | grep -c ': test$' || true)
          if [ "$matched" -eq 0 ]; then
            echo "data::cloud_sync::fixture_tests matched no tests, the Rust half of the parity pair is gone" >&2
            exit 1
          fi
          cargo test -p agiworkforce-desktop --lib data::cloud_sync::fixture_tests

      - name: Free Rust test artifacts before clippy
        # The native-host build plus full Rust lib tests can leave enough
        # transient target artifacts to exhaust GitHub's ephemeral runner disk
        # before clippy writes final rmeta files. Tests have already passed at
        # this point, so clean build products and let clippy rebuild what it
        # needs without weakening validation.
        run: |
          rm -rf target/debug
          df -h .

      - name: Clippy (apps/desktop + apps/cli, default features)
        # Scope clippy to the binaries we actually ship. The 100+ ported
        # codex-rs crates under crates/* legitimately use unsafe (PTY,
        # exec policy, etc.) and would fail `-D unsafe-code` even though
        # they're well-vetted upstream. M28: -D warnings matches the
        # apps/desktop/src-tauri/Cargo.toml [lints] table; keeps CI and
        # local linting consistent for the surface that actually runs.
        env:
          CARGO_INCREMENTAL: '0'
        run: cargo clippy -p agiworkforce-desktop -p agiworkforce-cli --lib -- -D warnings -D unsafe-code

  desktop-e2e:
    name: Desktop E2E (deterministic mocks)
    runs-on: ubuntu-24.04
    needs: scope
    if: needs.scope.outputs.desktop_changed == 'true'
    timeout-minutes: 30
    env:
      # Keep deterministic-mock E2E independent of repository secrets.
      NEON_DATABASE_URL: postgres://postgres:postgres@localhost:5432/agiworkforce_test
      CLERK_SECRET_KEY: test-clerk-secret-key
      # Without this the sign-in card renders its "in-app sign-in is not
      # configured" fallback instead of the real form, and the reviewed pixel
      # baseline can never match. Clerk parses the key rather than just reading
      # its prefix, it must base64-decode to a `<host>$` string or the SDK
      # throws "Publishable key not valid", so this is the fake
      # clerk.example.test key scripts/check-clerk-bot-protection.test.mjs
      # builds, not a secret.
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS50ZXN0JA
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9.15.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/desktop
        run: pnpm exec playwright install --with-deps

      - name: Build desktop web frontend
        working-directory: apps/desktop
        env:
          CI: true
        run: pnpm build:web

      - name: Start Vite dev server
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          VITE_DEV_PORT=5175 TAURI_DEV_HOST=127.0.0.1 pnpm dev:vite > app.log 2>&1 &
          echo $! > app.pid
          echo "Started Vite server with PID $(cat app.pid)"

      - name: Wait for app
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          for i in {1..90}; do
            if ! kill -0 "$(cat app.pid)" > /dev/null 2>&1; then
              echo "Vite process exited before app became ready"
              tail -200 app.log || true
              exit 1
            fi
            if curl -fsS http://127.0.0.1:5175/ > /dev/null; then
              echo "App is ready after $((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start"
          tail -200 app.log || true
          exit 1

      - name: Run deterministic Playwright suite
        working-directory: apps/desktop
        env:
          CI: true
          E2E_MOCK_CLOUD_DB: '1'
          E2E_MOCK_LLM: '1'
        run: |
          pnpm exec playwright test \
            --project=smoke \
            --project=self-healing \
            --project=visual-regression \
            --project=accessibility-audit \
            --retries=2 \
            --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/desktop/playwright-report
          retention-days: 14

      - name: Stop Vite dev server
        if: always()
        run: |
          if [ -f apps/desktop/app.pid ]; then
            kill "$(cat apps/desktop/app.pid)" 2>/dev/null || true
          fi

  browser-extension-e2e:
    name: Chrome extension E2E (real Chromium)
    runs-on: ubuntu-24.04
    needs: scope
    if: needs.scope.outputs.extension_changed == 'true'
    timeout-minutes: 30
    env:
      # Public, non-routable fixtures. This produces a structurally valid ZIP
      # for exact-byte Chromium smoke without creating a publishable artifact.
      CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmstY2kuaW52YWxpZCQ
      CLERK_FRONTEND_API: https://clerk-ci.invalid
      CLERK_SYNC_HOST: https://clerk-ci.invalid
      CHROME_EXTENSION_PUBLIC_KEY: 
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9.15.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and exercise the exact store ZIP in Chromium
        run: |
          pnpm --filter @agiworkforce/extension package
          pnpm --filter @agiworkforce/extension test:e2e:package

  vscode-extension-e2e:
    name: VS Code + CLI clean-profile E2E
    runs-on: ubuntu-24.04
    needs: scope
    if: needs.scope.outputs.vscode_changed == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9.15.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: '1.94.0'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Install extension-host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2-dev libudev-dev pkg-config
          pnpm install --frozen-lockfile

      - name: Build the first-party CLI runtime for the protocol probe
        env:
          AGIWORKFORCE_SKIP_VENDORED_BWRAP: '1'
          RUSTFLAGS: ''
          CARGO_INCREMENTAL: '0'
        run: cargo build --locked -p agiworkforce-cli --bin agi

      - name: Build and exercise the exact VSIX in a clean VS Code profile
        env:
          AGI_VSCODE_E2E_CLI: ${{ github.workspace }}/target/debug/agi
        run: xvfb-run --auto-servernum pnpm --filter agi-workforce test:integration:package

  mobile-e2e:
    name: Mobile E2E (iOS simulator)
    # macos-15 pins Xcode 16.4, whose Swift tools version cannot read
    # clerk-ios >= 1.2.0 (tools 6.2), so SPM resolution fails before the app
    # ever builds. macos-26 ships the Xcode 26 line that understands it.
    runs-on: macos-26
    needs: scope
    if: needs.scope.outputs.mobile_changed == 'true'
    timeout-minutes: 75
    env:
      APP_ENV: development
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_AGI_VISUAL_QA_DISABLE_BIOMETRIC: '1'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9.15.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Homebrew now refuses third-party tap formulae until they are explicitly
      # trusted, which broke this job outright:
      #
      #   Refusing to load formula wix/brew/applesimutils from untrusted tap wix/brew.
      #
      # Trust is granted to THE ONE FORMULA, not the whole tap, and certainly not
      # by exporting HOMEBREW_NO_REQUIRE_TAP_TRUST=1. That env var disables the
      # check globally for every formula in the job, it is a supply-chain
      # control, and switching it off to make CI green is the same move that let
      # a crashed Semgrep report success for months. Homebrew documents it as
      # not recommended and slated for removal.
      - name: Install Detox simulator utilities
        run: |
          brew tap wix/brew
          brew trust --formula wix/brew/applesimutils
          brew install applesimutils
          pnpm --filter @agiworkforce/mobile exec detox build-framework-cache

      - name: Select an available iPhone simulator
        run: |
          set -euo pipefail
          device_name="$(xcrun simctl list devices available -j | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => (input += chunk));
            process.stdin.on("end", () => {
              const runtimes = Object.values(JSON.parse(input).devices);
              const device = runtimes.flat().find(
                (candidate) => candidate.isAvailable && candidate.name.startsWith("iPhone"),
              );
              if (!device) process.exit(1);
              process.stdout.write(device.name);
            });
          ')"
          echo "DETOX_IOS_DEVICE=$device_name" >> "$GITHUB_ENV"
          echo "Selected $device_name"

      - name: Generate the ignored iOS project
        run: pnpm --filter @agiworkforce/mobile exec expo prebuild --platform ios --clean

      - name: Build the release simulator app
        run: pnpm --filter @agiworkforce/mobile exec detox build --configuration ios.sim.release

      - name: Exercise first-run onboarding on the simulator
        run: pnpm --filter @agiworkforce/mobile test:e2e:ios:ci

      - name: Upload Detox artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-detox-artifacts
          path: apps/mobile/artifacts/mobile-e2e
          retention-days: 14

  web-a11y:
    name: Web E2E and accessibility audit
    runs-on: ubuntu-24.04
    needs: scope
    if: needs.scope.outputs.web_changed == 'true'
    timeout-minutes: 30
    # DATABASE_URL below points at a Postgres this job never started, so every
    # page answered 500 from the health check. The env-validation crash used to
    # kill the server first and hide it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agiworkforce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agiworkforce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agiworkforce_test
      NEON_DATABASE_URL: postgres://postgres:postgres@localhost:5432/agiworkforce_test
      # next start makes NODE_ENV production, which arms rate-limit.ts's
      # SEV-WEB-13 module-scope guard (Redis credentials or refuse to serve) and
      # empty-500s every rate-limited API route. This single-instance CI server
      # is a preview-class environment, so use the guard's own preview exemption
      # instead of weakening the guard or faking Redis.
      VERCEL_ENV: preview
      CLERK_SECRET_KEY: test-clerk-secret-key
      # The same public, non-routable clerk-ci.invalid fixture the packaging
      # jobs use, and live-format on purpose. A pk_test_ key names a Clerk
      # DEVELOPMENT instance, and those issue a dev-browser JWT via a handshake
      # redirect to their frontend API before any route calling auth() renders
      #, the reason validate-env.ts warns about pk_test in production. `/` is
      # the only audited page that calls auth(), so it chased that redirect to
      # a host that does not resolve and was the one page never scanned. A live
      # instance reads cookies directly: no cookies, signed out, no redirect.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmstY2kuaW52YWxpZCQ
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      # `next start` sets NODE_ENV=production, so instrumentation.ts treats a
      # missing billing key as a fatal boot error. These flows are signed-out
      # a11y and public-auth checks that never reach Stripe, and putting real
      # or realistic keys on a public CI runner would be worse than booting
      # degraded, so take the escape hatch the validator documents.
      AGI_ALLOW_INVALID_ENV: '1'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9.15.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare the test database
        run: pnpm db:migrate -- apply --target ci

      - name: Build Web app
        # next build's own "Running TypeScript..." phase has hit
        # "Ineffective mark-compacts near heap limit" under Node's default
        # old-space cap here, independent of the js-verify job's tsc --noEmit.
        # 6 GB of old space stays under this runner's memory while covering
        # the ~3 GB the type-check phase needs.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm --filter @agiworkforce/web build

      - name: Start Web app
        run: |
          set -euo pipefail
          pnpm --filter @agiworkforce/web start > apps/web/app.log 2>&1 &
          echo $! > apps/web/app.pid

      - name: Wait for Web app
        run: |
          set -euo pipefail
          for i in {1..90}; do
            if ! kill -0 "$(cat apps/web/app.pid)" > /dev/null 2>&1; then
              echo "Web process exited before the app became ready"
              tail -200 apps/web/app.log || true
              exit 1
            fi
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              echo "Web app is ready after $((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "Web app failed to start"
          tail -200 apps/web/app.log || true
          exit 1

      - name: Run blocking WCAG 2.1 A/AA audit
        run: pnpm --filter @agiworkforce/web a11y:audit

      - name: Run signed-out Web Playwright flows
        working-directory: apps/web
        env:
          PLAYWRIGHT_REUSE_RUNNING_SERVER: '1'
        run: pnpm exec playwright test public-auth-clean.spec.ts checkout.spec.ts --project=chromium --workers=1

      - name: Print Web app log on failure
        if: failure()
        run: tail -n 300 apps/web/app.log

      - name: Upload Web Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-playwright-report
          path: apps/web/playwright-report
          retention-days: 14

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-accessibility-report
          path: apps/web/reports/a11y-report.json
          retention-days: 14

      - name: Stop Web app
        if: always()
        run: |
          if [ -f apps/web/app.pid ]; then
            kill "$(cat apps/web/app.pid)" 2>/dev/null || true
          fi

  clippy-all-features:
    name: Clippy (all features)
    runs-on: ubuntu-24.04
    needs: scope
    # Rust builds every crate in the workspace from source and is the
    # slowest thing in CI by an order of magnitude. It only covers desktop
    # and CLI, which are built and tested locally before they ship, so on
    # pull requests the cost buys almost nothing. Running it on main keeps
    # the gate: a native regression still blocks the production promotion,
    # it is just caught at merge instead of at review.
    if: needs.scope.outputs.native_changed == 'true' && github.ref == 'refs/heads/main'
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libleptonica-dev libpng-dev libjpeg-dev libtiff-dev zlib1g-dev libwebp-dev tesseract-ocr libtesseract-dev libasound2-dev xvfb libclang-dev

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: '1.94.0'
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
          cache-on-failure: true
          # Use separate cache key for all-features build
          key: all-features

      - name: Ensure clippy is available
        run: rustup component add clippy --toolchain 1.94.0

      - name: Prepare native messaging sidecar placeholder
        run: |
          triple="$(rustc -vV | awk '/^host: / {print $2}')"
          mkdir -p apps/desktop/src-tauri/binaries
          printf '#!/usr/bin/env sh\nexit 1\n' > "apps/desktop/src-tauri/binaries/native_messaging_host-${triple}"
          chmod +x "apps/desktop/src-tauri/binaries/native_messaging_host-${triple}"

      - name: Clippy (extended features, includes optional OCR/vision)
        # M28: -D warnings matches [lints] table in Cargo.toml; keeps CI and local linting consistent.
        #
        # NB1: `--all-features` is not used because the opt-in `remote-databases`
        # feature pulls bson@3.1 + mongodb@3.5 + redis@1.2, and the consumer code
        # in apps/desktop/src-tauri/src/data/database/{nosql_client,redis_client}.rs
        # still targets the prior bson 2.x / mongodb 2.x / redis 1.1 APIs. Users
        # who enable `remote-databases` will hit those compile errors locally; CI
        # is scoped to features that ship by default + the optional ones we lint.
        # Restoring `--all-features` is gated on a tracking TODO to either update
        # the consumer code to the new bson/mongodb/redis APIs or pin the deps.
        #
        # NB2: `--lib` (not `--all-targets`) matches the scope of the main Clippy
        # step at line 162. Test-target lints surface a separate 36-error backlog
        # that pre-dates this job's feature scoping; tracked as follow-up rather
        # than gating shipping-binary lint here.
        #
        # NB3: `sentry` is NOT in the feature list because agiworkforce-desktop
        # has no such feature. Cargo rejects an unknown feature before it lints
        # anything ("none of the selected packages contains this feature"), so
        # while it was listed this lane failed on every commit and linted zero
        # lines. It went unnoticed because the lane used to run only after a
        # 120-minute monolithic `check` job, which had not passed since
        # 2026-07-21. It now gates only on `scope`. Every name below is
        # verified against [features] in apps/desktop/src-tauri/Cargo.toml, and
        # `pnpm check:workflow-cargo-features` re-verifies it on every run.
        #
        # NB4: the rationale above lives OUTSIDE the shell script on purpose. A
        # `#` comment cannot sit between a line-continuation backslash and its
        # continuation: the shell joins the two lines first, so the comment
        # swallows the rest of the command. That truncated `cargo clippy
        # --workspace --lib` (no features, no `-D warnings`), then tried to run
        # `--features` as a command and exited 127. Guarded by
        # `pnpm check:workflow-cargo-features`.
        run: |
          cargo clippy --workspace --lib \
            --features "agiworkforce-desktop/ocr,agiworkforce-desktop/local-llm,agiworkforce-desktop/webrtc-support,agiworkforce-desktop/local-whisper,agiworkforce-desktop/devtools" \
            -- -D warnings

  # macOS smoke check: compile + clippy on the primary target platform.
  # Gated only on change detection so a failure in another lane cannot suppress
  # this lane's evidence.
  macos-smoke:
    name: macOS Rust smoke (cargo check + clippy)
    runs-on: macos-latest
    needs: scope
    # Rust builds every crate in the workspace from source and is the
    # slowest thing in CI by an order of magnitude. It only covers desktop
    # and CLI, which are built and tested locally before they ship, so on
    # pull requests the cost buys almost nothing. Running it on main keeps
    # the gate: a native regression still blocks the production promotion,
    # it is just caught at merge instead of at review.
    if: needs.scope.outputs.native_changed == 'true' && github.ref == 'refs/heads/main'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: '1.94.0'
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
          cache-on-failure: true
          key: macos-smoke

      - name: Prepare native messaging sidecar placeholder
        run: |
          triple="$(rustc -vV | awk '/^host: / {print $2}')"
          mkdir -p apps/desktop/src-tauri/binaries
          printf '#!/usr/bin/env sh\nexit 1\n' > "apps/desktop/src-tauri/binaries/native_messaging_host-${triple}"
          chmod +x "apps/desktop/src-tauri/binaries/native_messaging_host-${triple}"

      - name: cargo check (default features, macOS)
        working-directory: apps/desktop/src-tauri
        run: cargo check --workspace

      - name: Clippy (default features, macOS)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --workspace --lib -- -D warnings -D unsafe-code

  # FIX-009 (Sprint 4): Windows-only bugs (path separators, native APIs,
  # cfg(target_os = "windows") branches) used to surface only at release
  # time when the macos/linux jobs had already passed. This smoke job
  # catches them at PR time before maintainers invoke the separate Windows
  # packaging workflow.
  windows-smoke:
    name: Windows Rust smoke (cargo check + tests, --skip linux-only)
    runs-on: windows-latest
    needs: scope
    # Rust builds every crate in the workspace from source and is the
    # slowest thing in CI by an order of magnitude. It only covers desktop
    # and CLI, which are built and tested locally before they ship, so on
    # pull requests the cost buys almost nothing. Running it on main keeps
    # the gate: a native regression still blocks the production promotion,
    # it is just caught at merge instead of at review.
    if: needs.scope.outputs.native_changed == 'true' && github.ref == 'refs/heads/main'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: '1.94.0'
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
          cache-on-failure: true
          key: windows-smoke

      - name: Prepare native messaging sidecar placeholder
        shell: pwsh
        run: |
          $triple = ((rustc -vV) | Select-String '^host: ').ToString().Split(' ')[1]
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/binaries | Out-Null
          New-Item -ItemType File -Force -Path "apps/desktop/src-tauri/binaries/native_messaging_host-$triple.exe" | Out-Null

      - name: cargo check (default features, Windows)
        working-directory: apps/desktop/src-tauri
        run: cargo check --workspace

      - name: cargo test --workspace --lib (default features, Windows)
        working-directory: apps/desktop/src-tauri
        # Skip Linux-only modules (landlock, seccompiler) and DE-dependent
        # automation suites by name. Anything else must pass.
        #
        # TODO(windows-test-load): the agiworkforce-desktop test binary fails
        # to load on the Windows runner with STATUS_ENTRYPOINT_NOT_FOUND
        # (0xc0000139), a Windows-specific cross-CRT/DLL incompatibility
        # introduced somewhere in the C-FFI dependency graph (libsqlite3-sys
        # with bundled-sqlcipher-vendored-openssl, xcap, whisper-rs, or
        # similar). cargo check + clippy on the same Windows toolchain pass,
        # so the build itself is sound; only the test loader trips on a
        # mismatched DLL import at process startup. Marking continue-on-error
        # to unblock CI while keeping the Windows check + Windows clippy
        # strict, and the shared crates blocking on Linux in the Test step
        # above. Track investigation separately, requires a real Windows
        # machine for procmon/depends.exe analysis.
        continue-on-error: true
        run: cargo test --workspace --lib -- --skip landlock --skip seccomp --skip linux_sandbox

      - name: Clippy (default features, Windows)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --workspace --lib -- -D warnings -D unsafe-code

  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    if: always()
    needs:
      - scope
      - repo-guards
      - database
      - js-verify
      - security
      - auto-route-conformance
      - rust-desktop-cli
      - desktop-e2e
      - browser-extension-e2e
      - vscode-extension-e2e
      - mobile-e2e
      - web-a11y
      - clippy-all-features
      - macos-smoke
      - windows-smoke
    steps:
      - name: Fail if any lane failed or was cancelled
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -qE '"result": *"(failure|cancelled)"'; then
            echo "::error::At least one CI lane did not succeed"
            exit 1
          fi
