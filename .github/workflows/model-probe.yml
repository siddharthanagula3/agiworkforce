name: Model Probe

# Asks every registered model whether it still answers, once a week.
#
# It commits nothing. The probe file is uploaded as an artifact so a stage
# advance stays a deliberate local act, and the job fails only on the finding
# it exists to report: a promoted model that stopped answering. A model whose
# credential is absent from CI is recorded as unprobed, never as a failure.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/probe-models.mjs'
      - 'scripts/probe-models.test.mjs'
      - '.github/workflows/model-probe.yml'

permissions:
  contents: read

concurrency:
  group: model-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe-logic:
    name: Self-test the probe against a fake adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: node --test scripts/probe-models.test.mjs

  probe-providers:
    name: Probe every registered model with the credentials CI holds
    needs: probe-logic
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Probe every registered model
        run: pnpm exec tsx scripts/probe-models.mjs --out "$RUNNER_TEMP/model-probe.json" --require-promoted

      - name: Upload the probe record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/model-probe.json
          retention-days: 90

      - name: Leave the checkout untouched
        if: always()
        run: git diff --exit-code
