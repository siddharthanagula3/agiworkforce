name: Recovery Drills

on:
  schedule:
    - cron: '13 5 * * 1'
  workflow_dispatch:

concurrency:
  group: recovery-drills-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  logical-restore-drill:
    name: Logical restore drill (postgres:17)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: agiworkforce_drill
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agiworkforce_drill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.3

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The service container ships postgres:17 but not its client tools; the
      # default Ubuntu 24.04 archive ships an older client major version, and
      # pg_dump must be the same major version as the server or newer, never
      # older, so the matching client comes from the PGDG apt repository.
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo wget --quiet -O /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Apply canonical Postgres migrations
        env:
          AGI_DATABASE_URL: postgres://postgres:changeme@localhost:5432/agiworkforce_drill
        run: pnpm db:migrate -- apply --target ci

      # The drill seeds a row in every core table before the dump. An empty
      # database restores an empty database, which proves the commands ran and
      # nothing about whether data survives them; the seed is refused against
      # any source that is not on this machine.
      - name: Run the logical restore drill
        env:
          AGI_RESTORE_DRILL_SOURCE_URL: postgres://postgres:changeme@localhost:5432/agiworkforce_drill
          AGI_RESTORE_DRILL_TARGET_ADMIN_URL: postgres://postgres:changeme@localhost:5432/postgres
          AGI_RESTORE_DRILL_SEED: '1'
          AGI_RESTORE_DRILL_MAX_SECONDS: '600'
        run: node scripts/db-restore-drill-logical.mjs

  # A rollback that has never been run is a claim, not a capability. This drill
  # resolves the deployment production would revert to and records the result in
  # the release audit trail, so the dashboard can answer "when was the rollback
  # path last known to work" with a row rather than an assumption.
  #
  # It never acts: `--drill` forces the resolver into dry run, so the only Vercel
  # calls it makes are a project read and a deployment listing.
  release-rollback-drill:
    name: Rollback drill (resolve only, never acts)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      AGI_DATABASE_URL: ${{ secrets.AGI_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Self-test the rollback resolver
        run: node --test scripts/release/rollback.test.mjs

      - name: Resolve the deployment production would roll back to
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          node scripts/release/rollback.mjs --drill
          --reason 'scheduled rollback drill' --run-url "$RUN_URL"
