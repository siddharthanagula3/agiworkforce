# The full public matrix runs on demand because it contains thousands of
# browser cases. Its cold proof and immutable image are produced once.
name: Web Public Acceptance Matrix

on:
  workflow_dispatch:
    inputs:
      routes:
        description: 'Comma-separated public paths to check, for example /pricing,/about. Empty checks every route.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: web-public-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-runtime-proof:
    name: Build and observe the public runtime once
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: agiworkforce_public_build
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agiworkforce_public_build"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AGI_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/agiworkforce_public_build
      PUBLIC_RUNTIME_IMAGE: agi-public-proof:${{ github.sha }}
      PUBLIC_RUNTIME_POSTGRES_IMAGE: pgvector/pgvector:pg17
      PUBLIC_RUNTIME_PROOF_ARTIFACT: ${{ github.workspace }}/apps/web/.cache/public-runtime-proof/proof.json
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmstY2kuaW52YWxpZCQ
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_REUSE_RUNNING_SERVER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare memory for private-repository checks
        if: github.event.repository.private == true
        uses: ./.github/actions/prepare-runner-memory

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare the disposable build database
        run: pnpm db:migrate -- apply --target ci

      - name: Build the exact source revision with its server maps
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          node scripts/public-runtime/build-evidence.mjs dockerfile > "$RUNNER_TEMP/public-proof.Dockerfile"
          docker build --network=host \
            --file "$RUNNER_TEMP/public-proof.Dockerfile" \
            --label "org.agi.public-proof.revision=$GITHUB_SHA" \
            --tag "$PUBLIC_RUNTIME_IMAGE" \
            --build-arg AGI_RELEASE_SHA="$GITHUB_SHA" \
            --build-arg DATABASE_URL="$AGI_DATABASE_URL" \
            --build-arg NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_APP_URL" \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" \
            --build-arg NEXT_PUBLIC_AGI_BOT_PROTECTION=off \
            .

      - name: Observe every required cold route state
        working-directory: apps/web
        env:
          PUBLIC_RUNTIME_PROOF_MODE: full
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/public-runtime
        run: pnpm exec playwright test e2e/matrix/public-runtime-proof.spec.ts --project=chromium --workers=1 --retries=0 --output=test-results/public-runtime

      - name: Preserve the exact application and PostgreSQL images
        run: |
          set -euo pipefail
          app_image=$(node -e 'const p=JSON.parse(require("node:fs").readFileSync(process.env.PUBLIC_RUNTIME_PROOF_ARTIFACT,"utf8"));process.stdout.write(p.imageId)')
          postgres_image=$(node -e 'const p=JSON.parse(require("node:fs").readFileSync(process.env.PUBLIC_RUNTIME_PROOF_ARTIFACT,"utf8"));process.stdout.write(p.postgresImageId)')
          artifact_directory=$(dirname "$PUBLIC_RUNTIME_PROOF_ARTIFACT")
          docker image save "$app_image" "$postgres_image" | gzip -1 > "$artifact_directory/runtime-images.tar.gz"
          cd "$artifact_directory"
          sha256sum runtime-images.tar.gz > runtime-images.sha256

      - name: Upload the shared runtime evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-runtime-proof-${{ github.sha }}
          path: apps/web/.cache/public-runtime-proof
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Remove verified owned runtime resources
        if: always()
        run: node scripts/public-runtime/cleanup.mjs

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-runtime-diagnostics-${{ github.sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  public-matrix:
    name: Public pages at ${{ matrix.width }}px
    needs: public-runtime-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        width: [320, 360, 390, 768, 1024, 1366, 1440, 1920]
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_REUSE_RUNNING_SERVER: '1'
      PUBLIC_RUNTIME_PROOF_ARTIFACT: ${{ github.workspace }}/apps/web/.cache/public-runtime-proof/proof.json
      PUBLIC_DESIGN_WIDTHS: ${{ matrix.width }}
      SELECTED_ROUTES: ${{ inputs.routes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare memory for private-repository checks
        if: github.event.repository.private == true
        uses: ./.github/actions/prepare-runner-memory

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Download the shared runtime evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: public-runtime-proof-${{ github.sha }}
          path: apps/web/.cache/public-runtime-proof

      - name: Load the exact observed images
        run: |
          set -euo pipefail
          cd "$(dirname "$PUBLIC_RUNTIME_PROOF_ARTIFACT")"
          sha256sum --check runtime-images.sha256
          gzip --decompress --stdout runtime-images.tar.gz | docker image load

      - name: Run the public acceptance matrix at this width
        id: public_standard
        working-directory: apps/web
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/public-standard
        run: |
          set -euo pipefail
          if [ -n "$SELECTED_ROUTES" ]; then
            export PUBLIC_DESIGN_ROUTES="$SELECTED_ROUTES"
          fi
          pnpm exec playwright test e2e/matrix/public-design-standard.spec.ts --project=chromium --workers=1 --retries=0 --output=test-results/public-standard

      - name: Measure the shared footer at this width
        if: ${{ !cancelled() && (steps.public_standard.outcome == 'success' || steps.public_standard.outcome == 'failure') }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/public-footer
        run: |
          set -euo pipefail
          if [ -n "$SELECTED_ROUTES" ]; then
            export PUBLIC_DESIGN_ROUTES="$SELECTED_ROUTES"
          fi
          node scripts/public-runtime/serve-footer.mjs > apps/web/public-footer-runtime.log 2>&1 &
          footer_pid=$!
          stop_footer() {
            status=$?
            trap - EXIT
            if kill -0 "$footer_pid" 2>/dev/null; then
              kill -TERM "$footer_pid" || status=1
            fi
            if ! wait "$footer_pid"; then status=1; fi
            exit "$status"
          }
          trap stop_footer EXIT
          ready=false
          for attempt in {1..90}; do
            if ! kill -0 "$footer_pid" 2>/dev/null; then
              cat apps/web/public-footer-runtime.log
              exit 1
            fi
            if node -e 'const s=require("node:net").connect(3000,"127.0.0.1");s.once("connect",()=>s.end());s.once("error",()=>process.exit(1));s.setTimeout(500,()=>process.exit(1));'; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          pnpm --filter @agiworkforce/web exec playwright test e2e/matrix/public-footer-measured.spec.ts --project=chromium --workers=1 --retries=0 --output=test-results/public-footer

      - name: Remove verified owned runtime resources
        if: always()
        run: node scripts/public-runtime/cleanup.mjs

      - name: Upload matrix report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-public-matrix-report-${{ matrix.width }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/public-footer-runtime.log
          retention-days: 14
