name: CodeQL analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: CodeQL Rust scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.rust.outputs.rust }}
    steps:
      - name: Explain unavailable code scanning
        if: github.event.repository.private == true
        run: echo '::notice::CodeQL did not run because code scanning is unavailable for this repository. The Semgrep gate in ci.yml remains the enforced static analysis.'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.repository.private == false
        with:
          fetch-depth: 0

      - name: Detect Rust or Cargo changes
        if: github.event.repository.private == false
        id: rust
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo 'rust=true' >> "$GITHUB_OUTPUT"
          elif [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo 'rust=true' >> "$GITHUB_OUTPUT"
          else
            changed=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA") || {
              echo 'rust=true' >> "$GITHUB_OUTPUT"
              exit 0
            }
            if grep -Eq '(^|/)([^/]+\.rs|Cargo\.(toml|lock))$|^\.github/workflows/codeql-analysis\.yml$' <<< "$changed"; then
              echo 'rust=true' >> "$GITHUB_OUTPUT"
            else
              echo 'rust=false' >> "$GITHUB_OUTPUT"
            fi
          fi

  interpreted:
    name: CodeQL (${{ matrix.language }})
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, ruby]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:${{ matrix.language }}

  rust:
    name: CodeQL (rust)
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:rust
