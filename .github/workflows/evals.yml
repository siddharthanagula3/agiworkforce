name: AI output quality evals

# The three jobs answer different questions.
#
# `harness` runs on every change to the harness and proves the harness itself:
# the graders reject the failures they claim to reject, the corpora are well
# formed, and the gate fails a system that answers badly. It calls no provider
# and measures no model. It also fails closed on the evidence the promotion gate
# depends on: a prompt with no corpus and no recorded reason, and a baseline that
# is malformed, replayed rather than measured, or orphaned by its family slot.
#
# `certification` runs on pull requests only and demands a satisfied 14C.591 or
# 14C.592 checklist for every model and route the branch adds. The eval lines are
# computed from the committed measurement and cannot be asserted; the operational
# lines need a signer, a date and evidence.
#
# `live-quality` is the measurement, and it is the only job whose result says
# anything about a model. It bills real tokens (33 rows, one non-streaming
# Messages call each, 512 output tokens max), so it runs weekly on a schedule
# and on demand from the Actions tab, not per push or per PR.
#
# What it measures, exactly: the catalog's default Anthropic model answering a
# bare single-turn prompt. No system prompt, no capability preamble, no routing,
# no tools, no streaming. It therefore catches a change of model or of provider
# behaviour; it does NOT catch a regression in the product's own prompts
# (apps/web/app/api/llm/v1/chat/completions/lib/request-processor.ts,
# lib/capability-preamble.ts) or in routing (packages/ai/routing), because it
# does not execute either of them. Extending the responder to the product chat
# path is the work that would make this a prompt/routing regression gate.

# The trigger list is the answer to "what could move a score". A corpus and a
# model are the obvious two; the product's own prompts, the adapter that speaks
# to a provider, the routing that picks one and the registry the harness reads
# its target from are the four that used to change without this workflow
# noticing, which is exactly the regression the harness cannot see afterwards.
on:
  pull_request:
    paths:
      - 'tools/evals/**'
      - 'packages/contracts/types/src/models.json'
      - 'packages/contracts/types/src/provider-adapter.ts'
      - 'packages/ai/model-registry/catalog/**'
      - 'packages/ai/model-registry/generated/registry.json'
      - 'packages/ai/model-registry/scripts/**'
      - 'packages/ai/providers/**'
      - 'packages/ai/routing/**'
      - 'apps/web/lib/prompts/**'
      - 'apps/web/app/api/llm/v1/chat/completions/lib/request-processor.ts'
      - 'apps/web/app/api/llm/v1/chat/completions/lib/capability-preamble.ts'
      - '.github/workflows/evals.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/evals/**'
      - 'packages/contracts/types/src/models.json'
      - 'packages/contracts/types/src/provider-adapter.ts'
      - 'packages/ai/model-registry/catalog/**'
      - 'packages/ai/model-registry/generated/registry.json'
      - 'packages/ai/model-registry/scripts/**'
      - 'packages/ai/providers/**'
      - 'packages/ai/routing/**'
      - 'apps/web/lib/prompts/**'
      - 'apps/web/app/api/llm/v1/chat/completions/lib/request-processor.ts'
      - 'apps/web/app/api/llm/v1/chat/completions/lib/capability-preamble.ts'
      - '.github/workflows/evals.yml'
  schedule:
    # Weekly on Monday at 05:40 UTC, matching the other scheduled jobs in this
    # repo. Scheduled runs ignore the `paths` filters above, which is the point:
    # model quality moves without anything in this directory changing.
    - cron: '40 5 * * 1'
  workflow_dispatch:

# Keyed on the event as well as the ref, and only PR runs are cancellable: a
# weekly measurement cancelled by a push to main is a week with no measurement,
# which looks identical to a week that passed.
concurrency:
  group: evals-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: these jobs only read the checkout.
permissions:
  contents: read

jobs:
  harness:
    name: Eval harness (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the harness
        run: pnpm exec tsc --noEmit -p tools/evals/tsconfig.json

      # `pnpm lint` is `turbo run lint` over the workspace, and tools/ is not a
      # workspace package, so nothing else in CI ever lints this directory.
      - name: Lint the harness
        run: pnpm exec eslint tools/evals --max-warnings=0

      - name: Run the harness
        run: pnpm exec vitest run tools/evals

      # Grades the committed reference recording and every committed live
      # recording under tools/evals/measurements with no provider call. A
      # recording whose request no longer matches the corpus fails here.
      - name: Replay recorded responses (no network)
        run: pnpm evals:replay

      # Every product prompt either has a corpus that measures it or a recorded
      # reason it has none. A prompt added without either fails here, which is
      # what stops the trigger list above from running a harness that covers
      # nothing the change touched.
      - name: Every product prompt is covered or accounted for
        run: node tools/evals/scripts/prompt-coverage.mjs

      # Fails closed on the evidence the promotion gate depends on: a baseline
      # that is malformed, replayed rather than measured, or left behind by a
      # family slot that no longer exists is a gate that would wave a promotion
      # through. Suites that did not meet their own corpus threshold are printed
      # so the reading is in the log, not only in the file.
      - name: Audit the committed eval baselines
        run: node tools/evals/scripts/promotion-gate.mjs --audit

  certification:
    name: New model and route certification (14C.591/592)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The gate reads the registry on both sides of the merge base to see
          # what this branch adds; a shallow checkout would report every model
          # as new.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # A model or route this branch adds may only merge once every line of its
      # release checklist is satisfied: the eval lines are computed from the
      # committed measurement and cannot be asserted, and the operational lines
      # need a name, a date and evidence. A branch that adds neither passes
      # without doing anything.
      - name: Certify every model and route this branch adds
        run: node tools/evals/scripts/certification-gate.mjs --base "origin/${{ github.base_ref }}"

  live-quality:
    name: Live model quality (paid, weekly + on demand)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AGIWORKFORCE_LIVE_TEST: '1'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Without the key the live corpora skip themselves and the run would be
      # green while measuring nothing, so say so and stop instead. On the weekly
      # schedule this is the signal that no quality measurement is happening:
      # a red Monday means the secret is missing, not that the model regressed.
      - name: Require the provider key
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "ANTHROPIC_API_KEY is not set for this repository; the live corpora cannot run." >&2
            exit 1
          fi

      - name: Measure output quality
        run: pnpm exec vitest run tools/evals
