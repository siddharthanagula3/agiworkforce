name: Release VS Code Extension

on:
  push:
    tags:
      - 'v-vscode-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v-vscode-X.Y.Z tag to package'
        required: true
        type: string
      publish:
        description: 'Publish the verified VSIX after protected-environment approval'
        required: true
        type: boolean
        default: false

concurrency:
  group: release-vscode-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '9.15.3'

jobs:
  package:
    name: Verify and package VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      vsix: ${{ steps.metadata.outputs.vsix }}
      channel: ${{ steps.channel.outputs.channel }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      vsce_args: ${{ steps.channel.outputs.vsce_args }}
    steps:
      - name: Checkout the selected release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # The Marketplace has two channels and rejects a semver prerelease
      # identifier in the manifest, so the channel lives in the tag suffix while
      # package.json keeps the plain X.Y.Z both channels share.
      - name: Resolve the release channel this tag publishes to
        id: channel
        shell: bash
        env:
          SELECTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node scripts/release/resolve-channel.mjs vscode "$SELECTED_TAG"

      - name: Require an exact release tag and matching source version
        id: metadata
        shell: bash
        env:
          SELECTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          CORE_VERSION: ${{ steps.channel.outputs.core_version }}
        run: |
          set -euo pipefail
          # Two exact forms and nothing else: X.Y.Z publishes stable, and
          # X.Y.Z-<channel>.<n> publishes pre-release from the same source.
          if ! printf '%s' "$SELECTED_TAG" | grep -Eq '^v-vscode-[0-9]+\.[0-9]+\.[0-9]+$' \
            && ! printf '%s' "$SELECTED_TAG" | grep -Eq '^v-vscode-[0-9]+\.[0-9]+\.[0-9]+-(beta|rc|nightly|alpha|canary)\.[0-9]+$'; then
            echo "ERROR: VS Code release tags must use v-vscode-X.Y.Z or v-vscode-X.Y.Z-<channel>.<n>" >&2
            exit 1
          fi
          if [ "$(git describe --tags --exact-match HEAD)" != "$SELECTED_TAG" ]; then
            echo "ERROR: checked-out commit is not the selected release tag $SELECTED_TAG" >&2
            exit 1
          fi

          PACKAGE_VERSION=$(node -p "require('./apps/extension-vscode/package.json').version")
          if [ "$PACKAGE_VERSION" != "$CORE_VERSION" ]; then
            echo "ERROR: tag $SELECTED_TAG does not match extension version $PACKAGE_VERSION" >&2
            exit 1
          fi

          echo "tag=${SELECTED_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${CORE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "vsix=agi-workforce-${CORE_VERSION}.vsix" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Extension Host display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Validate extension source
        run: |
          pnpm --filter agi-workforce typecheck
          pnpm --filter agi-workforce lint
          pnpm --filter agi-workforce test
          pnpm --filter agi-workforce test:webview
          pnpm --filter agi-workforce check:vscode-theme-tokens

      # The release gates themselves are tested first: a guard whose fixtures no
      # longer fail it is a step that passes without checking anything.
      - name: Self-test the release guards
        run: node --test scripts/lib/rollout/release-guards.test.mjs

      - name: Build and verify the VSIX
        env:
          VSIX_NAME: ${{ steps.metadata.outputs.vsix }}
        run: |
          set -euo pipefail
          pnpm --filter agi-workforce package
          pnpm --dir apps/extension-vscode verify:package
          test -f "apps/extension-vscode/${VSIX_NAME}"

          mkdir -p dist/vscode
          cp "apps/extension-vscode/${VSIX_NAME}" "dist/vscode/${VSIX_NAME}"
          sha256sum "dist/vscode/${VSIX_NAME}" > "dist/vscode/${VSIX_NAME}.sha256"

      - name: Scan the packaged VSIX for secrets and dev endpoints
        env:
          VSIX_NAME: ${{ steps.metadata.outputs.vsix }}
        run: |
          set -euo pipefail
          rm -rf dist/vscode-unpacked
          unzip -q "dist/vscode/${VSIX_NAME}" -d dist/vscode-unpacked
          node scripts/release/scan-release-artifact.mjs dist/vscode-unpacked
          rm -rf dist/vscode-unpacked

      - name: Exercise the exact verified VSIX in a clean VS Code profile
        env:
          AGI_VSCODE_E2E_VSIX: ${{ github.workspace }}/dist/vscode/${{ steps.metadata.outputs.vsix }}
        run: xvfb-run --auto-servernum pnpm --filter agi-workforce test:integration:vsix

      - name: Upload verified VSIX
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vscode-extension-${{ steps.metadata.outputs.version }}
          path: dist/vscode/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified VSIX to Marketplace
    if: github.event_name == 'push' || inputs.publish == true
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: vscode-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=agiworkforce.agi-workforce
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.VSCODE_MARKETPLACE_AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.VSCODE_MARKETPLACE_AZURE_TENANT_ID }}
      VSIX_PATH: dist/vscode/${{ needs.package.outputs.vsix }}
    steps:
      - name: Checkout the exact packaged release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.package.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pinned publisher tooling
        run: pnpm install --frozen-lockfile

      - name: Download the verified VSIX
        uses: actions/download-artifact@v8
        with:
          name: vscode-extension-${{ needs.package.outputs.version }}
          path: dist/vscode

      - name: Re-verify the release artifact
        run: |
          set -euo pipefail
          sha256sum --check "${VSIX_PATH}.sha256"
          node apps/extension-vscode/scripts/verify-vsix.mjs "$VSIX_PATH"

      - name: Require Marketplace workload identity configuration
        run: |
          set -euo pipefail
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ]; then
            echo "ERROR: vscode-marketplace environment variables VSCODE_MARKETPLACE_AZURE_CLIENT_ID and VSCODE_MARKETPLACE_AZURE_TENANT_ID are required" >&2
            exit 1
          fi

      - name: Authenticate to Microsoft Entra with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # A beta or nightly tag publishes pre-release, so a plain install never
      # picks it up; the channel comes from the tag the package job resolved.
      - name: Publish the previously verified VSIX to its channel
        env:
          VSCE_CHANNEL_ARGS: ${{ needs.package.outputs.vsce_args }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          pnpm --dir apps/extension-vscode exec vsce publish \
            --azure-credential \
            --packagePath "$GITHUB_WORKSPACE/$VSIX_PATH" \
            --no-dependencies $VSCE_CHANNEL_ARGS
