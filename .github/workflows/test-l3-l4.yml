name: Test Priority Levels 3-4 (Gating)

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/test-l3-l4.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/test-l3-l4.yml'

concurrency:
  group: tests-l3-l4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-l3-l4:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_TEST }}
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_TEST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Priority Level 3-4 Tests
        run: pnpm test:l3:l4
        continue-on-error: false

      - name: Upload Coverage
        if: always()
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true
