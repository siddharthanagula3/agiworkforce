name: Test Priority Levels 1-2 (Blocking when populated)

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'crates/**'
      - '.github/workflows/test-l1-l2.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'crates/**'
      - '.github/workflows/test-l1-l2.yml'

concurrency:
  group: tests-l1-l2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-l1-l2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_TEST }}
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_TEST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Priority Level 1-2 Tests
        run: pnpm test:l1:l2
        continue-on-error: false

      - name: Generate Coverage Report
        if: always()
        run: pnpm test:coverage || true

      - name: Upload Coverage to Codecov
        if: always()
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true

      - name: Verify Boundaries
        if: always()
        run: pnpm check:boundaries || echo "Boundary check warning"

      - name: Verify LLM Failures
        if: always()
        run: pnpm check:llm-failures:staged || echo "LLM failure check warning"
