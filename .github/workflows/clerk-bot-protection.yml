name: Clerk Bot Protection

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/check-clerk-bot-protection.mjs'
      - 'scripts/check-clerk-bot-protection.test.mjs'
      - 'apps/web/features/auth/authContract.ts'
      - '.github/workflows/clerk-bot-protection.yml'

permissions:
  contents: read

concurrency:
  group: clerk-bot-protection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspection-logic:
    name: Self-test the bot-protection inspection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: node --test scripts/check-clerk-bot-protection.test.mjs

  inspect-production:
    name: Record whether sign-up bot protection is enabled
    needs: inspection-logic
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL || 'https://agiworkforce.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Inspect the production Clerk instance
        run: node scripts/check-clerk-bot-protection.mjs --target production
