app = 'agiworkforce-upload-scanner'
primary_region = 'sjc'
kill_signal = 'SIGTERM'
kill_timeout = 20

[build]

[deploy]
  strategy = 'bluegreen'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 10
    hard_limit = 25

  [[http_service.checks]]
    grace_period = '180s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
