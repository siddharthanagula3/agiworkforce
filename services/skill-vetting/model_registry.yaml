# Model registry — context window and output token limits for the OPTIONAL
# LLM analyzer. The blocking vetting gate runs with `--no-llm` and does not use
# this file.
#
# AGI policy: model IDs are the single source of truth in
# packages/types/src/models.json. The entries below mirror that catalog
# (context_length = models.json contextWindow). Do not invent or hand-edit IDs;
# add a model here only after it exists in models.json.
#
# Format:
#   models:
#     "<model-id-from-models.json>":
#       context_length: <int>          # models.json contextWindow (required)
#       max_output_tokens: <int>       # model's max output cap (optional)

models:
  'gpt-5.5':
    context_length: 1050000
    max_output_tokens: 128000

  'gpt-5.4-mini':
    context_length: 400000
    max_output_tokens: 128000

  'claude-sonnet-4.6':
    context_length: 200000
    max_output_tokens: 64000

  'claude-opus-4.8':
    context_length: 1000000
    max_output_tokens: 128000

  'gemini-3.5-flash':
    context_length: 1000000
    max_output_tokens: 64000
