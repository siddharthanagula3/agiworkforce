# fly.toml app configuration file generated for agiworkforce-signaling on 2026-01-15T14:50:28-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'agiworkforce-signaling'
primary_region = 'sjc'
kill_signal = 'SIGTERM'
kill_timeout = 35

[deploy]
  strategy = 'rolling'

[build]

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = '10s'
  interval = '15s'
  timeout = '5s'
  method = 'GET'
  path = '/ready'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[env]
  TRUST_PROXY = 'true'
  # Fly's proxy appends the client address and then the app's own address to
  # X-Forwarded-For (docs.fly.io/networking/request-headers), so the client is the
  # second entry from the right. A request without it is refused, never keyed on the proxy.
  TRUSTED_PROXY_HOPS = '2'
  WS_MESSAGE_LIMIT = '100'
  WS_PARTICIPANT_MESSAGES_PER_SECOND = '200'
  WS_PARTICIPANT_MESSAGE_BURST = '2000'
  # Required before this app can serve any WebSocket client.
  # ALLOWED_ORIGINS is a comma-separated allow-list of the exact Origin headers the
  # desktop and mobile clients send. It is intentionally NOT defaulted: with an empty
  # allow-list the server rejects every Origin-bearing WebSocket handshake (close 1008
  # origin_not_configured) and admits only clients presenting a valid
  # x-signaling-internal-secret. Set it before the first production deploy:
  #   fly secrets set ALLOWED_ORIGINS="https://app.example,https://other.example"
  # Also required as secrets (never in this file):
  #   NEON_DATABASE_URL, SIGNALING_INTERNAL_SECRET
  # Required before this relay serves any pairing: SIGNALING_STANDING_URL, the web app's
  # https /api/pair/standing URL. Without it every registration is refused.
  # Optional: SIGNALING_HTTP_URL, SIGNALING_WS_URL, ADMIN_API_KEY
