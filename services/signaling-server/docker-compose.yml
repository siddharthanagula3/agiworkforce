# Docker Compose configuration for the signaling server
# Usage (from this directory):
#   docker compose --profile prod up -d --build
# The build context is the repository root: the Dockerfile installs from the root lockfile.

services:
  # ===========================================================================
  # Production Service
  # ===========================================================================
  signaling-server:
    build:
      context: ../..
      dockerfile: services/signaling-server/Dockerfile
    image: ghcr.io/agiworkforce/signaling-server:latest
    container_name: signaling-server
    profiles:
      - prod
    restart: unless-stopped
    ports:
      - '${PORT:-4000}:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      SIGNALING_HOST: '0.0.0.0'
      SIGNALING_WS_PATH: '${SIGNALING_WS_PATH:-/ws}'
      SIGNALING_HTTP_URL: '${SIGNALING_HTTP_URL:-}'
      SIGNALING_WS_URL: '${SIGNALING_WS_URL:-}'
      SIGNALING_PAIRING_TTL: '${SIGNALING_PAIRING_TTL:-300}'
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-}'
      # Required secrets - must be set in environment or .env file
      NEON_DATABASE_URL: '${NEON_DATABASE_URL:?NEON_DATABASE_URL is required}'
      SIGNALING_INTERNAL_SECRET: '${SIGNALING_INTERNAL_SECRET:?SIGNALING_INTERNAL_SECRET is required}'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777

# ===========================================================================
# Networks
# ===========================================================================
networks:
  default:
    name: signaling-network
    driver: bridge
