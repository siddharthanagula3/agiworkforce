[package]
publish = false
name = "agiworkforce-worktree"
version = "0.1.0"
edition = "2021"
description = "Git worktrees, workspace snapshots and per-turn checkpoints shared by the AGI CLI, its app-server and the desktop."

[lints]
workspace = true

[lib]
name = "agiworkforce_worktree"
path = "src/lib.rs"

[dependencies]
agiworkforce-sandbox-policy = { path = "../agiworkforce-sandbox-policy" }
anyhow = "1"
async-trait = "0.1.89"
chrono = { version = "0.4", features = ["serde"] }
dunce = "1.0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util", "macros"] }
