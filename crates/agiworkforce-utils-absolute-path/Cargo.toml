[package]
publish = false
name = "agiworkforce-utils-absolute-path"
version = "0.1.0"
description = "Filesystem path validation and absolute-path guarantees."
edition = "2024"

[lints]
workspace = true

[lib]
name = "agiworkforce_utils_absolute_path"
path = "src/lib.rs"

[dependencies]
dirs = "6"
dunce = "1.0.4"
path-absolutize = "4.0.1"
schemars = "1.2.0"
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
serde_json = "1"
tempfile = "3.23.0"
