[package]
publish = false
name = "agiworkforce-app-server"
version = "0.0.1"
edition = "2021"
authors = ["AGI Automation LLC"]
description = "Developer-session protocol over JSONL stdio and authenticated WebSocket"
license = "Proprietary"

[lints.rust]
warnings = "warn"
unsafe_code = "deny"
unused = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"
dead_code = "deny"

[dependencies]
agiworkforce-protocol = { path = "../agiworkforce-protocol" }
anyhow = "1"
async-trait = "0.1.89"
bytes = "1"
axum = { version = "0.8", features = ["tokio", "ws"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util", "macros"] }
tokio-tungstenite = "0.29"
