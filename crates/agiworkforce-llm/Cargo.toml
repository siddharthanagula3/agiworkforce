[package]
publish = false
name = "agiworkforce-llm"
version = "0.0.1"
edition = "2024"
description = "AGI Workforce shared LLM provider engine: dialect request building, SSE/NDJSON stream decoding, tool-call delta assembly, and provider error classification."

[lints]
workspace = true

[lib]
name = "agiworkforce_llm"
path = "src/lib.rs"

[dependencies]
bytes = { version = "1", default-features = false }
futures-util = "0.3"
reqwest = { version = "0.13", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"

[dev-dependencies]
base64 = "0.23"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
