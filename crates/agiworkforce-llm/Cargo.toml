[package]
publish = false
name = "agiworkforce-llm"
version = "0.1.0"
edition = "2024"
description = "AGI Workforce shared LLM provider engine: dialect request building, SSE/NDJSON stream decoding, tool-call delta assembly, and provider error classification."

[lints]
workspace = true

[lib]
name = "agiworkforce_llm"
path = "src/lib.rs"

[dependencies]
bytes = { version = "1", default-features = false }
futures-util = "0.3"
# Pinned to the CLI's reqwest line (0.12, default TLS features) so adopting the
# crate does not change the CLI's egress/TLS behavior. The workspace-wide
# reqwest 0.13 + TLS-feature decision is the desktop-convergence PR0 concern
# (docs/plans/rust-engine-extraction-2026-07-09.md), not this crate's.
reqwest = { version = "0.13", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"

[dev-dependencies]
base64 = "0.23"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
