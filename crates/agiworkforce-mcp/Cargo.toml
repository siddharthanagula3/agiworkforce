[package]
publish = false
name = "agiworkforce-mcp"
version = "0.1.0"
edition = "2024"
description = "AGI Workforce shared MCP (Model Context Protocol) client engine: JSON-RPC framing/correlation/timeouts, stdio/SSE/Streamable-HTTP transports, and RFC 9728/8414/7591 OAuth. Transport-agnostic; UI/persistence injected by the host app."

[lints]
workspace = true

[lib]
name = "agiworkforce_mcp"
path = "src/lib.rs"

[dependencies]
agiworkforce-protocol = { path = "../agiworkforce-protocol" }
anyhow = "1"
# Pinned to the CLI's reqwest line (0.12, default TLS features) so adopting the
# crate does not change the CLI's egress/TLS behavior. The workspace-wide
# reqwest 0.13 + TLS-feature decision is the desktop-convergence PR0 concern
# (docs/plans/rust-engine-extraction-2026-07-09.md), not this crate's.
reqwest = { version = "0.13", features = ["stream", "json"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "net", "sync", "time", "rt"] }
tracing = "0.1"
# PKCE (RFC 7636) primitives, S256 challenge + uniform verifier/state sampling.
sha2 = "0.11"
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["tokio"] }
tempfile = "3"

# Scripted fake stdio MCP server used by the integration sim harness. Kept as a
# real bin target so integration tests can spawn it via CARGO_BIN_EXE_mcp_sim_stdio.
[[bin]]
name = "mcp_sim_stdio"
path = "tests/bin/mcp_sim_stdio.rs"
test = false
doc = false
