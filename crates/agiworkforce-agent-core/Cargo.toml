[package]
publish = false
name = "agiworkforce-agent-core"
version = "0.0.1"
edition = "2024"
description = "AGI Workforce shared agent turn-loop engine: model-stream driving, tool-call scheduling (sequential + parallel read-only batches), runaway/iteration/budget guards, and turn-event emission. Host-agnostic, the CLI and desktop implement TurnHost to supply completion, tool dispatch, hooks, approval, and event routing."

[lints]
workspace = true

[lib]
name = "agiworkforce_agent_core"
path = "src/lib.rs"

[dependencies]
# The engine drives the shared LLM layer's assembled outcome + stream events and
# reuses its tool-call type. Pinned transitively to the CLI's reqwest line via
# agiworkforce-llm; this crate itself performs no HTTP.
agiworkforce-llm = { path = "../agiworkforce-llm" }
anyhow = "1"
async-trait = "0.1.89"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
