[package]
publish = false
name = "agiworkforce-utils-image"
version = "0.1.0"
description = "Image decode, transform and cache used by the desktop and CLI."
edition = "2024"

[lints]
workspace = true

[lib]
name = "agiworkforce_utils_image"
path = "src/lib.rs"

[dependencies]
lru = "0.18"
mime_guess = "2.0.5"
sha1 = "0.11.0"
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread"] }
anyhow = "1"
base64 = "0.23.1"
image = { version = "^0.25.9", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
schemars = "1.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.17"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
