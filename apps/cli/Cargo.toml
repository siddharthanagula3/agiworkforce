[package]
publish = false
name = "agiworkforce-cli"
version = "1.7.1"
edition = "2021"
authors = ["AGI Automation LLC"]
description = "Multi-provider agentic CLI, 10+ providers (Anthropic, OpenAI, Google, xAI, DeepSeek, Perplexity, Qwen, Moonshot, Zhipu, Ollama, LM Studio, plus user-defined OpenAI-compatible) in one terminal"
license = "Proprietary"
repository = "https://github.com/siddharthanagula3/agiworkforce"
readme = "README.md"
keywords = ["ai", "agent", "cli", "mcp", "llm"]
categories = ["command-line-utilities", "development-tools"]
default-run = "agi"

[[bin]]
name = "agi"
path = "src/main.rs"

[[bin]]
name = "agiworkforce"
path = "src/bin/agiworkforce.rs"

[lib]
name = "agiworkforce_cli"
path = "src/lib.rs"

[lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"
dead_code = "deny"

[lints.clippy]
await_holding_lock = "warn"

[dependencies]
agiworkforce-agent-core = { path = "../../crates/agiworkforce-agent-core" }
agiworkforce-app-server = { path = "../../crates/agiworkforce-app-server" }
agiworkforce-llm = { path = "../../crates/agiworkforce-llm" }
agiworkforce-model-registry = { path = "../../crates/agiworkforce-model-registry" }
agiworkforce-mcp = { path = "../../crates/agiworkforce-mcp" }
agiworkforce-protocol = { path = "../../crates/agiworkforce-protocol" }
agiworkforce-sandbox-policy = { path = "../../crates/agiworkforce-sandbox-policy" }
agiworkforce-execpolicy = { path = "../../crates/agiworkforce-execpolicy" }
agiworkforce-command-registry = { path = "../../crates/agiworkforce-command-registry" }
agiworkforce-utils-image = { path = "../../crates/agiworkforce-utils-image" }
async-trait = "0.1.89"
shlex = "2.0.1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
colored = "3"
indicatif = "0.18"
dialoguer = "0.12"
reqwest = { version = "0.13", features = ["stream", "json", "multipart"] }
rustyline = "17"
futures-util = { version = "0.3", features = ["sink"] }
dirs = "6"
anyhow = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
sha2 = "0.11"
regex = "1"
bytes = { version = "1.11.1", default-features = false }
cpal = { version = "0.18", optional = true }
hound = { version = "3.5", optional = true }
crossterm = { version = "0.29", features = ["bracketed-paste"] }
ratatui = "0.30"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
cron = "0.13"
axum = { version = "0.8", features = ["tokio", "ws"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
rand = "0.10"
supports-color = "3"
# >=1.2.2 is a SECURITY floor, not a preference: RUSTSEC-2026-0257
# (GHSA-2ph8-5cr8-hr33) lets a caller-supplied URL inject extra browser
# arguments through a `BROWSER` template containing `%s`, because <=1.2.1
# substituted the URL before tokenizing. Do not relax this back to "1".
webbrowser = "1.2.2"
urlencoding = "2"
once_cell = "1.19"
syntect = "5"
two-face = "0.5"
pulldown-cmark = "0.13"
arboard = "3"
tempfile = "3"
keyring = "3"
tokio-tungstenite = "0.24"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process", "user", "fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = { version = "0.5", optional = true }
libc = { version = "0.2", optional = true }

[features]
default = []
# Push-to-talk audio capture (`/voice`). Off by default because `cpal` links
# `libasound.so.2` on Linux, and the dynamic loader resolves DT_NEEDED before
# `main`, so a release binary carrying it exits with `error while loading
# shared libraries` on any host without ALSA (slim containers, most servers)
# before a single line of our code runs. Enable it for desktop builds where
# an audio stack is a safe assumption.
voice = ["dep:cpal", "dep:hound"]
linux-seccomp = ["dep:seccompiler", "dep:libc"]
# Stub feature gate for the Windows AppContainer install path in
# apps/cli/src/policy/windows_sandbox.rs. Declaring it here (even without a
# dep payload) silences `unexpected_cfgs` warnings under rustc 1.91+ on
# Windows. Real AppContainer integration is a v1.8 work item; without the
# feature flag the gated `install_filter` falls through to the no-op stub.
windows-appcontainer = []
# Note: previous "full" feature aggregated 10 optional path-deps to codex-rs port crates.
# Those crates were deleted on 2026-05-03 (preserved at ~/Desktop/reference/codex-cli/).
# No source under apps/cli/src/ references those features (verified via grep). If a
# specific capability is needed in the future, port from reference/codex-cli/ as needed.

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1"
