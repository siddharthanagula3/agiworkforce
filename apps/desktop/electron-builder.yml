# electron-builder configuration for the AGI cloud desktop shell.
#
# One Desktop surface, two shells (apps/desktop/AGENTS.md): this packages the
# cloud-only Electron shell. Identity is distinct from the Tauri app
# (com.agiworkforce.desktop / "AGI") so both installers coexist on one machine.
#
# Release tags use `v-cloud-desktop-<semver>` (see
# .github/workflows/release-desktop-cloud.yml). Never attach these assets to a
# `v-desktop-*` release: the Tauri updater feed and /api/download match by tag
# prefix and first-asset heuristics, and mixing assets would cross the streams.
appId: com.agiworkforce.desktop.cloud
productName: AGI Cloud
electronLanguages:
  - en

directories:
  output: release
  buildResources: electron/resources

files:
  - dist/**
  - electron/dist/**
  - '!electron/dist/bin/**'
  - '!electron/dist/agi-input'
  - '!node_modules'

# The macOS input helper is a separate Mach-O executable, so it must sit in
# Contents/Resources rather than in the asar: electron-builder signs it there
# with the app's identity and notarization covers it with the bundle.
extraResources:
  - from: electron/dist/bin/${arch}/agi-input
    to: agi-input
  - from: electron/dist/bin/${arch}/agi
    to: agi-cli/agi

beforePack: ./electron/bundleBinaries.mjs

# The cloud-shell link scheme, declared once for every platform: the macOS
# Info.plist (handled through `open-url`), the Linux desktop entry's
# x-scheme-handler MimeType and the Windows package manifests (handled through
# `second-instance` and the launch argv). A Windows NSIS install is registered
# at runtime by app.setAsDefaultProtocolClient in main.ts.
protocols:
  - name: AGI Cloud link
    role: Viewer
    schemes:
      - agiworkforce-cloud

mac:
  category: public.app-category.productivity
  # Explicit arch marker on every artifact: the default x64 names omit it
  # ("AGI Cloud-1.0.0.dmg"), which breaks arch-aware selection in the
  # website download route and human triage on the releases page. No space
  # either: GitHub stores an uploaded "AGI Cloud-..." as "AGI.Cloud-...", so
  # the asset would match neither SHA256SUMS nor the file a user downloads.
  artifactName: AGI-Cloud-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: >-
      AGI uses your microphone to accept voice commands and transcribe speech
      for hands-free automation. You can disable this in Privacy settings.
  # Signing identity comes from CSC_LINK / CSC_KEY_PASSWORD; notarization from
  # APPLE_API_KEY (path to .p8) + APPLE_API_KEY_ID + APPLE_API_ISSUER. See the
  # secret remapping in .github/workflows/release-desktop-cloud.yml.
  notarize: true

dmg:
  sign: false
