<!doctype html>
<!-- data-chat-theme="cool" selects the ChatGPT-leaning palette from
     @agiworkforce/design-tokens/chat.css, matching apps/web's chat surface
     (WebChatPage sets the same attribute). Founder decision 2026-07-27:
     desktop + both extensions follow ChatGPT colors. Safe to set statically —
     applyTheme() only writes --background/--foreground-family properties and
     never --chat-*, so named themes still win where they apply. -->
<html lang="en" data-chat-theme="cool">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <title>AGI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
