[package]
publish = false
name = "agiworkforce-desktop"
version = "1.2.0"
edition = "2021"
authors = ["AGI Automation LLC"]
description = "AGI Workforce desktop shell"
license = "Proprietary"
default-run = "agiworkforce-desktop"

[lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"
dead_code = "deny"
unused_attributes = "deny"
unused_qualifications = "allow"
unused_results = "allow"

[lints.clippy]
# FIX-032 (Sprint 5): enforce that no std::sync::MutexGuard (or RwLockGuard)
# is held across an await point. CI runs clippy with -D warnings, so this is
# a blocking lint. If a hot async path genuinely needs sync locking, refactor
# the lock scope into a block expression that returns the cloned data, or
# switch to tokio::sync::Mutex.
await_holding_lock = "warn"

[dependencies]
agiworkforce-agent-core = { path = "../../../crates/agiworkforce-agent-core" }
agiworkforce-execpolicy = { path = "../../../crates/agiworkforce-execpolicy" }
agiworkforce-llm = { path = "../../../crates/agiworkforce-llm" }
agiworkforce-model-registry = { path = "../../../crates/agiworkforce-model-registry" }
agiworkforce-mcp = { path = "../../../crates/agiworkforce-mcp" }
agiworkforce-protocol = { path = "../../../crates/agiworkforce-protocol" }
agiworkforce-sandbox-policy = { path = "../../../crates/agiworkforce-sandbox-policy" }

tauri = { version = "2.11.0", features = ["tray-icon", "macos-private-api", "isolation"] }
tauri-plugin-shell = { version = "2.3.5", optional = true }
tauri-plugin-process = "2.3.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-updater = { version = "2.10.0", optional = true }
tauri-plugin-autostart = "2.5.1"
# Embedded WebDriver server for WebdriverIO E2E testing (https://webdriver.io/docs/desktop-testing/tauri).
# Cargo has no supported way to gate a *dependency* on cfg(debug_assertions), only
# target-family cfgs are allowed there (confirmed: using it emits "will not work as
# expected" and the crate is linked regardless). So the crate is always a dependency
# (keeps its permission schema valid for capabilities/default.json in every profile);
# the plugin is only ever *registered*, and its HTTP server only ever starts, behind
# #[cfg(debug_assertions)] in lib.rs, which is release-safe.
tauri-plugin-wdio-webdriver = "1"
# Companion plugin (distinct crate from the one above) adding browser.tauri.execute()
# and IPC command mocking to the same @wdio/tauri-service test harness -- same
# always-a-dependency / debug-only-registration rationale as above.
tauri-plugin-wdio = "1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-global-shortcut = "2.3.0"
# DESK-09: the encrypted SQLite database has no cross-process lock, so a second
# launch must never reach the storage layer. The deep-link feature forwards a
# URL opened while the app is running (Windows/Linux launch a fresh process for
# it) into the instance that is already holding the database.
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }





tokio = { version = "1.37", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "compat"] }
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"


serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
bincode = "1.3.3"

once_cell = "1.19"
shlex = "1.3"
# Safe URL/file opener: uses ShellExecuteW on Windows (no cmd.exe re-parsing),
# `open` on macOS, xdg-open on Linux, each handed a single argv element.
open = "5"



anyhow = "1.0"
thiserror = "2.0"


# Note: bundled-sqlcipher requires libclang at build time on some platforms.
# Install via: brew install llvm (macOS) or apt install libclang-dev (Linux).
rusqlite = { version = "0.32.1", features = ["bundled-sqlcipher-vendored-openssl", "backup", "blob", "chrono"] }
# tokio-rusqlite removed, replaced by data/async_sqlite.rs wrapper to resolve libsqlite3-sys conflict
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"], optional = true }
postgres-types = { version = "0.2", features = ["derive", "with-serde_json-1", "with-chrono-0_4", "with-uuid-1"], optional = true }
deadpool-postgres = { version = "0.14", optional = true }
mysql_async = { version = "0.37", optional = true }
# default features pull compat-3-0-0 -> bson-2, which collides with the bson 3
# we depend on directly: every Document crossing the boundary is a different
# type. bson-3 aligns them. dns-resolver stays because mongodb+srv:// URIs
# (every Atlas connection string) resolve SRV records through it.
mongodb = { version = "3.8", optional = true, default-features = false, features = [
  "compat-3-3-0",
  "rustls-tls",
  "dns-resolver",
  "bson-3",
] }
redis = { version = "~1.1", features = ["aio", "tokio-comp", "connection-manager"], optional = true }
bson = { version = "3.1", optional = true }


# HIGH-008: "blocking" feature removed, refresh_oauth_token is now async.
reqwest = { version = "0.13", features = ["json", "stream", "rustls", "multipart", "form", "query"], default-features = false }
reqwest-middleware = "0.5"
reqwest-retry = "0.9"
urlencoding = "2.1"
mime_guess = "2.0"
bytes = "1.5"


# oauth2 4.x is the sole path to reqwest 0.11 -> rustls 0.21 -> rustls-webpki
# 0.101.7, whose 0.101 line is dead: RUSTSEC-2026-0098/0099 (name constraints
# accepted for URI and wildcard names) and RUSTSEC-2026-0104 (panic while
# parsing a CRL, reached before the CRL signature is checked) are only patched
# on 0.103.12+. The default `rustls-tls` feature is therefore off; the OAuth
# token exchanges verify with the platform trust store instead.
#
# Read that as the trade it is, not as consistency. This binary's OWN reqwest
# (below) is deliberately rustls-only, so OAuth token exchange is now the one
# first-party HTTP path on a different trust model, it follows the OS trust
# store, including any enterprise root an administrator has installed, while
# every other first-party call pins to webpki-roots. lettre and async-stripe
# already use native-tls, so the backend is present either way and no new crate
# class enters the tree; the divergence is in policy, not in dependencies.
# Removing it is the point of the oauth2 5.x port below.
# Dropping this backend swap for oauth2 5.x needs the call sites in
# core/mcp/oauth.rs and sys/security/oauth.rs ported off `async_http_client`.
oauth2 = { version = "4.4", default-features = false, features = ["reqwest", "native-tls"] }


enigo = { version = "0.6", features = ["serde"] }
rdev = "0.5"
xcap = "0.0.12"
arboard = "3.4"


portable-pty = "0.8"
which = "6.0"


# Audio capture and voice activity detection
cpal = "0.15"
# WebRTC VAD - simple and reliable voice activity detection
# Note: As an alternative to Silero VAD via ONNX, webrtc-vad is simpler to integrate
webrtc-vad = { version = "0.4", optional = true }
# Local speech-to-text with Whisper.cpp (offline transcription)
whisper-rs = { version = "0.11", optional = true }
# For extracting Piper binary archives
tar = "0.4"

argon2 = "0.5"
machine-uid = "0.3"  # For getting machine-unique identifiers
hostname = "0.4"     # For getting machine hostname as part of key derivation salt
sha2 = "0.10"
subtle = "2"
# SEV-DESK-16: replaces the hand-rolled `secure_zeroize` (with its
# `#[allow(unsafe_code)]` block) with the audited `zeroize` crate.
zeroize = "1"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
pbkdf2 = { version = "0.12", features = ["simple"] }
hmac = "0.12"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["pkcs8", "rand_core"] } # For update signature verification


image = { version = "0.25", features = ["png", "jpeg", "webp"] }
imageproc = "0.26.1"


tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"


webrtc = { version = "0.14", optional = true }
tokio-tungstenite = { version = "0.21", features = ["handshake"] }


tungstenite = { version = "0.21", features = ["handshake"] }
url = "2.5"


uuid = { version = "1.8", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.12"
tokio-cron-scheduler = "0.15"


config = "0.14"
toml = "0.8"
serde_yaml = "0.9"


notify = "6.1"
walkdir = "2.5"
glob = "0.3"
dirs = "5.0"


regex = "1.10"
unicode-segmentation = "1.11"


rayon = "1.10"
dashmap = "6.1"
parking_lot = "0.12"
sysinfo = "0.30"
tiktoken-rs = "0.9.1"
lazy_static = "1.4"
libc = "0.2"
cap-std = "4.0.2"


flate2 = "1.0"
zip = "1"


pdf-extract = "0.12"
lopdf = "0.42"
roxmltree = "0.20"
calamine = { version = "0.36.1", features = ["chrono"] }


docx-rs = "0.4"              
rust_xlsxwriter = "0.77"      
printpdf = { version = "0.12.5", default-features = false }


tempfile = "3.10"


tesseract = { version = "0.15", optional = true }


llama-cpp-2 = { version = "0.1", optional = true }


async-imap = "0.9"
tokio-native-tls = "0.3"
lettre = { version = "0.11.22", features = ["tokio1-native-tls", "builder", "smtp-transport"] }
mailparse = "0.15"


git2 = { version = "0.21", features = ["vendored-openssl", "cred"] }
tauri-plugin-deep-link = "2.4.9"
# B1: BYOK encrypted key vault, vendored as published crate (MIT/Apache-2.0).
# kdf feature (default-on) enables Argon2id password hashing for the snapshot.
tauri-plugin-stronghold = "2.3.1"


[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
winreg = "0.55"
windows = { version = "0.56", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct3D11",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Registry",
    "Win32_System_Power",
    "Media_SpeechRecognition",
    "Storage_Streams",
    "Globalization"
] }

[target.'cfg(target_os = "linux")'.dependencies]
# keyring 3 has no platform defaults. Use the persistent Secret Service +
# kernel-keyring store instead of its process-local mock backend.
keyring = { version = "3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
# keyring 3 has no platform defaults. Without this feature it silently uses a
# process-local mock and a freshly encrypted database becomes unreadable after
# restart.
keyring = { version = "3", default-features = false, features = ["apple-native"] }
accessibility-sys = "0.1.2"
core-foundation = "0.9"
core-graphics = "0.24"
io-kit-sys = "0.5.0"
objc = "0.2"
cocoa = "0.25"

[features]
default = ["shell", "updater", "billing", "vad"]
# devtools: enable only for development, cargo build --features devtools
# remote-databases: enable only when user needs external DB connections, cargo build --features remote-databases
devtools = ["tauri/devtools"]
# Note: "ocr" feature requires Tesseract to be installed on the system
# Enable with: cargo build --features ocr
# Install Tesseract: brew install tesseract (macOS) or apt install tesseract-ocr libtesseract-dev (Linux)
ocr = ["tesseract"]
local-llm = ["llama-cpp-2"]
webrtc-support = ["webrtc"]
billing = []
shell = ["dep:tauri-plugin-shell"]
updater = ["dep:tauri-plugin-updater"]
# Voice Activity Detection with WebRTC VAD
vad = ["dep:webrtc-vad"]
# Local Whisper STT (offline speech-to-text)
# Requires whisper.cpp to be built - see whisper-rs docs
local-whisper = ["dep:whisper-rs"]
# Remote database clients (PostgreSQL, MySQL, MongoDB, Redis)
# These add significant binary size; only enable if the user needs to connect to remote databases.
remote-databases = ["dep:tokio-postgres", "dep:postgres-types", "dep:deadpool-postgres", "dep:mysql_async", "dep:mongodb", "dep:redis", "dep:bson"]



[build-dependencies]
tauri-build = { version = "2.5.6", features = ["isolation"] }

[dev-dependencies]
tempfile = "3.10"
mockall = "0.12"
serial_test = "4.0.1"
tauri = { version = "2.11.0", features = ["test"] }
criterion = "0.5"
proptest = "1.4"




[[bench]]
name = "automation_benchmarks"
harness = false

[[bench]]
name = "agi_benchmarks"
harness = false
