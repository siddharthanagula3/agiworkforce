  <script>
    (function () {
      // Execute immediately before the browser parses the rest of the body
      if (window.innerWidth < 768) {
        const observer = new MutationObserver((mutations) => {
          const videoWrapper = document.querySelector('.hp-0426--hero-video');

          if (videoWrapper) {
            // 1. Remove the URL attributes so Webflow's script has nothing to load
            videoWrapper.removeAttribute('data-video-urls');
            videoWrapper.setAttribute('data-autoplay', 'false');

            // 2. Find and kill the existing video tag and its sources
            const videoTag = videoWrapper.querySelector('video');
            if (videoTag) {
              videoTag.pause();
              videoTag.src = '';
              videoTag.load();
              videoTag.remove(); // Remove completely to save memory
            }

            console.log('Mobile: Orb Video blocked to save PageSpeed.');
            observer.disconnect(); // Stop looking once found
          }
        });

        observer.observe(document.documentElement, { childList: true, subtree: true });
      }
    })();
  </script>
