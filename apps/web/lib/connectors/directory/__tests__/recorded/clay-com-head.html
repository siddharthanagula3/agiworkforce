    /* --- CARDS --- */

    /* Card clip → grid, so cards stack in one cell */
    [data-module='rotate'] :has(> [data-uses='card']) {
      display: grid;
    }

    /* Every card occupies the same grid cell (stacked) */
    [data-module='rotate'] [data-uses='card'] {
      grid-area: 1 / 1;
    }

    /* Show only the first card; script re-reveals the active one */
    [data-module='rotate'] [data-uses='card']:not(:first-child) {
      opacity: 0;
      visibility: hidden;
    }

    /* --- TEXT STACK --- */

    /* Shared text clip → grid + start-aligned (matches script) */
    [data-module='rotate'] [data-uses='text-list'] {
      display: grid;
      justify-content: start;
      justify-items: start;
    }

    /* Each lifted text occupies the same cell (stacked) */
    [data-module='rotate'] [data-uses='text-list'] > [data-uses='text'] {
      grid-area: 1 / 1;
    }

    /* Hide in-card text copies until the script lifts them into the list.
   Self-clearing: once moved out of the card, this selector no longer matches. */
    [data-module='rotate'] [data-uses='card'] [data-uses='text'] {
      opacity: 0;
      visibility: hidden;
