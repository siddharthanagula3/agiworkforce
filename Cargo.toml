[workspace]
members = [
  "apps/desktop/src-tauri",
  "apps/cli",
  "crates/*",
]
# 2026-07-08 restructure P0: dead crates removed (agiworkforce-apply-patch,
# agiworkforce-plugin-runtime, agiworkforce-task-runtime — zero dependents).
# Both binaries now path-depend on the shared harness crates (agent-core, llm,
# mcp, model-registry, protocol, sandbox-policy, execpolicy); the CLI adds
# app-server, command-registry and utils-image. What remains unconverged is the
# desktop's two chat engines (core/agi/core.rs and
# sys/commands/chat/send_message_execution.rs), tracked in
# docs/plans/rust-engine-extraction-2026-07-09.md.
exclude = []
resolver = "2"

# Workspace-wide clippy lints (codex-rs `Cargo.toml#[workspace.lints.clippy]`
# pattern per MASTER_PLAN.md Appendix C). Conservative subset: omits
# `unwrap_used` and `expect_used` (the codebase currently has 2,409 such
# sites; flagging them all at once would block every build). Phase B+
# fires reduce that number; we'll re-add those two rules when the count
# is small enough to gate per-PR.
#
# Per-crate Cargo.toml files inherit via `[lints] workspace = true`.
[workspace.lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
panic = "abort"




[profile.dev]
# line-tables-only keeps file-and-line backtraces, which is what panics and CI
# failures need, without the full DWARF that took target/debug to 49 GB.
debug = "line-tables-only"
opt-level = 0
split-debuginfo = "off"


[profile.dev.package."*"]
debug = 0
opt-level = 0

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }
# xcb 1.7.0's published build dependency is quick-xml 0.30, which is
# vulnerable to RUSTSEC-2026-0194/0195. Upstream has merged the quick-xml 0.41
# migration but has not published a new xcb release yet. Pin the reviewed
# upstream commit until a crates.io release contains the same fix.
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }
